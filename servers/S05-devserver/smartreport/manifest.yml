# manifest.yml — Ficha smartreport (SBOS-005 §devserver)
# SBOS-049 §4 · Order 182 · Deployment
identity:
  id: smartreport
  version: "1.0"
  category: 1
  criticality: false
  server: S05
  description: "Advanced BI and reporting (MIT SKULL)"

workload:
  type: Deployment

order:
  execution_order: 182

requirements:
  dependencies:
    - postgresql


deployment:
  strategy: RollingUpdate

governance:


  # BLOQUEADO: imagen skull/* privada — requiere imagePullSecrets configurados.
  auto_install: false
  requires_approval: false
health:
  type: command
  command: "kubectl get pods -A -l app=smartreport --no-headers 2>/dev/null | grep -c Running || true"
  interval_seconds: 30
  timeout_seconds: 10


license: MIT

meta:
  backend: kubernetes
  idempotent: true
  estimated_minutes: 5
  rollback_support: false
