---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: smartorc-sa
  namespace: sbos-apps
---
apiVersion: v1
kind: Service
metadata:
  name: smartorc
  namespace: sbos-apps
spec:
  clusterIP: None
  selector:
    app: smartorc
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: smartorc
  namespace: sbos-apps
spec:
  serviceName: smartorc
  replicas: 1
  selector:
    matchLabels:
      app: smartorc
  template:
    metadata:
      labels:
        app: smartorc
    spec:
      serviceAccountName: smartorc-sa
      containers:
        - name: smartorc
          image: skull/smartorc:latest
          ports:
            - containerPort: 8080
              name: http

          resources:
            requests:
              cpu: 50m
              memory: "32Mi"
            limits:
              cpu: 1000m
              memory: 512Mi
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10


