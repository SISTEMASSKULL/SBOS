# manifest.yml — Ficha smartorc (SBOS-005 §devserver)
# SBOS-049 §4 · Order 186 · Deployment
identity:
  id: smartorc
  name: SmartORC
  version: "1.0"
  category: 1
  criticality: false
  server: devserver
  description: "Correspondence management (MIT SKULL)"

workload:
  type: Deployment
  namespace: sbos-apps
  replicas: 1
  service_account: smartorc-sa

order:
  execution_order: 186
  timeout_minutes: 10

requirements:
  dependencies:
    - postgresql
  cpu_request: "200m"
  cpu_limit: "1000m"
  memory_request: "256Mi"
  memory_limit: "512Mi"


deployment:
  strategy: RollingUpdate

governance:


  # BLOQUEADO: imagen skull/* privada — requiere imagePullSecrets configurados.
  auto_install: false
  accion: INSTALAR
  requires_approval: false
health:
  check_command: "curl -sf http://localhost:8080/health"
  check_interval_seconds: 30
  check_timeout_seconds: 10
  consecutive_failures_threshold: 3


meta:
  backend: kubernetes
  idempotent: true
  estimated_minutes: 5
  rollback_support: false
