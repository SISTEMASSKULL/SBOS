---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: smartpay-sa
  namespace: sbos-apps
---
apiVersion: v1
kind: Service
metadata:
  name: smartpay
  namespace: sbos-apps
spec:
  clusterIP: None
  selector:
    app: smartpay
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: smartpay
  namespace: sbos-apps
spec:
  serviceName: smartpay
  replicas: 1
  selector:
    matchLabels:
      app: smartpay
  template:
    metadata:
      labels:
        app: smartpay
    spec:
      serviceAccountName: smartpay-sa
      containers:
        - name: smartpay
          image: skull/smartpay:latest
          ports:
            - containerPort: 8080
              name: http

          resources:
            requests:
              cpu: 50m
              memory: "32Mi"
            limits:
              cpu: 1000m
              memory: 512Mi
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10


