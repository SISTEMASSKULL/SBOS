# manifest.yml — Ficha certbot (SBOS S16-webserver)
# BC-13 · SBOS-049 §4 · SBOS-050 · Order 371
# Emisión y renovación automática de certificados por dominio de cliente
identity:
  id: certbot-web
  name: certbot-web — TLS por Dominio de Cliente (S16)
  version: "2.11"
  category: 1
  criticality: true
  server: webserver
  description: "Gestor automático de certificados Let's Encrypt por dominio personalizado de cliente (ACME v2). Un cert por tenant, renovación automática."

workload:
  type: CronJob
  namespace: sbos-web
  schedule: "0 3 * * *"
  service_account: certbot-sa
  restart_policy: OnFailure

order:
  execution_order: 371

requirements:
  dependencies:
    - nginx
  cpu_request: "100m"
  cpu_limit: "500m"
  memory_request: "128Mi"
  memory_limit: "256Mi"

ports: []

governance:
  auto_install: true
  requires_approval: false
  category_label: tls-manager

health:
  type: command
  check_command: "kubectl get cronjob certbot -n sbos-web -o jsonpath='{.spec.schedule}'"
  check_interval_seconds: 3600
  check_timeout_seconds: 30
  consecutive_failures_threshold: 2

meta:
  backend: kubernetes
  idempotent: true
  estimated_minutes: 2
  rollback_support: false
