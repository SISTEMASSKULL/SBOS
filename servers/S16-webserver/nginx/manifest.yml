# manifest.yml — Ficha nginx (SBOS S16-webserver)
# BC-13 · SBOS-049 §4 · SBOS-050 · Order 370
# Reverse proxy + TLS termination para dominios de cliente multi-tenant
identity:
  id: nginx
  name: nginx — Web Proxy Multi-tenant
  version: "1.26"
  category: 1
  criticality: true
  server: webserver
  description: "Reverse proxy + TLS termination multi-tenant. Sirve dominios personalizados de cada cliente con cert individual (certbot) y WAF (modsecurity)."

workload:
  type: Deployment
  namespace: sbos-web
  replicas: 1
  service_account: nginx-sa
  strategy: RollingUpdate

order:
  execution_order: 370

requirements:
  dependencies:
    - certbot
    - kong
  cpu_request: "200m"
  cpu_limit: "1000m"
  memory_request: "256Mi"
  memory_limit: "512Mi"

ports:
  - name: http
    port: 80
    protocol: TCP
    description: "HTTP (redirect a HTTPS + ACME HTTP-01 challenge)"
  - name: https
    port: 443
    protocol: TCP
    description: "HTTPS TLS termination — dominios de cliente"

governance:
  auto_install: true
  requires_approval: false
  category_label: web-proxy

health:
  type: http
  check_path: /healthz
  check_port: 80
  check_interval_seconds: 30
  check_timeout_seconds: 10
  consecutive_failures_threshold: 3

meta:
  backend: kubernetes
  idempotent: true
  estimated_minutes: 3
  rollback_support: true
