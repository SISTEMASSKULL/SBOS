# =============================================================================
# fichas-plan.yml — Plan maestro de instalación automática de fichas SBOS
# =============================================================================
# Este archivo sobreescribe el campo auto_install de cada manifest.yml.
# BOS lo lee al arrancar y en cada Reload().
#
# Uso:
#   true  → el observer instala la ficha automáticamente al detectarla como PENDING
#   false → la ficha queda en reposo; el operador la activa manualmente con:
#             bosctl ficha install <nombre>
#
# Después de editar este archivo, transferir a la VPS y reiniciar el observer:
#   bosctl daemon reload
#
# Fichas no listadas aquí conservan el valor de su manifest.yml.
# =============================================================================
version: 1

fichas:

  # ── S00 — Host / Bootstrap ─────────────────────────────────────────────────
  bos-preflight:                true
  sbos-bootstrap-os:            true
  sbos-bootstrap-k8s:           true
  sbos-bootstrap-cni:           true
  sbos-bootstrap-storage:       true
  sbos-bootstrap-platform:      true
  sbos-bootstrap-monitoring:    true
  sbos-namespace:               true
  local-path-provisioner:       true
  kyverno:                      true
  network-validator:            true
  sbos-fichas-migrator:         true
  sbos-lifecycle:               true
  k8s-upgrader:                 false   # solo en ventanas de mantenimiento
  container-watchdog:           true
  nginx-web:                    true
  sbos-bi18n:                   true
  # daemons SBOS — desactivados hasta que estén certificados
  sbos-bkernel:                 false
  biedata:                      false
  sbos-security:                false
  sbos-package-manager:         false
  sbos-repair:                  false
  sbos-bootstrap-hardening:     false
  cert-rotation:                false   # tarea de mantenimiento — solo en ventanas programadas
  compliance-check:             false   # escaneo — activar bajo demanda
  linkerd:                      false   # service mesh pesado — no necesario en dev

  # ── S01 — Data ─────────────────────────────────────────────────────────────
  postgresql:                   true
  redis:                        true
  mysql:                        true
  mongodb:                      true
  pgbouncer:                    true
  minio:                        true
  sbos-database-init:           true
  pg-partman:                   true
  pg-stat-monitor:              true
  symmetricds:                  true
  timescaledb:                  true
  pgadmin4:                     true
  ferretdb:                     false   # alternativa MongoDB — no necesaria aún
  citus:                        false   # PostgreSQL distribuido — requiere cluster multi-nodo; inútil en VPS único
  pgbackrest:                   false   # backup — activar cuando haya almacenamiento externo

  # ── S02 — Gateway ──────────────────────────────────────────────────────────
  kong:                         true
  nginx:                        true
  vault:                        true
  sbos-kong-tenant:             true
  certbot:                      true
  modsecurity:                  true
  nginx-multitenant:            true
  besu-qbft:                    true    # dependencia de bAuth — nodo validador blockchain
  bhnexus:                      false   # hardware proxy — activar con hardware físico
  banexus:                      false   # hardware proxy — activar con hardware físico
  oauth2-proxy-gateway:         false
  vault-unsealer:               false

  # ── S03 — Identity ─────────────────────────────────────────────────────────
  keycloak:                     true
  wazuh-manager:                true
  bauth:                        false   # daemon bAuth — activar cuando esté certificado
  bnotify:                      false   # daemon bNotify — activar cuando esté certificado
  oauth2-proxy:                 false
  openvas:                      false   # scanner de vulnerabilidades — bajo demanda
  wazuh-indexer:                false

  # ── S04 — ERP ──────────────────────────────────────────────────────────────
  tryton:                       true
  tryton-workers:               true
  tryton-cron:                  true
  rabbitmq-erp:                 true

  # ── S05 — Dev ──────────────────────────────────────────────────────────────
  smartrates:                   false
  smartorc:                     false
  smartvaultflow:               false
  smartportfolio:               false
  smartpay:                     false
  smartreport:                  false
  smarttax:                     false

  # ── S06 — Apps ─────────────────────────────────────────────────────────────
  directus:                     true
  openproject:                  true
  trilium:                      false   # duplicado — usar trilium-notes (S08, v0.63.7) que es más reciente
  vaultwarden:                  true
  wikijs:                       true
  calcom:                       true
  easyappointments:             false
  espocrm:                      false
  gnuhealth:                    true
  limesurvey:                   false
  novu:                         true
  orangehrm:                    true
  saleor:                       false
  taiga:                        false
  tastyigniter:                 false
  zammad:                       false
  authelia:                     false
  sbos-notifier:                false

  # ── S07 — Report ───────────────────────────────────────────────────────────
  airflow:                      true
  pdfjs:                        true
  jasperstarter:                true
  jaspersoft:                   false   # pesado — activar bajo demanda
  openmetadata:                 false   # pesado (~800MB) — activar bajo demanda
  superset:                     false

  # ── S08 — Docs ─────────────────────────────────────────────────────────────
  docuseal:                     false
  paperless-ngx:                true
  solr:                         true
  kimios:                       false
  trilium-notes:                true
  tabula:                       true
  tesseract:                    false
  tesseract-ocr:                false
  camelot:                      false   # redundante con tabula — ambos extraen tablas de PDF; usar solo tabula

  # ── S09 — Search ───────────────────────────────────────────────────────────
  rabbitmq-search:              true
  bsearch:                      false   # daemon bSearch — activar cuando esté certificado
  elasticsearch:                false   # pesado — activar bajo demanda
  rabbitmq:                     false

  # ── S10 — Comms ────────────────────────────────────────────────────────────
  stalwart:                     false
  postfix:                      false   # incluido dentro de mailserver all-in-one
  roundcube:                    true
  spamassassin:                 false   # incluido dentro de mailserver all-in-one
  centrifugo:                   true
  clamav:                       false   # incluido dentro de mailserver all-in-one
  mattermost:                   false
  postfixadmin:                 true
  dovecot:                      false   # incluido dentro de mailserver all-in-one
  mailserver:                   true    # docker-mailserver 14.0 — Postfix+Dovecot+SpamAssassin+ClamAV+Rspamd all-in-one
  rocketchat:                   true
  cypht:                        false   # redundante con roundcube; dos clientes webmail innecesarios
  freepbx:                      false   # VoIP — activar cuando haya hardware SIP

  # ── S11 — VDI ──────────────────────────────────────────────────────────────
  guacamole:                    true
  fedora-kde:                   true
  nextcloud:                    true
  onlyoffice:                   false   # pesado (~600MB) — activar cuando se necesite edición online

  # ── S12 — Monitor ──────────────────────────────────────────────────────────
  prometheus:                   false
  grafana:                      false
  loki:                         false
  alertmanager:                 false
  tempo:                        false
  alloy:                        false
  zabbix:                       false
  postgresql-extensions:        true
  kube-state-metrics:           false
  node-exporter:                false

  # ── S13 — Geo ──────────────────────────────────────────────────────────────
  fleetbase:                    true
  traccar:                      true
  cardmesh:                     false
  novosga:                      false
  xibo:                         true

  # ── S14 — Ops ──────────────────────────────────────────────────────────────
  searxng:                      true
  goss:                         false
  velero:                       false   # backup K8s — necesita backend S3/MinIO configurado; no funciona solo
  bareos:                       false   # backup archivos — activar cuando haya servidor dedicado
  gitlab:                       false   # pesado — activar en servidor dedicado
  trivy:                        false
  pgbackrest-svc:               false
  k6:                           false

  # ── S15 — AI ───────────────────────────────────────────────────────────────
  ollama:                       true    # LLM local — dependencia de bCompass
  qdrant:                       true    # vector DB — dependencia de bCompass
  flowise:                      false
  langfuse:                     false
  open-webui:                   false
  bcompass-svc:                 true    # daemon bCompass — en desarrollo activo
  embedding-worker:             true    # generación de embeddings — dependencia de bCompass

  # ── S16 — Web ──────────────────────────────────────────────────────────────
  certbot:                      false   # ya está en S02 activo; no duplicar en S16
  modsecurity:                  false
  weblate:                      true
