---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pgbouncer-sa
  namespace: sbos-data
---
apiVersion: v1
kind: Service
metadata:
  name: pgbouncer
  namespace: sbos-data
spec:
  clusterIP: None
  selector:
    app: pgbouncer
  ports:
    - name: http
      port: 6432
      targetPort: 6432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: pgbouncer
  namespace: sbos-data
spec:
  serviceName: pgbouncer
  replicas: 1
  selector:
    matchLabels:
      app: pgbouncer
  template:
    metadata:
      labels:
        app: pgbouncer
    spec:
      serviceAccountName: pgbouncer-sa
      containers:
        - name: pgbouncer
          image: docker.io/pgbouncer/pgbouncer:1.23.1
          ports:
            - containerPort: 6432
              name: pgbouncer
          env:
            - name: DATABASES_HOST
              value: "postgresql.sbos-data.svc.cluster.local"
            - name: DATABASES_PORT
              value: "5432"
            - name: DATABASES_USER
              value: "postgres"
            - name: DATABASES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgresql-secret
                  key: password
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            tcpSocket:
              port: 6432
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: 6432
            initialDelaySeconds: 10
            periodSeconds: 10


