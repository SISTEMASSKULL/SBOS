---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pgbackrest-sa
  namespace: sbos-data
---
# pgbackrest: herramienta de backup para PostgreSQL
# Imagen oficial con pgbackrest pre-instalado (Ubuntu-based)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgbackrest
  namespace: sbos-data
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: pgbackrest
  template:
    metadata:
      labels:
        app: pgbackrest
    spec:
      serviceAccountName: pgbackrest-sa
      containers:
        - name: pgbackrest
          image: docker.io/pgbackrest/pgbackrest:2.52-1
          command: ["sleep", "infinity"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            exec:
              command: ["pgbackrest", "version"]
            initialDelaySeconds: 30
            periodSeconds: 60
          readinessProbe:
            exec:
              command: ["pgbackrest", "version"]
            initialDelaySeconds: 15
            periodSeconds: 30
