---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pgbackrest-sa
  namespace: sbos-data
---
apiVersion: v1
kind: Service
metadata:
  name: pgbackrest
  namespace: sbos-data
spec:
  type: ClusterIP
  selector:
    app: pgbackrest
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgbackrest
  namespace: sbos-data
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: pgbackrest
  template:
    metadata:
      labels:
        app: pgbackrest
    spec:
      serviceAccountName: pgbackrest-sa
      containers:
        - name: pgbackrest
          image: ghcr.io/pgbackrest/pgbackrest:release-2.52
          command: ["sleep", "infinity"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            exec:
              command: ["pgbackrest", "version"]
            initialDelaySeconds: 15
            periodSeconds: 60
          readinessProbe:
            exec:
              command: ["pgbackrest", "version"]
            initialDelaySeconds: 10
            periodSeconds: 30


