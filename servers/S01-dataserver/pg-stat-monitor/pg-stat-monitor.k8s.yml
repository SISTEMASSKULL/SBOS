---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pg-stat-monitor-sa
  namespace: sbos-data
---
# pg_stat_monitor es una extensión instalada en el PostgreSQL SBOS.
# Este Job habilita la extensión si no está habilitada.
apiVersion: batch/v1
kind: Job
metadata:
  name: pg-stat-monitor-init
  namespace: sbos-data
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      serviceAccountName: pg-stat-monitor-sa
      restartPolicy: OnFailure
      containers:
        - name: pg-stat-monitor
          image: docker.io/library/postgres:18
          env:
            - name: PGPASSWORD
              value: "postgres"
          command:
            - psql
            - -h
            - postgresql.sbos-data.svc.cluster.local
            - -U
            - postgres
            - -d
            - SBOSDB
            - -c
            - "CREATE EXTENSION IF NOT EXISTS pg_stat_monitor;"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
