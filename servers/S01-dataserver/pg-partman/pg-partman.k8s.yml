---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pg-partman-sa
  namespace: sbos-data
---
# pg_partman es una extensión instalada en el PostgreSQL SBOS.
# Este CronJob ejecuta el mantenimiento de particiones cada hora.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pg-partman
  namespace: sbos-data
spec:
  schedule: "0 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: pg-partman-sa
          restartPolicy: OnFailure
          containers:
            - name: pg-partman
              image: docker.io/library/postgres:18
              env:
                - name: PGPASSWORD
                  value: "postgres"
              command:
                - psql
                - -h
                - postgresql.sbos-data.svc.cluster.local
                - -U
                - postgres
                - -d
                - SBOSDB
                - -c
                - "SELECT partman.run_maintenance_proc();"
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
