# manifest.yml — Ficha 07: MinIO Object Storage
# SBOS-019 §9 · Order 115 · StatefulSet
identity:
  id: minio
  version: "2025.2"
  category: 1
  criticality: false
  server: S01
  description: "Object storage S3-compatible para backups, uploads y archivos"

workload:
  type: StatefulSet

order:
  execution_order: 115

requirements:
  dependencies:
    - network-validator

deployment:
  strategy: Recreate

governance:
  # k8s.yml usa alpine:3.20 + wget → GitHub Releases (sin Docker Hub auth)
  auto_install: true

health:
  type: command
  command: "kubectl get pods -A -l app=minio --no-headers 2>/dev/null | grep -c Running || true"
  interval_seconds: 30
  timeout_seconds: 10

integrations:
  buckets:
    - name: backups
      policy: private
    - name: uploads
      policy: public-read
    - name: archives
      policy: private

license: MIT

meta:
  backend: kubernetes
  idempotent: true
  estimated_minutes: 5
  rollback_support: false
