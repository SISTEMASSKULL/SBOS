# manifest.yml — Ficha 07: MinIO Object Storage
# SBOS-019 §9 · Order 115 · StatefulSet
identity:
  id: minio
  version: "2025.2"
  category: 1
  criticality: false
  server: S01
  description: "Object storage S3-compatible para backups, uploads y archivos"

workload:
  type: StatefulSet

order:
  execution_order: 115

requirements:
  dependencies:
    - network-validator

deployment:
  strategy: Recreate

governance:
  # BLOQUEADO: docker.io/minio/minio requiere auth de Docker Hub (no disponible sin cuenta).
  # dl.min.io eliminó URLs directas (HTTP 410). GitHub Releases devuelve 404 para linux-amd64.
  # Activar manualmente tras configurar imagePullSecrets o un mirror de Docker Hub.
  auto_install: false

health:
  type: command
  command: "curl -sf http://localhost:9000/minio/health/live"
  interval_seconds: 30
  timeout_seconds: 10

integrations:
  buckets:
    - name: backups
      policy: private
    - name: uploads
      policy: public-read
    - name: archives
      policy: private

license: MIT

meta:
  backend: kubernetes
  idempotent: true
  estimated_minutes: 5
  rollback_support: false
