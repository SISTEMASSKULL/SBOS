identity:
  id: "ferretdb"
  name: "FerretDB 2.0"
  version: "2.0.0"
  server: "S06"
  namespace: "sbos-notifier"
  category: 3
  criticality: true

workload:
  type: Deployment
  runtime: kubernetes
  state: "prod"

order:
  execution_order: 174

parameters:
  FERRETDB_POSTGRESQL_URL: "postgres://postgres@postgresql.sbos-data:5432/notifier_db"

requirements:
  ram_mb: 512
  cpu_cores: 1
  disk_gb: 20
  dependencies:
    - postgresql

deployment:
  namespace: "sbos-notifier"
  node_selector: "tipo=appserver"
  k8s_manifest: "ferretdb.k8s.yml"
  workload_type: "Deployment"
  network_policy: "ferretdb.network"

governance:
  auto_install: true
  accion: INSTALAR
  category_label: "notificaciones"
  backup_required: false
  backup_schedule: ""

health:
  type: command
  # FerretDB expone el endpoint /debug/metrics en el puerto de diagnóstico :8088.
  # Puerto 27017 es MongoDB wire protocol — no responde a HTTP.
  command: "kubectl --kubeconfig=/etc/bos/.kube/config get pods -n sbos-notifier -l app=ferretdb --no-headers 2>/dev/null | grep -c Running"
  expected_output: "1"
  timeout_seconds: 10

integrations:
  provides_to:
    - "novu"

bsearch_config:
  enabled: false

compatibility:
  min_iam_installer_version: "1.0.0"

meta:
  backend: kubernetes
  idempotent: true
  estimated_minutes: 5
  rollback_support: false
