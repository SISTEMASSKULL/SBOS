# manifest.yml — Ficha pgadmin4 (SBOS-005 §dataserver)
# SBOS-049 §4 · Order 130 · Deployment
identity:
  id: pgadmin4
  version: "8.10"
  category: 1
  criticality: false
  server: S01
  description: "PostgreSQL admin UI with OAuth2-Proxy"

workload:
  type: Deployment

order:
  execution_order: 130

requirements:
  dependencies:
    - postgresql

deployment:
  strategy: Recreate

governance:


  auto_install: true
  requires_approval: false
health:
  type: command
  command: "kubectl get pods -A -l app=pgadmin4 --no-headers 2>/dev/null | grep -c Running || true"
  interval_seconds: 30
  timeout_seconds: 10

license: MIT

meta:
  backend: kubernetes
  idempotent: true
  estimated_minutes: 5
  rollback_support: false
