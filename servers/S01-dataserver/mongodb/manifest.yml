# manifest.yml — Ficha mongodb (SBOS-005 §dataserver)
# SBOS-049 §4 · Order 342 · StatefulSet
identity:
  id: mongodb
  name: MongoDB
  version: "7.0"
  category: 1
  criticality: false
  server: dataserver
  description: "NoSQL DB for Rocket.Chat"

workload:
  type: StatefulSet
  namespace: sbos-data
  replicas: 1
  service_account: mongodb-sa

order:
  execution_order: 342
  timeout_minutes: 15

requirements:
  dependencies:

  cpu_request: "200m"
  cpu_limit: "1000m"
  memory_request: "512Mi"
  memory_limit: "1Gi"
  pvc_size: "30Gi"
  pvc_storage_class: "sbos-fast"

deployment:
  strategy: Recreate

governance:


health:
  check_command: "mongosh --eval 'db.runCommand({ping: 1})'"
  check_interval_seconds: 30
  check_timeout_seconds: 10
  consecutive_failures_threshold: 3

