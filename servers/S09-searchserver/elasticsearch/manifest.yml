# manifest.yml — Ficha elasticsearch (SBOS-005 §searchserver)
# SBOS-049 §4 · Order 315 · StatefulSet
identity:
  id: elasticsearch
  version: "8.16"
  category: 1
  criticality: true
  server: S09
  description: "Logs backend for Wazuh, full-text search"

workload:
  type: StatefulSet

order:
  execution_order: 315

requirements:
  dependencies:


deployment:
  strategy: Recreate

governance:


  auto_install: false
  requires_approval: false
health:
  type: command
  command: "kubectl get pods -A -l app=elasticsearch --no-headers 2>/dev/null | grep -c Running || true"
  interval_seconds: 30
  timeout_seconds: 10


license: MIT

meta:
  backend: kubernetes
  idempotent: true
  estimated_minutes: 5
  rollback_support: false
