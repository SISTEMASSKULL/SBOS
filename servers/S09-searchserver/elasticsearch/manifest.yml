# manifest.yml — Ficha elasticsearch (SBOS-005 §searchserver)
# SBOS-049 §4 · Order 315 · StatefulSet
identity:
  id: elasticsearch
  name: Elasticsearch
  version: "8.16"
  category: 1
  criticality: true
  server: searchserver
  description: "Logs backend for Wazuh, full-text search"

workload:
  type: StatefulSet
  namespace: sbos-search
  replicas: 1
  service_account: elasticsearch-sa

order:
  execution_order: 315
  timeout_minutes: 20

requirements:
  dependencies:

  cpu_request: "1000m"
  cpu_limit: "4000m"
  memory_request: "2Gi"
  memory_limit: "4Gi"
pvc_size: "200Gi"
  pvc_storage_class: "sbos-fast"

deployment:
  strategy: Recreate

governance:


health:
  check_command: "curl -sf http://localhost:9200/_cluster/health"
  check_interval_seconds: 30
  check_timeout_seconds: 10
  consecutive_failures_threshold: 3

