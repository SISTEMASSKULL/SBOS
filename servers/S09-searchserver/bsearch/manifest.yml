# manifest.yml — Ficha bsearch (SBOS S09-searchserver)
# BC-12 · SBOS-049 §4 · SBOS-050 · ADR-020 · Order 180
identity:
  id: bsearch
  version: "1.0.0"
  category: 1
  criticality: false
  server: S09
  description: "Motor de búsqueda soberano sobre PostgreSQL 18+ (full-text, vectorial, semántico). Implementa buscador de entidades SBOS sin dependencia de Elasticsearch."

workload:
  type: bash
  runtime: systemd

order:
  execution_order: 180

requirements:
  dependencies:
    - postgresql
    - redis
    - bauth

ports:
  - name: rpc
    protocol: unix
    path: /run/bos/bsearch.sock
    description: "JSON-RPC 2.0 — interface dual (ADR-020)"

governance:
  auto_install: true
  requires_approval: true
  category_label: daemon-soberano

health:
  type: command
  command: "systemctl is-active --quiet bsearch.service"
  interval_seconds: 60
  timeout_seconds: 15

license: MIT

meta:
  backend: systemd
  idempotent: true
  estimated_minutes: 3
  rollback_support: true
