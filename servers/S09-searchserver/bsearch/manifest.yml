# manifest.yml — Ficha bsearch (SBOS S09-searchserver)
# BC-12 · SBOS-049 §4 · SBOS-050 · ADR-020 · Order 180
identity:
  id: bsearch
  name: bsearch — Motor de Búsqueda Soberano
  version: "1.0.0"
  category: 1
  criticality: false
  server: searchserver
  description: "Motor de búsqueda soberano sobre PostgreSQL 18+ (full-text, vectorial, semántico). Implementa buscador de entidades SBOS sin dependencia de Elasticsearch."

workload:
  type: SystemdService
  host: true
  binary: /usr/local/bin/bsearch
  user: bsearch
  group: bosagent
  working_dir: /opt/bsearch

order:
  execution_order: 180

requirements:
  dependencies:
    - postgresql
    - redis
    - bauth

ports:
  - name: rpc
    protocol: unix
    path: /run/bos/bsearch.sock
    description: "JSON-RPC 2.0 — interface dual (ADR-020)"

governance:
  auto_install: true
  accion: INSTALAR
  requires_approval: true
  category_label: daemon-soberano

health:
  type: command
  check_command: "systemctl is-active --quiet bsearch.service"
  check_interval_seconds: 60
  check_timeout_seconds: 15
  consecutive_failures_threshold: 3

meta:
  backend: systemd
  idempotent: true
  estimated_minutes: 3
  rollback_support: true
