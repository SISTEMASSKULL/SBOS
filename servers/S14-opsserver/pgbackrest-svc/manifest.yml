# manifest.yml — Ficha pgbackrest-svc (SBOS-005 §opsserver)
# SBOS-049 §4 · Order 400 · Deployment
identity:
  id: pgbackrest-svc
  name: pgBackRest Service
  version: "2.52"
  category: 1
  criticality: true
  server: opsserver
  description: "PG backup PITR to MinIO, scheduling"

workload:
  type: Deployment
  namespace: sbos-ops
  replicas: 1
  service_account: pgbackrest-svc-sa

order:
  execution_order: 400
  timeout_minutes: 15

requirements:
  dependencies:
    - postgresql
    - minio
  cpu_request: "100m"
  cpu_limit: "500m"
  memory_request: "128Mi"
  memory_limit: "256Mi"


deployment:
  strategy: Recreate

governance:
backup_enabled: true
  backup_schedule: "0 2 * * *"

health:
  check_command: "pgbackrest version"
  check_interval_seconds: 30
  check_timeout_seconds: 10
  consecutive_failures_threshold: 3

