# manifest.yml — Ficha pgbackrest-svc (SBOS-005 §opsserver)
# SBOS-049 §4 · Order 400 · Deployment
identity:
  id: pgbackrest-svc
  version: "2.52"
  category: 1
  criticality: true
  server: S14
  description: "PG backup PITR to MinIO, scheduling"

workload:
  type: Deployment

order:
  execution_order: 400

requirements:
  dependencies:
    - postgresql
    - minio


deployment:
  strategy: Recreate

governance:
  auto_install: false
  requires_approval: false

health:
  type: command
  command: "kubectl get pods -A -l app=pgbackrest-svc --no-headers 2>/dev/null | grep -c Running || true"
  interval_seconds: 30
  timeout_seconds: 10


license: MIT

meta:
  backend: kubernetes
  idempotent: true
  estimated_minutes: 5
  rollback_support: false
