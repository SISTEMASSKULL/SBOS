# manifest.yml — Ficha bareos (SBOS-005 §opsserver)
# SBOS-049 §4 · Order 390 · StatefulSet
identity:
  id: bareos
  version: "23.0"
  category: 1
  criticality: true
  server: S14
  description: "Backup 16 servers, AES-256 encryption"

workload:
  type: StatefulSet

order:
  execution_order: 390

requirements:
  dependencies:
    - postgresql
    - minio

deployment:
  strategy: Recreate

governance:
  # docker.io/bareos/bareos-director:23.0 requiere autenticación Docker Hub
  auto_install: false
  requires_approval: false

health:
  type: command
  command: "kubectl get pods -A -l app=bareos --no-headers 2>/dev/null | grep -c Running || true"
  interval_seconds: 30
  timeout_seconds: 10

license: MIT

meta:
  backend: kubernetes
  idempotent: true
  estimated_minutes: 5
  rollback_support: false
