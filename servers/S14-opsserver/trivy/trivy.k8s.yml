---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: trivy-sa
  namespace: sbos-ops
---
apiVersion: v1
kind: Service
metadata:
  name: trivy
  namespace: sbos-ops
spec:
  clusterIP: None
  selector:
    app: trivy
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: trivy
  namespace: sbos-ops
spec:
  serviceName: trivy
  replicas: 1
  selector:
    matchLabels:
      app: trivy
  template:
    metadata:
      labels:
        app: trivy
    spec:
      serviceAccountName: trivy-sa
      containers:
        - name: trivy
          image: docker.io/aquasec/trivy:0.55
          ports:
            - containerPort: 8080
              name: http

          resources:
            requests:
              cpu: 50m
              memory: "32Mi"
            limits:
              cpu: 1000m
              memory: 512Mi
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10


