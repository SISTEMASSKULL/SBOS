# manifest.yml — Ficha trivy (SBOS-005 §opsserver)
# SBOS-049 §4 · Order 388 · Deployment
identity:
  id: trivy
  name: Trivy Scanner
  version: "0.55"
  category: 1
  criticality: false
  server: opsserver
  description: "CVE security scanning for containers and K8s"

workload:
  type: Deployment
  namespace: sbos-ops
  replicas: 1
  service_account: trivy-sa

order:
  execution_order: 388
  timeout_minutes: 10

requirements:
  dependencies:

  cpu_request: "200m"
  cpu_limit: "1000m"
  memory_request: "256Mi"
  memory_limit: "512Mi"


deployment:
  strategy: Recreate

governance:


health:
  check_command: "trivy --version"
  check_interval_seconds: 30
  check_timeout_seconds: 10
  consecutive_failures_threshold: 3

