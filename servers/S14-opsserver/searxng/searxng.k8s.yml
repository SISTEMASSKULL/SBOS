---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: searxng-sa
  namespace: sbos-ops
---
apiVersion: v1
kind: Service
metadata:
  name: searxng
  namespace: sbos-ops
spec:
  clusterIP: None
  selector:
    app: searxng
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: searxng
  namespace: sbos-ops
spec:
  serviceName: searxng
  replicas: 1
  selector:
    matchLabels:
      app: searxng
  template:
    metadata:
      labels:
        app: searxng
    spec:
      serviceAccountName: searxng-sa
      containers:
        - name: searxng
          image: docker.io/searxng/searxng:latest
          ports:
            - containerPort: 8080
              name: http

          resources:
            requests:
              cpu: 50m
              memory: "32Mi"
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10


