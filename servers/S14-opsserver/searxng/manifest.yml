# manifest.yml — Ficha searxng (SBOS-005 §opsserver)
# SBOS-049 §4 · Order 405 · Deployment
identity:
  id: searxng
  version: "1.0"
  category: 1
  criticality: false
  server: S14
  description: "Sovereign meta search engine"

workload:
  type: Deployment

order:
  execution_order: 405

requirements:
  dependencies:
    - keycloak


deployment:
  strategy: RollingUpdate

governance:


  auto_install: true
  requires_approval: false
health:
  type: command
  command: "kubectl get pods -A -l app=searxng --no-headers 2>/dev/null | grep -c Running || true"
  interval_seconds: 30
  timeout_seconds: 10


license: MIT

meta:
  backend: kubernetes
  idempotent: true
  estimated_minutes: 5
  rollback_support: false
