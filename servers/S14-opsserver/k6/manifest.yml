# manifest.yml — Ficha k6 (SBOS-005 §opsserver)
# SBOS-049 §4 · Order 385 · Deployment
identity:
  id: k6
  name: K6 Load Testing
  version: "0.52"
  category: 1
  criticality: false
  server: opsserver
  description: "Load testing, performance benchmarks"

workload:
  type: Deployment
  namespace: sbos-ops
  replicas: 1
  service_account: k6-sa

order:
  execution_order: 385
  timeout_minutes: 10

requirements:
  dependencies:

  cpu_request: "100m"
  cpu_limit: "500m"
  memory_request: "128Mi"
  memory_limit: "256Mi"


deployment:
  strategy: Recreate

governance:


health:
  check_command: "k6 version"
  check_interval_seconds: 30
  check_timeout_seconds: 10
  consecutive_failures_threshold: 3

