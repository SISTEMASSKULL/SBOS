---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: goss-sa
  namespace: sbos-ops
---
apiVersion: v1
kind: Service
metadata:
  name: goss
  namespace: sbos-ops
spec:
  clusterIP: None
  selector:
    app: goss
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: goss
  namespace: sbos-ops
spec:
  serviceName: goss
  replicas: 1
  selector:
    matchLabels:
      app: goss
  template:
    metadata:
      labels:
        app: goss
    spec:
      serviceAccountName: goss-sa
      containers:
        - name: goss
          image: docker.io/aelsabbahy/goss:0.4
          ports:
            - containerPort: 8080
              name: http

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10


