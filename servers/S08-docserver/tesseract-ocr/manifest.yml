identity:
  id: tesseract-ocr
  server: S08
  version: "5.5.0"
  category: 2
  criticality: false
  description: "Tesseract OCR 5.5.0 — motor de reconocimiento óptico de caracteres. Worker sidecar de Paperless-NGX. Soporta español, inglés, quechua y 100+ idiomas."

workload:
  type: deployment
  runtime: kubernetes

order:
  execution_order: 345

requirements:
  dependencies:
    - postgresql

governance:
  auto_install: false
  requires_approval: false
  category_label: "gestion-documental"

license: MIT

meta:
  backend: k8s
  idempotent: true
  estimated_minutes: 5
  rollback_support: true

ports: []

health:
  type: command
  command: "kubectl --kubeconfig=/etc/bos/.kube/config get deployment tesseract-ocr -n sbos-docs -o jsonpath='{.status.readyReplicas}' 2>/dev/null"
  expected_output: "1"
  timeout_seconds: 30

audit:
  ctx_id_required: true
  log_path: /var/log/bos/fichas/tesseract-ocr.log

versions:
  tesseract: "5.5.0"
