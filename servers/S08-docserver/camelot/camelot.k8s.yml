---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: camelot-sa
  namespace: sbos-docs
---
apiVersion: v1
kind: Service
metadata:
  name: camelot
  namespace: sbos-docs
spec:
  clusterIP: None
  selector:
    app: camelot
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: camelot
  namespace: sbos-docs
spec:
  serviceName: camelot
  replicas: 1
  selector:
    matchLabels:
      app: camelot
  template:
    metadata:
      labels:
        app: camelot
    spec:
      serviceAccountName: camelot-sa
      containers:
        - name: camelot
          image: docker.io/library/python:3.12-slim
          ports:
            - containerPort: 8080
              name: http

          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10


