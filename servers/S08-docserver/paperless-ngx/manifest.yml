# manifest.yml — Ficha paperless-ngx (SBOS-005 §docserver)
# SBOS-049 §4 · Order 295 · StatefulSet
identity:
  id: paperless-ngx
  name: Paperless-NGX
  version: "2.13"
  category: 1
  criticality: false
  server: docserver
  description: "DMS: OCR, ML classification, full-text search"

workload:
  type: StatefulSet
  namespace: sbos-docs
  replicas: 1
  service_account: paperless-ngx-sa

order:
  execution_order: 295
  timeout_minutes: 20

requirements:
  dependencies:
    - postgresql
    - redis
    - minio
    - keycloak
  cpu_request: "500m"
  cpu_limit: "2000m"
  memory_request: "512Mi"
  memory_limit: "1Gi"
pvc_size: "100Gi"
  pvc_storage_class: "sbos-fast"

deployment:
  strategy: Recreate

governance:
backup_enabled: true
  backup_schedule: "0 4 * * *"

health:
  check_command: "curl -sf http://localhost:8000/health"
  check_interval_seconds: 30
  check_timeout_seconds: 10
  consecutive_failures_threshold: 3

