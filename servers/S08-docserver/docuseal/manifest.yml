# manifest.yml — Ficha docuseal (SBOS-005 §docserver)
# SBOS-049 §4 · Order 310 · StatefulSet
identity:
  id: docuseal
  version: "1.7"
  category: 1
  criticality: false
  server: S08
  description: "Digital signatures multi-signer"

workload:
  type: StatefulSet

order:
  execution_order: 310

requirements:
  dependencies:
    - postgresql
    - keycloak

deployment:
  strategy: Recreate

governance:


  auto_install: true
  requires_approval: false
health:
  type: command
  command: "kubectl get pods -A -l app=docuseal --no-headers 2>/dev/null | grep -c Running || true"
  interval_seconds: 30
  timeout_seconds: 10


license: MIT

meta:
  backend: kubernetes
  idempotent: true
  estimated_minutes: 5
  rollback_support: false
