---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: modsecurity-sa
  namespace: sbos-gateway
---
apiVersion: v1
kind: Service
metadata:
  name: modsecurity
  namespace: sbos-gateway
spec:
  type: ClusterIP
  selector:
    app: modsecurity
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: modsecurity
  namespace: sbos-gateway
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: modsecurity
  template:
    metadata:
      labels:
        app: modsecurity
    spec:
      serviceAccountName: modsecurity-sa
      containers:
        - name: modsecurity
          image: docker.io/owasp/modsecurity-crs:4.7-nginx
          ports:
            - containerPort: 80
              name: http

          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          livenessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10


