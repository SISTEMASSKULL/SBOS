---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: modsecurity-sa
  namespace: sbos-gateway
---
apiVersion: v1
kind: Service
metadata:
  name: modsecurity
  namespace: sbos-gateway
spec:
  clusterIP: None
  selector:
    app: modsecurity
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: modsecurity
  namespace: sbos-gateway
spec:
  serviceName: modsecurity
  replicas: 1
  selector:
    matchLabels:
      app: modsecurity
  template:
    metadata:
      labels:
        app: modsecurity
    spec:
      serviceAccountName: modsecurity-sa
      containers:
        - name: modsecurity
          image: docker.io/owasp/modsecurity-crs:nginx-alpine
          ports:
            - containerPort: 8080
              name: http

          resources:
            requests:
              cpu: 50m
              memory: "32Mi"
            limits:
              cpu: 1000m
              memory: 512Mi
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10


