# manifest.yml — Ficha banexus (SBOS Centinela Edge)
# BC-10 · Order 149 · SystemdService · servidor: gatewayserver
identity:
  id: banexus
  version: "1.0"
  category: 1
  criticality: false
  server: S02
  description: "Daemon centinela edge — se conecta a bhnexus en modo agente, reporta estado del hardware local"

workload:
  type: bash
  runtime: systemd

order:
  execution_order: 149

requirements:
  dependencies:
    - bhnexus

ports:
  - name: agente
    protocol: tcp
    port: 9446
    host: true
    bind: 127.0.0.1
    description: "Puerto local del agente — solo acceso desde localhost"

governance:
  auto_install: false

health:
  command: "systemctl is-active banexus.service"
  interval_seconds: 30
  timeout_seconds: 5

integrations:
  bhnexus:
    addr: "127.0.0.1:9444"
  config_file: /etc/banexus/banexus.toml
  tls:
    mode: mutual_client
    cert_env: BANEXUS_CLIENT_CERT
    key_env: BANEXUS_CLIENT_KEY

meta:
  backend: bash
  idempotent: true
  estimated_minutes: 5
  rollback_support: false
