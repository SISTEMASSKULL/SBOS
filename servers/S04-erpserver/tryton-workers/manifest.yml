identity:
  id: tryton-workers
  server: S04
  version: "7.4"
  category: 1
  criticality: true
  description: "Tryton Workers — procesos de cola de tareas asíncronas del ERP (informes, importaciones, cálculos batch). Escala independiente del servidor principal."

workload:
  type: deployment
  runtime: kubernetes

order:
  execution_order: 175

requirements:
  dependencies:
    - tryton

governance:
  auto_install: true
  requires_approval: false
  category_label: "aplicacion-erp"

license: MIT

meta:
  backend: k8s
  idempotent: true
  estimated_minutes: 5
  rollback_support: true

ports: []

health:
  type: command
  command: "kubectl --kubeconfig=/etc/bos/.kube/config get deployment tryton-workers -n sbos-erp -o jsonpath='{.status.readyReplicas}' 2>/dev/null"
  expected_output: "2"
  timeout_seconds: 30

audit:
  ctx_id_required: true
  log_path: /var/log/bos/fichas/tryton-workers.log

versions:
  tryton: "7.4"
