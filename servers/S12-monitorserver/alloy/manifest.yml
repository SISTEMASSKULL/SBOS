# manifest.yml — Ficha alloy (SBOS-005 §S12)
# SBOS-049 §4 · Order 215 · DaemonSet
# Recolecta logs: journald (systemd daemons) + archivos de agente → Loki
identity:
  id: alloy
  version: "1.7.0"
  category: 1
  criticality: false
  server: S12
  description: "Log collector — journald + archivos → Loki, reemplaza Promtail"

workload:
  type: DaemonSet

order:
  execution_order: 215

requirements:
  dependencies:
    - loki

deployment:
  strategy: RollingUpdate

governance:
  auto_install: true
  requires_approval: false

health:
  type: command
  command: "kubectl get pods -A -l app=alloy --no-headers 2>/dev/null | grep -c Running || true"
  interval_seconds: 30
  timeout_seconds: 10

integrations:
  loki:
    url: "http://loki.sbos-monitor:3100"
  exporters:
    self_metrics: true

license: MIT

meta:
  backend: kubernetes
  idempotent: true
  estimated_minutes: 5
  rollback_support: false
