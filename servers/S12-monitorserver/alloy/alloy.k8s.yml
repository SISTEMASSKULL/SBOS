---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-config
  namespace: sbos-monitor
data:
  config.alloy: |
    loki.write "default" {
      endpoint {
        url = "http://loki.sbos-monitor.svc.cluster.local:3100/loki/api/v1/push"
      }
    }

    loki.source.file "varlog" {
      targets = [
        {__path__ = "/var/log/*.log", job = "varlogs"},
        {__path__ = "/var/log/**/*.log", job = "varlogs"},
      ]
      forward_to = [loki.write.default.receiver]
    }
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alloy-sa
  namespace: sbos-monitor
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: alloy
  namespace: sbos-monitor
spec:
  selector:
    matchLabels:
      app: alloy
  template:
    metadata:
      labels:
        app: alloy
    spec:
      serviceAccountName: alloy-sa
      containers:
        - name: alloy
          image: docker.io/grafana/alloy:v1.7.0
          args:
            - "run"
            - "--storage.path=/var/lib/alloy/data"
            - "--server.http.listen-addr=0.0.0.0:12345"
            - "/etc/alloy/config.alloy"
          ports:
            - containerPort: 12345
              name: http-metrics
          volumeMounts:
            - name: config
              mountPath: /etc/alloy
              readOnly: true
            - name: varlog
              mountPath: /var/log
              readOnly: true
            - name: journal
              mountPath: /var/log/journal
              readOnly: true
            - name: data
              mountPath: /var/lib/alloy/data
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 12345
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 12345
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
      volumes:
        - name: config
          configMap:
            name: alloy-config
        - name: varlog
          hostPath:
            path: /var/log
            type: Directory
        - name: journal
          hostPath:
            path: /var/log/journal
            type: DirectoryOrCreate
        - name: data
          hostPath:
            path: /var/lib/alloy/data
            type: DirectoryOrCreate
