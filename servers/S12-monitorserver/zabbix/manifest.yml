identity:
  id: zabbix
  server: S12
  version: "7.2.0"
  category: 1
  criticality: false
  description: "Zabbix 7.2 LTS — monitoreo de infraestructura."

workload:
  type: deployment
  workload_name: "zabbix-zabbix-server"
  runtime: kubernetes
  namespace: sbos-monitor
  replicas: 1

order:
  execution_order: 225

requirements:
  dependencies:
    - postgresql
    - grafana

governance:
  auto_install: true
  accion: INSTALAR
  requires_approval: false
  category_label: "observabilidad"

meta:
  backend: k8s
  idempotent: true
  estimated_minutes: 10
  rollback_support: true

ports:
  - name: http
    port: 80
    protocol: TCP
    internal_only: false
  - name: zabbix-trapper
    port: 10051
    protocol: TCP
    internal_only: true

health:
  type: command
  command: "kubectl --kubeconfig=/etc/bos/.kube/config get deployment zabbix-zabbix-server -n sbos-monitor -o jsonpath='{.status.readyReplicas}' 2>/dev/null"
  expected_output: "1"
  timeout_seconds: 30

audit:
  ctx_id_required: true
  log_path: /var/log/bos/fichas/zabbix.log

versions:
  zabbix: "7.2.0"
  zabbix_agent: "7.2.0"
