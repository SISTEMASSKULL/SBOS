# manifest.yml — Ficha novosga (SBOS-005 §geoserver)
# SBOS-049 §4 · Order 375 · Deployment
identity:
  id: novosga
  version: "2.1"
  category: 1
  criticality: false
  server: S13
  description: "Multi-branch queue management"

workload:
  type: Deployment

order:
  execution_order: 375

requirements:
  dependencies:
    - postgresql
    - keycloak


deployment:
  strategy: RollingUpdate

governance:


  auto_install: false
  requires_approval: false
health:
  type: command
  command: "kubectl get pods -A -l app=novosga --no-headers 2>/dev/null | grep -c Running || true"
  interval_seconds: 30
  timeout_seconds: 10


license: MIT

meta:
  backend: kubernetes
  idempotent: true
  estimated_minutes: 5
  rollback_support: false
