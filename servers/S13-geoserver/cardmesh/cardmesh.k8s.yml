---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cardmesh-sa
  namespace: sbos-geo
---
apiVersion: v1
kind: Service
metadata:
  name: cardmesh
  namespace: sbos-geo
spec:
  clusterIP: None
  selector:
    app: cardmesh
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cardmesh
  namespace: sbos-geo
spec:
  serviceName: cardmesh
  replicas: 1
  selector:
    matchLabels:
      app: cardmesh
  template:
    metadata:
      labels:
        app: cardmesh
    spec:
      serviceAccountName: cardmesh-sa
      containers:
        - name: cardmesh
          image: skull/cardmesh:latest
          ports:
            - containerPort: 8080
              name: http

          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10


