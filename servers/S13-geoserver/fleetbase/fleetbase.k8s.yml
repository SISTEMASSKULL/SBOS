---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fleetbase-sa
  namespace: sbos-geo
---
apiVersion: v1
kind: Service
metadata:
  name: fleetbase
  namespace: sbos-geo
spec:
  clusterIP: None
  selector:
    app: fleetbase
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: fleetbase
  namespace: sbos-geo
spec:
  serviceName: fleetbase
  replicas: 1
  selector:
    matchLabels:
      app: fleetbase
  template:
    metadata:
      labels:
        app: fleetbase
    spec:
      serviceAccountName: fleetbase-sa
      containers:
        - name: fleetbase
          image: docker.io/fleetbase/fleetbase:0.4
          ports:
            - containerPort: 8080
              name: http

          resources:
            requests:
              cpu: 50m
              memory: "32Mi"
            limits:
              cpu: 1000m
              memory: 512Mi
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10


