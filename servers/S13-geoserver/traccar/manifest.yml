# manifest.yml — Ficha traccar (SBOS-005 §geoserver)
# SBOS-049 §4 · Order 365 · Deployment
identity:
  id: traccar
  version: "6.5"
  category: 1
  criticality: false
  server: S13
  description: "GPS tracking 200+ protocols. criticality: false"

workload:
  type: Deployment

order:
  execution_order: 365

requirements:
  dependencies:
    - postgresql
    - keycloak


deployment:
  strategy: RollingUpdate

governance:
  # OOMKilled: servidor con poca memoria disponible (1.2Gi libre); Java necesita >768Mi
  auto_install: false
  requires_approval: false
health:
  type: command
  command: "kubectl get pods -A -l app=traccar --no-headers 2>/dev/null | grep -c Running || true"
  interval_seconds: 30
  timeout_seconds: 10


license: MIT

meta:
  backend: kubernetes
  idempotent: true
  estimated_minutes: 5
  rollback_support: false
