# manifest.yml — Ficha traccar (SBOS-005 §geoserver)
# SBOS-049 §4 · Order 365 · Deployment
identity:
  id: traccar
  name: Traccar GPS
  version: "6.5"
  category: 1
  criticality: false
  server: geoserver
  description: "GPS tracking 200+ protocols. criticality: false"

workload:
  type: Deployment
  namespace: sbos-geo
  replicas: 1
  service_account: traccar-sa

order:
  execution_order: 365
  timeout_minutes: 15

requirements:
  dependencies:
    - postgresql
    - keycloak
  cpu_request: "200m"
  cpu_limit: "1000m"
  memory_request: "256Mi"
  memory_limit: "512Mi"


deployment:
  strategy: RollingUpdate

governance:


health:
  check_command: "curl -sf http://localhost:8082/health"
  check_interval_seconds: 30
  check_timeout_seconds: 10
  consecutive_failures_threshold: 3

