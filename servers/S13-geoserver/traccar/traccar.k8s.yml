---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: traccar-sa
  namespace: sbos-geo
---
apiVersion: v1
kind: Service
metadata:
  name: traccar
  namespace: sbos-geo
spec:
  clusterIP: None
  selector:
    app: traccar
  ports:
    - name: http
      port: 8082
      targetPort: 8082
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: traccar
  namespace: sbos-geo
spec:
  serviceName: traccar
  replicas: 1
  selector:
    matchLabels:
      app: traccar
  template:
    metadata:
      labels:
        app: traccar
    spec:
      serviceAccountName: traccar-sa
      containers:
        - name: traccar
          image: docker.io/traccar/traccar:6.5
          env:
            - name: JAVA_OPTS
              value: "-Xms128m -Xmx512m"
          ports:
            - containerPort: 8082
              name: http

          resources:
            requests:
              cpu: 50m
              memory: "256Mi"
            limits:
              cpu: 1000m
              memory: 768Mi
          livenessProbe:
            tcpSocket:
              port: 8082
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 5
          readinessProbe:
            tcpSocket:
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 5


