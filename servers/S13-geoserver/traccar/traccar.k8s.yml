---
apiVersion: v1
kind: Service
metadata:
  name: traccar
  namespace: sbos-geo
spec:
  type: ClusterIP
  selector:
    app: traccar
  ports:
    - name: http
      port: 8082
      targetPort: 8082
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traccar
  namespace: sbos-geo
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: traccar
  template:
    metadata:
      labels:
        app: traccar
    spec:
      serviceAccountName: traccar-sa
      containers:
        - name: traccar
          image: docker.io/traccar/traccar:6.5
          ports:
            - containerPort: 8082
              name: http

          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8082
            initialDelaySeconds: 10
            periodSeconds: 10


