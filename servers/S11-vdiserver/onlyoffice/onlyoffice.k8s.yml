---
apiVersion: v1
kind: Service
metadata:
  name: onlyoffice
  namespace: sbos-vdi
spec:
  clusterIP: None
  selector:
    app: onlyoffice
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: onlyoffice
  namespace: sbos-vdi
spec:
  serviceName: onlyoffice
  replicas: 1
  selector:
    matchLabels:
      app: onlyoffice
  template:
    metadata:
      labels:
        app: onlyoffice
    spec:
      serviceAccountName: onlyoffice-sa
      containers:
        - name: onlyoffice
          image: docker.io/onlyoffice/documentserver:8.2
          ports:
            - containerPort: 80
              name: http

          volumeMounts:
            - name: data
              mountPath: /var/lib/onlyoffice
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10

  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: sbos-fast
        resources:
          requests:
            storage: 50Gi
