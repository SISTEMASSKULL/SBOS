# manifest.yml — Ficha onlyoffice (SBOS-005 §vdiserver)
# SBOS-049 §4 · Order 360 · StatefulSet
identity:
  id: onlyoffice
  version: "8.2"
  category: 1
  criticality: false
  server: S11
  description: "Collaborative office suite"

workload:
  type: StatefulSet

order:
  execution_order: 360

requirements:
  dependencies:
    - postgresql
    - keycloak
    - stalwart

deployment:
  strategy: Recreate

governance:


  auto_install: true
  requires_approval: false
health:
  type: command
  command: "kubectl get pods -A -l app=onlyoffice --no-headers 2>/dev/null | grep -c Running || true"
  interval_seconds: 30
  timeout_seconds: 10


license: MIT

meta:
  backend: kubernetes
  idempotent: true
  estimated_minutes: 5
  rollback_support: false
