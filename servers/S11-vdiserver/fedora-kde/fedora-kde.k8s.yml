# fedora-kde.k8s.yml — Escritorio Fedora KDE vía noVNC (HTML5)
# Imagen: linuxserver/webtop:fedora-kde — expone escritorio en :3000 (HTTP noVNC)
# Acceso: Kong → http://fedora-kde.sbos-vdi.svc:3000
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fedora-kde-sa
  namespace: sbos-vdi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fedora-kde-home
  namespace: sbos-vdi
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: sbos-local-path
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: fedora-kde
  namespace: sbos-vdi
  labels:
    app: fedora-kde
spec:
  clusterIP: None
  selector:
    app: fedora-kde
  ports:
    - name: novnc
      port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: fedora-kde
  namespace: sbos-vdi
  labels:
    app: fedora-kde
    app.kubernetes.io/part-of: sbos-vdi
spec:
  serviceName: fedora-kde
  replicas: 1
  selector:
    matchLabels:
      app: fedora-kde
  template:
    metadata:
      labels:
        app: fedora-kde
    spec:
      serviceAccountName: fedora-kde-sa
      containers:
        - name: fedora-kde
          image: lscr.io/linuxserver/webtop:fedora-kde
          ports:
            - containerPort: 3000
              name: novnc
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "America/La_Paz"
            - name: CUSTOM_USER
              valueFrom:
                secretKeyRef:
                  name: fedora-kde-secret
                  key: username
            - name: PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fedora-kde-secret
                  key: password
          volumeMounts:
            - name: home
              mountPath: /config
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              cpu: "4000m"
              memory: "8Gi"
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 5
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 120
            periodSeconds: 30
            failureThreshold: 5
      volumes:
        - name: home
          persistentVolumeClaim:
            claimName: fedora-kde-home
