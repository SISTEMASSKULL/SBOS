# manifest.yml — Ficha guacamole (BOS-REPAIR-09 §5 · SBOS-052)
# Apache Guacamole — Gateway VDI HTML5 (Apache 2.0). Sirve el escritorio
# Fedora Lógico al navegador sin plugins: el usuario entra por
# vdi.{tenant}.sksistemas.com y obtiene GNOME completo.
identity:
  id: guacamole
  version: "1.5.5"
  category: 1
  criticality: false
  server: S11
  description: "Gateway VDI HTML5 — escritorio Fedora al navegador"

workload:
  type: Deployment

order:
  execution_order: 359          # tras nextcloud (358), antes de fedora-logico (360)

requirements:
  dependencies:
    - postgresql                # guacamole_db
    - keycloak                  # OIDC SSO
    - stalwart
    - kong                      # ruta vdi.{tenant}

deployment:
  strategy: RollingUpdate

governance:
  auto_install: true
  requires_approval: false

health:
  type: command
  command: "kubectl get pods -A -l app=guacamole --no-headers 2>/dev/null | grep -c Running || true"
  interval_seconds: 30
  timeout_seconds: 10

license: MIT

meta:
  backend: kubernetes
  idempotent: true
  estimated_minutes: 5
  rollback_support: false
