identity:
  id: bos-preflight
  server: S-HOST
  version: 1.0.0
  category: 1
  criticality: true
  description: "Preflight de BOS — usuario bosagent, directorios, paquetes del SO y cgroup v2"

workload:
  type: bash
  runtime: host

order:
  execution_order: 1

requirements:
  dependencies: []

# Paquetes del sistema que BOS necesita para operar.
# Agregar aquí nuevas dependencias — no recompilar el binario.
system_packages:
  - curl
  - unzip
  - jq
  - openssl
  - ca-certificates
  - gnupg
  - apt-transport-https
  - libpam-cgfs
  - python3
  - wget

governance:
  auto_install: true
  requires_approval: false
  category_label: "infraestructura-critica"

license: MIT

meta:
  backend: bash
  idempotent: true
  estimated_minutes: 2
  rollback_support: partial

ports: []

health:
  type: command
  command: "id bosagent &>/dev/null && test -d /etc/bos && test -d /etc/sbos && test -d /run/bos && echo HEALTHY"
  timeout_seconds: 10

audit:
  ctx_id_required: false
  log_path: /var/log/bos/fichas/bos-preflight.log
