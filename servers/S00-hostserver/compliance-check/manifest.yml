# manifest.yml — Ficha compliance-check (SBOS-005 §hostserver)
# SBOS-049 §4 · Order 330 · Deployment
identity:
  id: compliance-check
  name: Compliance Check
  version: "1.0"
  category: 1
  criticality: false
  server: hostserver
  description: "Weekly kube-bench CIS + Trivy CVEs"

workload:
  type: Deployment
  namespace: sbos-installer
  replicas: 1
  service_account: compliance-check-sa

order:
  execution_order: 330
  timeout_minutes: 30

requirements:
  dependencies:
    - kyverno
  cpu_request: "100m"
  cpu_limit: "500m"
  memory_request: "128Mi"
  memory_limit: "256Mi"


deployment:
  strategy: Recreate

governance:


health:
  check_command: "kube-bench version"
  check_interval_seconds: 30
  check_timeout_seconds: 10
  consecutive_failures_threshold: 3

