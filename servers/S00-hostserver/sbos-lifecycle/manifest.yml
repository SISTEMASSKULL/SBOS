# manifest.yml — Ficha sbos-lifecycle (SBOS-005 §hostserver)
# SBOS-049 §4 · Order 15 · Systemd deployment
identity:
  id: sbos-lifecycle
  version: "1.0"
  category: 1
  criticality: true
  server: S-HOST
  description: "BOS daemon as systemd service — watchdog, shutdown saga, startup reconcile"

workload:
  type: Deployment

order:
  execution_order: 15

requirements:
  dependencies:
    - sbos-bootstrap-os


deployment:
  strategy: Recreate

governance:
  auto_install: true

health:
  type: command
  command: "test -f /etc/systemd/system/bos.service && systemctl is-enabled --quiet bos.service"
  interval_seconds: 30
  timeout_seconds: 5

license: MIT

meta:
  backend: kubernetes
  idempotent: true
  estimated_minutes: 5
  rollback_support: false
