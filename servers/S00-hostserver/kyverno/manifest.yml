identity:
  id: kyverno
  server: S-HOST
  version: 1.13.0
  category: 1
  criticality: true
  description: "Kyverno 1.13.0 — admission control para políticas de seguridad SBOS. Require probes, forbid hostPort, verify OCI signature, require NetworkPolicy. Modo audit → enforce en Iteración 2."

workload:
  type: Deployment
  runtime: kubernetes

order:
  execution_order: 100

requirements:
  dependencies:
    - sbos-bootstrap-k8s
    - sbos-bootstrap-cni

governance:
  auto_install: true
  requires_approval: false
  category_label: "infraestructura-critica"

license: MIT

meta:
  backend: helm
  idempotent: true
  estimated_minutes: 5
  rollback_support: true

ports:
  - port: 9443
    protocol: TCP
    description: "Kyverno webhook"
    internal_only: true
  - port: 8000
    protocol: TCP
    description: "Kyverno metrics"
    internal_only: true

health:
  type: command
  command: "kubectl --kubeconfig=/etc/bos/.kube/config get pods -n kyverno -l app.kubernetes.io/component=admission-controller -o jsonpath='{.items[*].status.conditions[?(@.type==\"Ready\")].status}' 2>/dev/null | grep -c True"
  expected_output: "1"
  timeout_seconds: 15

audit:
  ctx_id_required: true
  log_path: /var/log/bos/fichas/kyverno.log

versions:
  image: "ghcr.io/kyverno/kyverno:v1.13.0"
  namespace: kyverno
