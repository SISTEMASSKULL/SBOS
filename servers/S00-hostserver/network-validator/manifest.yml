# manifest.yml — Ficha network-validator (SBOS-005 §hostserver)
# SBOS-049 §4 · Order 15 · Deployment
identity:
  id: network-validator
  name: Network Validator
  version: "1.0"
  category: 1
  criticality: true
  server: hostserver
  description: "Validates CNI, DNS, service mesh prerequisites"

workload:
  type: Deployment
  namespace: sbos-installer
  replicas: 1
  service_account: network-validator-sa

order:
  execution_order: 15
  timeout_minutes: 10

requirements:
  dependencies:
    - sbos-bootstrap-platform
  cpu_request: "100m"
  cpu_limit: "500m"
  memory_request: "128Mi"
  memory_limit: "256Mi"


deployment:
  strategy: Recreate

governance:
  auto_install: true


health:
  type: command
  command: "KUBECONFIG=/etc/kubernetes/admin.conf kubectl get pods -n kube-system -l k8s-app=kube-dns --no-headers 2>/dev/null | grep -q Running && echo HEALTHY"
  timeout_seconds: 10
