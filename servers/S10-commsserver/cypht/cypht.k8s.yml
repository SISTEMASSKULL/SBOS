---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cypht-sa
  namespace: sbos-comms
---
apiVersion: v1
kind: Service
metadata:
  name: cypht
  namespace: sbos-comms
spec:
  clusterIP: None
  selector:
    app: cypht
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cypht
  namespace: sbos-comms
spec:
  serviceName: cypht
  replicas: 1
  selector:
    matchLabels:
      app: cypht
  template:
    metadata:
      labels:
        app: cypht
    spec:
      serviceAccountName: cypht-sa
      containers:
        - name: cypht
          image: docker.io/cypht/cypht:1.5
          ports:
            - containerPort: 80
              name: http
          env:
            - name: IMAP_SERVER
              value: "mailserver.sbos-comms.svc.cluster.local"
            - name: IMAP_PORT
              value: "993"
            - name: SMTP_SERVER
              value: "mailserver.sbos-comms.svc.cluster.local"
            - name: SMTP_PORT
              value: "587"
            - name: DB_CONNECTION_TYPE
              value: "pgsql"
            - name: DB_HOST
              value: "postgresql.sbos-data.svc.cluster.local"
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              value: "postgres"
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: cypht-db-secret
                  key: password
            - name: DB_NAME
              value: "cypht_db"
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          livenessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
