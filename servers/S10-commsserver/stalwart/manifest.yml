# manifest.yml — Ficha Stalwart Mail Server
# SBOS-005 §S10 · Orden 160 · StatefulSet
# Reemplaza: postfix (MTA) + dovecot (IMAP/POP3) + spamassassin (anti-spam)
# Imagen: stalwartlabs/stalwart (AGPLv3)
# Sin relay externo — sksistemas.com en Global Hosting con PTR configurado
identity:
  id: stalwart
  name: Stalwart Mail Server
  version: "1.0"
  category: 2
  criticality: true
  server: commsserver
  description: "Mail server unificado (SMTP + IMAP + POP3 + anti-spam). Reemplaza postfix/dovecot/spamassassin."

workload:
  type: StatefulSet
  namespace: sbos-comms
  replicas: 1
  service_account: stalwart-sa

order:
  execution_order: 160
  timeout_minutes: 15

requirements:
  dependencies:
    - nginx
  cpu_request: "1000m"
  cpu_limit: "4000m"
  memory_request: "2048Mi"
  memory_limit: "8192Mi"
  pvc_size: "100Gi"
  pvc_storage_class: "standard"

deployment:
  strategy: Recreate

governance:
  backup_enabled: true
  backup_schedule: "0 3 * * *"

health:
  check_command: "curl -sf http://localhost:8080/health"
  check_interval_seconds: 30
  check_timeout_seconds: 10
  consecutive_failures_threshold: 3

integrations:
  dns:
    provider: "GLOBAL HOSTING"
    ptr_record: "configurado por Global Hosting"
    spf: "v=spf1 ip4:144.91.76.130 -all"
    dkim: true
    dmarc: true
  tls:
    certificate: "*.sksistemas.com wildcard via nginx/certbot"
