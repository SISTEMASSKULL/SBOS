---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: spamassassin-sa
  namespace: sbos-comms
---
apiVersion: v1
kind: Service
metadata:
  name: spamassassin
  namespace: sbos-comms
spec:
  clusterIP: None
  selector:
    app: spamassassin
  ports:
    - name: http
      port: 783
      targetPort: 783
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: spamassassin
  namespace: sbos-comms
spec:
  serviceName: spamassassin
  replicas: 1
  selector:
    matchLabels:
      app: spamassassin
  template:
    metadata:
      labels:
        app: spamassassin
    spec:
      serviceAccountName: spamassassin-sa
      containers:
        - name: spamassassin
          image: docker.io/instantlinux/spamassassin:latest
          ports:
            - containerPort: 783
              name: http

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          livenessProbe:
            tcpSocket:
                port: 783
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
                port: 783
            initialDelaySeconds: 10
            periodSeconds: 10


