---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: roundcube-sa
  namespace: sbos-comms
---
apiVersion: v1
kind: Service
metadata:
  name: roundcube
  namespace: sbos-comms
spec:
  type: ClusterIP
  selector:
    app: roundcube
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: roundcube
  namespace: sbos-comms
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: roundcube
  template:
    metadata:
      labels:
        app: roundcube
    spec:
      serviceAccountName: roundcube-sa
      containers:
        - name: roundcube
          image: docker.io/roundcube/roundcubemail:1.6.9
          ports:
            - containerPort: 80
              name: http

          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          livenessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10


