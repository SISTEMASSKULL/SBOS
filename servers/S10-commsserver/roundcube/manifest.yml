# manifest.yml — Ficha roundcube (SBOS-005 §commsserver)
# SBOS-049 §4 · Order 325 · Deployment
identity:
  id: roundcube
  version: "1.6"
  category: 1
  criticality: false
  server: S10
  description: "Webmail with SSO via OAuth2-Proxy"

workload:
  type: Deployment

order:
  execution_order: 164

requirements:
  dependencies:
    - postfix
    - dovecot
    - postgresql


deployment:
  strategy: RollingUpdate

governance:


  auto_install: true
  requires_approval: false
health:
  type: command
  command: "kubectl get pods -A -l app=roundcube --no-headers 2>/dev/null | grep -c Running || true"
  interval_seconds: 30
  timeout_seconds: 10

license: MIT

meta:
  backend: kubernetes
  idempotent: true
  estimated_minutes: 5
  rollback_support: false
