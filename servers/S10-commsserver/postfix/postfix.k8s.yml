---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: postfix-sa
  namespace: sbos-comms
---
apiVersion: v1
kind: Service
metadata:
  name: postfix
  namespace: sbos-comms
spec:
  clusterIP: None
  selector:
    app: postfix
  ports:
    - name: smtp
      port: 25
      targetPort: 25
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postfix
  namespace: sbos-comms
spec:
  serviceName: postfix
  replicas: 1
  selector:
    matchLabels:
      app: postfix
  template:
    metadata:
      labels:
        app: postfix
    spec:
      serviceAccountName: postfix-sa
      containers:
        - name: postfix
          image: docker.io/boky/postfix:latest
          ports:
            - containerPort: 25
              name: smtp

          env:
            - name: ALLOWED_SENDER_DOMAINS
              value: "sbos.local sbos.app"
            - name: HOSTNAME
              value: "postfix.sbos-comms.svc.cluster.local"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            tcpSocket:
              port: 25
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: 25
            initialDelaySeconds: 10
            periodSeconds: 10


