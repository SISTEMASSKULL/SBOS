# manifest.yml — Ficha dovecot (SBOS-005 §commsserver)
# SBOS-049 §4 · Order 322 · StatefulSet
identity:
  id: dovecot
  version: "2.4"
  category: 1
  criticality: true
  server: S10
  description: "IMAP/POP3 mailboxes with Maildir"

workload:
  type: StatefulSet

order:
  execution_order: 162

requirements:
  dependencies:
    - postfix

deployment:
  strategy: Recreate

governance:
  # dovecot requiere ConfigMap con listeners en 0.0.0.0:143 — sin configuración escucha solo en loopback
  auto_install: false
  requires_approval: false

health:
  type: command
  command: "kubectl get pods -A -l app=dovecot --no-headers 2>/dev/null | grep -c Running || true"
  interval_seconds: 30
  timeout_seconds: 10


license: MIT

meta:
  backend: kubernetes
  idempotent: true
  estimated_minutes: 5
  rollback_support: false
