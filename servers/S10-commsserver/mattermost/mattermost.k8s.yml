---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mattermost-sa
  namespace: sbos-comms
---
apiVersion: v1
kind: Service
metadata:
  name: mattermost
  namespace: sbos-comms
spec:
  clusterIP: None
  selector:
    app: mattermost
  ports:
    - name: http
      port: 8065
      targetPort: 8065
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mattermost
  namespace: sbos-comms
spec:
  serviceName: mattermost
  replicas: 1
  selector:
    matchLabels:
      app: mattermost
  template:
    metadata:
      labels:
        app: mattermost
    spec:
      serviceAccountName: mattermost-sa
      containers:
        - name: mattermost
          image: docker.io/mattermost/mattermost-enterprise-edition:9.11
          ports:
            - containerPort: 8065
              name: http

          env:
            - name: MM_SQLSETTINGS_DRIVERNAME
              value: "postgres"
            - name: MM_SQLSETTINGS_DATASOURCE
              value: "postgres://mattermost:mattermost_pass@postgresql.sbos-data.svc.cluster.local:5432/mattermost_db?sslmode=disable"
            - name: MM_SERVICESETTINGS_SITEURL
              value: "http://mattermost.sbos-comms.svc.cluster.local:8065"
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 2000m
              memory: 1Gi
          livenessProbe:
            tcpSocket:
              port: 8065
            initialDelaySeconds: 120
            periodSeconds: 30
            failureThreshold: 5
          readinessProbe:
            tcpSocket:
              port: 8065
            initialDelaySeconds: 90
            periodSeconds: 15
            failureThreshold: 5


