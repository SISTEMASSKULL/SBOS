# manifest.yml — Ficha mattermost (SBOS-005 §commsserver)
# SBOS-049 §4 · Order 345 · Deployment
identity:
  id: mattermost
  version: "9.11"
  category: 1
  criticality: false
  server: S10
  description: "DevOps messaging"

workload:
  type: Deployment

order:
  execution_order: 345

requirements:
  dependencies:
    - postgresql
    - keycloak

deployment:
  strategy: Recreate

governance:


  auto_install: true
  requires_approval: false
health:
  command: "curl -sf http://localhost:8065/api/v4/system/ping"
  interval_seconds: 30
  timeout_seconds: 10


license: MIT

meta:
  backend: kubernetes
  idempotent: true
  estimated_minutes: 5
  rollback_support: false
