---
apiVersion: v1
kind: Service
metadata:
  name: freepbx
  namespace: sbos-comms
spec:
  clusterIP: None
  selector:
    app: freepbx
  ports:
    - name: http
      port: 5060
      targetPort: 5060
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: freepbx
  namespace: sbos-comms
spec:
  serviceName: freepbx
  replicas: 1
  selector:
    matchLabels:
      app: freepbx
  template:
    metadata:
      labels:
        app: freepbx
    spec:
      serviceAccountName: freepbx-sa
      containers:
        - name: freepbx
          image: docker.io/freepbx/freepbx:17
          ports:
            - containerPort: 5060
              name: http

          volumeMounts:
            - name: data
              mountPath: /var/lib/freepbx
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 5060
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 5060
            initialDelaySeconds: 10
            periodSeconds: 10

  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: sbos-fast
        resources:
          requests:
            storage: 30Gi
