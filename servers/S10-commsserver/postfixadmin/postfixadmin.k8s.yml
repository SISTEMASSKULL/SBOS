---
apiVersion: v1
kind: Service
metadata:
  name: postfixadmin
  namespace: sbos-comms
spec:
  type: ClusterIP
  selector:
    app: postfixadmin
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postfixadmin
  namespace: sbos-comms
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: postfixadmin
  template:
    metadata:
      labels:
        app: postfixadmin
    spec:
      serviceAccountName: postfixadmin-sa
      containers:
        - name: postfixadmin
          image: docker.io/postfixadmin/postfixadmin:3.3
          ports:
            - containerPort: 80
              name: http

          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10


