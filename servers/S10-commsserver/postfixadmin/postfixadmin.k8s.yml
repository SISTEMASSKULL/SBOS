---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: postfixadmin-sa
  namespace: sbos-comms
---
apiVersion: v1
kind: Service
metadata:
  name: postfixadmin
  namespace: sbos-comms
spec:
  clusterIP: None
  selector:
    app: postfixadmin
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postfixadmin
  namespace: sbos-comms
spec:
  serviceName: postfixadmin
  replicas: 1
  selector:
    matchLabels:
      app: postfixadmin
  template:
    metadata:
      labels:
        app: postfixadmin
    spec:
      serviceAccountName: postfixadmin-sa
      containers:
        - name: postfixadmin
          image: docker.io/postfixadmin/postfixadmin:3.3.13
          ports:
            - containerPort: 80
              name: http

          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          livenessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10


