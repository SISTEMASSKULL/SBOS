# manifest.yml — Ficha bcompass-svc (SBOS-005 §aiserver)
# SBOS-049 §4 · Order 430 · Deployment
identity:
  id: bcompass-svc
  version: "1.0"
  category: 1
  criticality: false
  server: S15
  description: "Route Engine + HITL (MIT SKULL)"

workload:
  type: Deployment

order:
  execution_order: 430

requirements:
  dependencies:
    - postgresql
    - keycloak
    - ollama


deployment:
  strategy: RollingUpdate

governance:
  # BLOQUEADO: imagen skull/* privada — requiere imagePullSecrets configurados.
  auto_install: false
  requires_approval: false

health:
  command: "curl -sf http://localhost:8080/health"
  interval_seconds: 30
  timeout_seconds: 10

license: MIT

meta:
  backend: kubernetes
  idempotent: true
  estimated_minutes: 5
  rollback_support: false
