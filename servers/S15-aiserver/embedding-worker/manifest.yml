# manifest.yml — Ficha embedding-worker (SBOS-005 §aiserver)
# SBOS-049 §4 · Order 420 · Deployment
identity:
  id: embedding-worker
  version: "1.0"
  category: 1
  criticality: false
  server: S15
  description: "Consumes ai:embed_queue -> Qdrant (MIT SKULL)"

workload:
  type: Deployment

order:
  execution_order: 420

requirements:
  dependencies:
    - redis
    - qdrant
    - ollama


deployment:
  strategy: RollingUpdate

governance:


  # BLOQUEADO: imagen skull/* privada — requiere imagePullSecrets configurados.
  auto_install: false
  requires_approval: false
health:
  type: command
  command: "kubectl get pods -A -l app=embedding-worker --no-headers 2>/dev/null | grep -c Running || true"
  interval_seconds: 30
  timeout_seconds: 10


license: MIT

meta:
  backend: kubernetes
  idempotent: true
  estimated_minutes: 5
  rollback_support: false
