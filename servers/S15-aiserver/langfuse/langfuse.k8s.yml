---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: langfuse-sa
  namespace: sbos-ai
---
apiVersion: v1
kind: Secret
metadata:
  name: langfuse-secret
  namespace: sbos-ai
type: Opaque
stringData:
  nextauth-secret: "sbos-langfuse-nextauth-secret-key-v2"
  salt: "sbos-langfuse-salt-32"
---
apiVersion: v1
kind: Service
metadata:
  name: langfuse
  namespace: sbos-ai
spec:
  clusterIP: None
  selector:
    app: langfuse
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: langfuse
  namespace: sbos-ai
spec:
  serviceName: langfuse
  replicas: 1
  selector:
    matchLabels:
      app: langfuse
  template:
    metadata:
      labels:
        app: langfuse
    spec:
      serviceAccountName: langfuse-sa
      containers:
        - name: langfuse
          image: docker.io/langfuse/langfuse:2
          ports:
            - containerPort: 3000
              name: http

          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: langfuse-secret
                  key: database-url
            - name: NEXTAUTH_URL
              value: "http://langfuse.sbos-ai.svc.cluster.local:3000"
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: langfuse-secret
                  key: nextauth-secret
            - name: SALT
              valueFrom:
                secretKeyRef:
                  name: langfuse-secret
                  key: salt

          resources:
            requests:
              cpu: 50m
              memory: "32Mi"
            limits:
              cpu: 1000m
              memory: 512Mi
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10


