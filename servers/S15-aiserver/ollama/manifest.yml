# manifest.yml — Ficha ollama (SBOS-005 §aiserver)
# SBOS-049 §4 · Order 410 · StatefulSet
identity:
  id: ollama
  name: Ollama LLM Runtime
  version: "0.5"
  category: 1
  criticality: false
  server: aiserver
  description: "Local LLM runtime: llama, mistral, deepseek, qwen"

workload:
  type: StatefulSet
  namespace: sbos-ai
  replicas: 1
  service_account: ollama-sa

order:
  execution_order: 410
  timeout_minutes: 20

requirements:
  dependencies:

  cpu_request: "2000m"
  cpu_limit: "8000m"
  memory_request: "4Gi"
  memory_limit: "16Gi"
pvc_size: "200Gi"
  pvc_storage_class: "sbos-fast"

deployment:
  strategy: Recreate

governance:


health:
  check_command: "curl -sf http://localhost:11434/api/tags"
  check_interval_seconds: 30
  check_timeout_seconds: 10
  consecutive_failures_threshold: 3

