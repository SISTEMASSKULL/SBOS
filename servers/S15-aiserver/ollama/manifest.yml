# manifest.yml — Ficha ollama (SBOS-005 §aiserver)
# SBOS-049 §4 · Order 410 · StatefulSet
identity:
  id: ollama
  version: "0.5"
  category: 1
  criticality: false
  server: S15
  description: "Local LLM runtime: llama, mistral, deepseek, qwen"

workload:
  type: StatefulSet

order:
  execution_order: 410

requirements:
  dependencies:


deployment:
  strategy: Recreate

governance:
  auto_install: true
  requires_approval: false

health:
  type: command
  command: "kubectl get pods -A -l app=ollama --no-headers 2>/dev/null | grep -c Running || true"
  interval_seconds: 30
  timeout_seconds: 10


license: MIT

meta:
  backend: kubernetes
  idempotent: true
  estimated_minutes: 5
  rollback_support: false
