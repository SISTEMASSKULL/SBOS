# manifest.yml — Ficha airflow (SBOS-005 §reportserver)
# SBOS-049 §4 · Order 288 · Deployment
identity:
  id: airflow
  version: "2.10"
  category: 1
  criticality: false
  server: S07
  description: "ETL DAGs, syncs, pipelines"

workload:
  type: Deployment

order:
  execution_order: 288

requirements:
  dependencies:
    - postgresql
    - redis
    - keycloak

deployment:
  strategy: Recreate

governance:


  auto_install: true
  requires_approval: false
health:
  type: command
  command: "kubectl get pods -A -l app=airflow --no-headers 2>/dev/null | grep -c Running || true"
  interval_seconds: 30
  timeout_seconds: 10


license: MIT

meta:
  backend: kubernetes
  idempotent: true
  estimated_minutes: 5
  rollback_support: false
