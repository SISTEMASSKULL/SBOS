---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: airflow-sa
  namespace: sbos-apps
---
apiVersion: v1
kind: Service
metadata:
  name: airflow
  namespace: sbos-apps
spec:
  type: ClusterIP
  selector:
    app: airflow
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: airflow
  namespace: sbos-apps
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: airflow
  template:
    metadata:
      labels:
        app: airflow
    spec:
      serviceAccountName: airflow-sa
      containers:
        - name: airflow
          image: docker.io/apache/airflow:2.10.4
          args: ["standalone"]
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: AIRFLOW__CORE__LOAD_EXAMPLES
              value: "False"
            - name: AIRFLOW_HOME
              value: "/opt/airflow"
            - name: AIRFLOW__WEBSERVER__WORKERS
              value: "1"
          resources:
            requests:
              cpu: 50m
              memory: "32Mi"
            limits:
              cpu: 2000m
              memory: 2Gi
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 120
            periodSeconds: 30
            failureThreshold: 5
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 5


