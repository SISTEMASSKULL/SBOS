# manifest.yml — Ficha jaspersoft (SBOS-005 §reportserver)
# SBOS-049 §4 · Order 280 · Deployment
identity:
  id: jaspersoft
  name: JasperSoft Studio CE
  version: "6.18"
  category: 1
  criticality: false
  server: reportserver
  description: "Fiscal reports Bolivia PUCT/SIN"

workload:
  type: Deployment
  namespace: sbos-apps
  replicas: 1
  service_account: jaspersoft-sa

order:
  execution_order: 280
  timeout_minutes: 10

requirements:
  dependencies:
    - postgresql
  cpu_request: "200m"
  cpu_limit: "1000m"
  memory_request: "256Mi"
  memory_limit: "512Mi"


deployment:
  strategy: RollingUpdate

governance:


health:
  check_command: "curl -sf http://localhost:8080/health"
  check_interval_seconds: 30
  check_timeout_seconds: 10
  consecutive_failures_threshold: 3

