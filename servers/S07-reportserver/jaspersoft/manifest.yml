# manifest.yml — Ficha jaspersoft (SBOS-005 §reportserver)
# SBOS-049 §4 · Order 280 · Deployment
identity:
  id: jaspersoft
  version: "6.18"
  category: 1
  criticality: false
  server: S07
  description: "Fiscal reports Bolivia PUCT/SIN"

workload:
  type: Deployment

order:
  execution_order: 280

requirements:
  dependencies:
    - postgresql


deployment:
  strategy: RollingUpdate

governance:


  # ghcr.io/bitnami (403) y registry.bitnami.com (DNS) no accesibles desde VPS — requiere imagen alternativa
  auto_install: false
  requires_approval: false
health:
  type: command
  command: "kubectl get pods -A -l app=jaspersoft --no-headers 2>/dev/null | grep -c Running || true"
  interval_seconds: 30
  timeout_seconds: 10


license: MIT

meta:
  backend: kubernetes
  idempotent: true
  estimated_minutes: 5
  rollback_support: false
