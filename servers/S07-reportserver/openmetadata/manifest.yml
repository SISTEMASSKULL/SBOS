# manifest.yml — Ficha openmetadata (SBOS-005 §reportserver)
# SBOS-049 §4 · Order 290 · Deployment
identity:
  id: openmetadata
  version: "1.6"
  category: 1
  criticality: false
  server: S07
  description: "Data catalog, lineage"

workload:
  type: Deployment

order:
  execution_order: 290

requirements:
  dependencies:
    - postgresql
    - airflow
    - keycloak


deployment:
  strategy: RollingUpdate

governance:


  # k8s.yml incompleto: sin vars MySQL + requiere Elasticsearch — pendiente configuración
  auto_install: false
  requires_approval: false
health:
  type: command
  command: "kubectl get pods -A -l app=openmetadata --no-headers 2>/dev/null | grep -c Running || true"
  interval_seconds: 30
  timeout_seconds: 10


license: MIT

meta:
  backend: kubernetes
  idempotent: true
  estimated_minutes: 5
  rollback_support: false
