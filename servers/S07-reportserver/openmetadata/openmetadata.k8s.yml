---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openmetadata-sa
  namespace: sbos-apps
---
apiVersion: v1
kind: Service
metadata:
  name: openmetadata
  namespace: sbos-apps
spec:
  clusterIP: None
  selector:
    app: openmetadata
  ports:
    - name: http
      port: 8585
      targetPort: 8585
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: openmetadata
  namespace: sbos-apps
spec:
  serviceName: openmetadata
  replicas: 1
  selector:
    matchLabels:
      app: openmetadata
  template:
    metadata:
      labels:
        app: openmetadata
    spec:
      serviceAccountName: openmetadata-sa
      containers:
        - name: openmetadata
          image: docker.io/openmetadata/server:1.13.6
          ports:
            - containerPort: 8585
              name: http

          resources:
            requests:
              cpu: 50m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 2Gi
          livenessProbe:
            tcpSocket:
              port: 8585
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: 8585
            initialDelaySeconds: 10
            periodSeconds: 10


