---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jasperstarter-sa
  namespace: sbos-apps
---
apiVersion: v1
kind: Service
metadata:
  name: jasperstarter
  namespace: sbos-apps
spec:
  clusterIP: None
  selector:
    app: jasperstarter
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: jasperstarter
  namespace: sbos-apps
spec:
  serviceName: jasperstarter
  replicas: 1
  selector:
    matchLabels:
      app: jasperstarter
  template:
    metadata:
      labels:
        app: jasperstarter
    spec:
      serviceAccountName: jasperstarter-sa
      containers:
        - name: jasperstarter
          image: docker.io/library/openjdk:17-slim
          ports:
            - containerPort: 8080
              name: http

          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10


