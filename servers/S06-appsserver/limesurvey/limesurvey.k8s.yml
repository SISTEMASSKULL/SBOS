---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: limesurvey-sa
  namespace: sbos-apps
---
apiVersion: v1
kind: Service
metadata:
  name: limesurvey
  namespace: sbos-apps
spec:
  type: ClusterIP
  selector:
    app: limesurvey
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: limesurvey
  namespace: sbos-apps
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: limesurvey
  template:
    metadata:
      labels:
        app: limesurvey
    spec:
      serviceAccountName: limesurvey-sa
      containers:
        - name: limesurvey
          image: docker.io/limesurvey/limesurvey:6.5
          ports:
            - containerPort: 8080
              name: http

          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          env:
            - name: DB_TYPE
              value: "pgsql"
            - name: DB_HOST
              value: "postgresql.sbos-data.svc.cluster.local"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "limesurvey_db"
            - name: DB_USERNAME
              value: "limesurvey"
            - name: DB_PASSWORD
              value: "limesurvey_pass"
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10


