---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vaultwarden-sa
  namespace: sbos-apps
---
apiVersion: v1
kind: Service
metadata:
  name: vaultwarden
  namespace: sbos-apps
spec:
  clusterIP: None
  selector:
    app: vaultwarden
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vaultwarden
  namespace: sbos-apps
spec:
  serviceName: vaultwarden
  replicas: 1
  selector:
    matchLabels:
      app: vaultwarden
  template:
    metadata:
      labels:
        app: vaultwarden
    spec:
      serviceAccountName: vaultwarden-sa
      containers:
        - name: vaultwarden
          image: docker.io/vaultwarden/server:1.32.1
          ports:
            - containerPort: 80
              name: http

          volumeMounts:
            - name: data
              mountPath: /var/lib/vaultwarden
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10

  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: sbos-local-path
        resources:
          requests:
            storage: 10Gi
