# manifest.yml — Ficha vaultwarden (SBOS-005 §appsserver)
# SBOS-049 §4 · Order 275 · StatefulSet
identity:
  id: vaultwarden
  name: Vaultwarden
  version: "1.32"
  category: 1
  criticality: true
  server: appsserver
  description: "Corporate password manager, Bitwarden-compatible"

workload:
  type: StatefulSet
  namespace: sbos-apps
  replicas: 1
  service_account: vaultwarden-sa

order:
  execution_order: 275
  timeout_minutes: 10

requirements:
  dependencies:
    - postgresql
    - keycloak
  cpu_request: "100m"
  cpu_limit: "500m"
  memory_request: "128Mi"
  memory_limit: "256Mi"
pvc_size: "10Gi"
  pvc_storage_class: "sbos-fast"

deployment:
  strategy: Recreate

governance:


health:
  check_command: "curl -sf http://localhost:8080/health"
  check_interval_seconds: 30
  check_timeout_seconds: 10
  consecutive_failures_threshold: 3

