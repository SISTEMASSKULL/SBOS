---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: taiga-sa
  namespace: sbos-apps
---
apiVersion: v1
kind: Service
metadata:
  name: taiga
  namespace: sbos-apps
spec:
  clusterIP: None
  selector:
    app: taiga
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: taiga
  namespace: sbos-apps
spec:
  serviceName: taiga
  replicas: 1
  selector:
    matchLabels:
      app: taiga
  template:
    metadata:
      labels:
        app: taiga
    spec:
      serviceAccountName: taiga-sa
      containers:
        - name: taiga
          image: docker.io/taigaio/taiga-back:6.7
          ports:
            - containerPort: 8000
              name: http

          resources:
            requests:
              cpu: 50m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 1Gi
          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10


