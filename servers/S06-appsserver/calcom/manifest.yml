# manifest.yml — Ficha calcom (SBOS-005 §appsserver)
# SBOS-049 §4 · Order 255 · Deployment
identity:
  id: calcom
  name: Cal.com
  version: "2.0"
  category: 1
  criticality: false
  server: appsserver
  description: "Multi-timezone scheduling"

workload:
  type: Deployment
  namespace: sbos-apps
  replicas: 1
  service_account: calcom-sa

order:
  execution_order: 255
  timeout_minutes: 15

requirements:
  dependencies:
    - postgresql
    - keycloak
  cpu_request: "200m"
  cpu_limit: "1000m"
  memory_request: "256Mi"
  memory_limit: "512Mi"


deployment:
  strategy: RollingUpdate

governance:


health:
  check_command: "curl -sf http://localhost:3000/health"
  check_interval_seconds: 30
  check_timeout_seconds: 10
  consecutive_failures_threshold: 3

