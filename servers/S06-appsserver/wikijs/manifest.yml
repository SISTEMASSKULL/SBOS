# manifest.yml — Ficha wikijs (SBOS-005 §appsserver)
# SBOS-049 §4 · Order 230 · StatefulSet
identity:
  id: wikijs
  version: "3.0"
  category: 1
  criticality: false
  server: S06
  description: "Knowledge base"

workload:
  type: StatefulSet

order:
  execution_order: 230

requirements:
  dependencies:
    - postgresql
    - keycloak

deployment:
  strategy: Recreate

governance:


  auto_install: true
  requires_approval: false
health:
  type: command
  command: "curl -sf http://localhost:3000/health"
  interval_seconds: 30
  timeout_seconds: 10


license: MIT

meta:
  backend: kubernetes
  idempotent: true
  estimated_minutes: 5
  rollback_support: false
