---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: authelia-sa
  namespace: sbos-apps
---
apiVersion: v1
kind: Service
metadata:
  name: authelia
  namespace: sbos-apps
spec:
  clusterIP: None
  selector:
    app: authelia
  ports:
    - name: http
      port: 9091
      targetPort: 9091
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: authelia
  namespace: sbos-apps
spec:
  serviceName: authelia
  replicas: 1
  selector:
    matchLabels:
      app: authelia
  template:
    metadata:
      labels:
        app: authelia
    spec:
      serviceAccountName: authelia-sa
      containers:
        - name: authelia
          image: docker.io/authelia/authelia:4.38
          ports:
            - containerPort: 9091
              name: http

          resources:
            requests:
              cpu: 50m
              memory: "32Mi"
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            tcpSocket:
              port: 9091
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: 9091
            initialDelaySeconds: 10
            periodSeconds: 10


