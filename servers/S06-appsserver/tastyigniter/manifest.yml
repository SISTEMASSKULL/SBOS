# manifest.yml — Ficha tastyigniter (SBOS-005 §appsserver)
# SBOS-049 §4 · Order 215 · Deployment
identity:
  id: tastyigniter
  version: "3.7"
  category: 1
  criticality: false
  server: S06
  description: "Restaurant platform, QR menu. criticality: false"

workload:
  type: Deployment

order:
  execution_order: 215

requirements:
  dependencies:
    - postgresql
    - keycloak


deployment:
  strategy: RollingUpdate

governance:


  auto_install: false
  requires_approval: false
health:
  type: command
  command: "kubectl get pods -A -l app=tastyigniter --no-headers 2>/dev/null | grep -c Running || true"
  interval_seconds: 30
  timeout_seconds: 10


license: MIT

meta:
  backend: kubernetes
  idempotent: true
  estimated_minutes: 5
  rollback_support: false
