---
apiVersion: v1
kind: Service
metadata:
  name: tastyigniter
  namespace: sbos-apps
spec:
  type: ClusterIP
  selector:
    app: tastyigniter
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tastyigniter
  namespace: sbos-apps
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: tastyigniter
  template:
    metadata:
      labels:
        app: tastyigniter
    spec:
      serviceAccountName: tastyigniter-sa
      containers:
        - name: tastyigniter
          image: docker.io/tastyigniter/tastyigniter:3.7
          ports:
            - containerPort: 8080
              name: http

          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10


