# manifest.yml — Ficha espocrm (SBOS-005 §appsserver)
# SBOS-049 §4 · Order 240 · Deployment
identity:
  id: espocrm
  version: "8.4"
  category: 1
  criticality: false
  server: S06
  description: "CRM: pipeline, leads, accounts"

workload:
  type: Deployment

order:
  execution_order: 240

requirements:
  dependencies:
    - postgresql
    - keycloak


deployment:
  strategy: RollingUpdate

governance:
  auto_install: false
  requires_approval: false
health:
  type: command
  command: "curl -sf http://localhost:8080/health"
  interval_seconds: 30
  timeout_seconds: 10


license: MIT

meta:
  backend: kubernetes
  idempotent: true
  estimated_minutes: 5
  rollback_support: false
