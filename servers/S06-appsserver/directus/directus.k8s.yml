---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: directus-sa
  namespace: sbos-apps
---
apiVersion: v1
kind: Service
metadata:
  name: directus
  namespace: sbos-apps
spec:
  clusterIP: None
  selector:
    app: directus
  ports:
    - name: http
      port: 8055
      targetPort: 8055
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: directus
  namespace: sbos-apps
spec:
  serviceName: directus
  replicas: 1
  selector:
    matchLabels:
      app: directus
  template:
    metadata:
      labels:
        app: directus
    spec:
      serviceAccountName: directus-sa
      containers:
        - name: directus
          image: docker.io/directus/directus:11.3
          ports:
            - containerPort: 8055
              name: http

          resources:
            requests:
              cpu: 50m
              memory: "32Mi"
            limits:
              cpu: 1000m
              memory: 512Mi
          livenessProbe:
            tcpSocket:
              port: 8055
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: 8055
            initialDelaySeconds: 10
            periodSeconds: 10


