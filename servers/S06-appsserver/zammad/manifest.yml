# manifest.yml — Ficha zammad (SBOS-005 §appsserver)
# SBOS-049 §4 · Order 260 · StatefulSet
identity:
  id: zammad
  name: Zammad Help Desk
  version: "6.4"
  category: 1
  criticality: false
  server: appsserver
  description: "Multi-channel help desk + SLA"

workload:
  type: StatefulSet
  namespace: sbos-apps
  replicas: 1
  service_account: zammad-sa

order:
  execution_order: 260
  timeout_minutes: 20

requirements:
  dependencies:
    - postgresql
    - keycloak
  cpu_request: "500m"
  cpu_limit: "2000m"
  memory_request: "512Mi"
  memory_limit: "1Gi"
pvc_size: "30Gi"
  pvc_storage_class: "sbos-fast"

deployment:
  strategy: Recreate

governance:
backup_enabled: true
  backup_schedule: "0 3 * * *"

health:
  check_command: "curl -sf http://localhost:3000/health"
  check_interval_seconds: 30
  check_timeout_seconds: 10
  consecutive_failures_threshold: 3

