# manifest.yml — Ficha openproject (SBOS-005 §appsserver)
# SBOS-049 §4 · Order 250 · StatefulSet
identity:
  id: openproject
  version: "14.2"
  category: 1
  criticality: false
  server: S06
  description: "Formal PM: Gantt, WBS, OKRs"

workload:
  type: StatefulSet

order:
  execution_order: 250

requirements:
  dependencies:
    - postgresql
    - keycloak

deployment:
  strategy: Recreate

governance:
  auto_install: true
  requires_approval: false

health:
  type: command
  command: "curl -sf http://localhost:8080/health"
  interval_seconds: 30
  timeout_seconds: 10


license: MIT

meta:
  backend: kubernetes
  idempotent: true
  estimated_minutes: 5
  rollback_support: false
