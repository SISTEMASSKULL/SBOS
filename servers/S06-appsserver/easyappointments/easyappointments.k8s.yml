---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: easyappointments-sa
  namespace: sbos-apps
---
apiVersion: v1
kind: Service
metadata:
  name: easyappointments
  namespace: sbos-apps
spec:
  clusterIP: None
  selector:
    app: easyappointments
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: easyappointments
  namespace: sbos-apps
spec:
  serviceName: easyappointments
  replicas: 1
  selector:
    matchLabels:
      app: easyappointments
  template:
    metadata:
      labels:
        app: easyappointments
    spec:
      serviceAccountName: easyappointments-sa
      containers:
        - name: easyappointments
          image: docker.io/alextselegidis/easyappointments:1.5
          ports:
            - containerPort: 8080
              name: http

          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10


