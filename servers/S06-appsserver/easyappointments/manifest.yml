# manifest.yml — Ficha easyappointments (SBOS-005 §appsserver)
# SBOS-049 §4 · Order 220 · Deployment
identity:
  id: easyappointments
  version: "1.5"
  category: 1
  criticality: false
  server: S06
  description: "Scheduling with CalDAV sync"

workload:
  type: Deployment

order:
  execution_order: 220

requirements:
  dependencies:
    - mysql
    - oauth2-proxy


deployment:
  strategy: RollingUpdate

governance:


  auto_install: false
  requires_approval: false
health:
  type: command
  command: "kubectl get pods -A -l app=easyappointments --no-headers 2>/dev/null | grep -c Running || true"
  interval_seconds: 30
  timeout_seconds: 10

license: MIT

meta:
  backend: kubernetes
  idempotent: true
  estimated_minutes: 5
  rollback_support: false
