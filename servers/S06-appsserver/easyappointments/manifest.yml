# manifest.yml — Ficha easyappointments (SBOS-005 §appsserver)
# SBOS-049 §4 · Order 220 · Deployment
identity:
  id: easyappointments
  name: Easy!Appointments
  version: "1.5"
  category: 1
  criticality: false
  server: appsserver
  description: "Scheduling with CalDAV sync"

workload:
  type: Deployment
  namespace: sbos-apps
  replicas: 1
  service_account: easyappointments-sa

order:
  execution_order: 220
  timeout_minutes: 10

requirements:
  dependencies:
    - mysql
    - oauth2-proxy
  cpu_request: "200m"
  cpu_limit: "1000m"
  memory_request: "256Mi"
  memory_limit: "512Mi"


deployment:
  strategy: RollingUpdate

governance:


health:
  check_command: "curl -sf http://localhost:8080/health"
  check_interval_seconds: 30
  check_timeout_seconds: 10
  consecutive_failures_threshold: 3
degraded_allowed: true
  degraded_reason: "OAuth2-Proxy may be unavailable"
