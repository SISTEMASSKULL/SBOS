identity:
  id: "novu"
  version: "3.15.0"
  server: "S06"
  criticality: true

workload:
  type: Deployment
  runtime: kubernetes

order:
  execution_order: 176

parameters:
  NOVU_JWT_SECRET_PATH: "secret/bauth/collab/novu"
  NOVU_MONGO_URL: "mongodb://ferretdb.sbos-notifier:27017/novu"
  NOVU_REDIS_URL: "redis://redis.sbos-data:6379/3"

requirements:
  dependencies:
    - postgresql
    - redis
    - ferretdb
    - keycloak
    - vault

deployment:
  namespace: "sbos-notifier"
  node_selector: "tipo=appserver"
  k8s_manifest: "novu.k8s.yml"
  workload_type: "Deployment"
  network_policy: "novu.network"

governance:
  auto_install: false
  requires_approval: false

health:
  type: command
  command: "kubectl get pods -A -l app=novu --no-headers 2>/dev/null | grep -c Running || true"
  interval_seconds: 30

integrations:
  provides_to:
    - "calcom"
    - "mattermost"

bsearch_config:
  enabled: false

compatibility:
  min_iam_installer_version: "1.0.0"

license: MIT

meta:
  backend: kubernetes
  idempotent: true
  estimated_minutes: 5
  rollback_support: false
