# manifest.yml — Ficha saleor (SBOS-005 §appsserver)
# SBOS-049 §4 · Order 205 · Deployment
identity:
  id: saleor
  version: "3.18"
  category: 1
  criticality: false
  server: S06
  description: "Headless GraphQL e-commerce"

workload:
  type: Deployment

order:
  execution_order: 205

requirements:
  dependencies:
    - postgresql
    - redis
    - keycloak


deployment:
  strategy: RollingUpdate

governance:
  auto_install: false
  requires_approval: false

health:
  type: command
  command: "kubectl get pods -A -l app=saleor --no-headers 2>/dev/null | grep -c Running || true"
  interval_seconds: 30
  timeout_seconds: 10


license: MIT

meta:
  backend: kubernetes
  idempotent: true
  estimated_minutes: 5
  rollback_support: false
