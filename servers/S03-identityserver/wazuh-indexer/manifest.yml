# manifest.yml — Ficha wazuh-indexer (SBOS-005 §identityserver)
# SBOS-049 §4 · Order 162 · StatefulSet
identity:
  id: wazuh-indexer
  version: "4.10"
  category: 1
  criticality: true
  server: S03
  description: "Wazuh indexer node (OpenSearch fork)"

workload:
  type: StatefulSet

order:
  execution_order: 162

requirements:
  dependencies:


deployment:
  strategy: Recreate

governance:
  auto_install: false
  requires_approval: true
health:
  type: command
  command: "kubectl get pods -A -l app=wazuh-indexer --no-headers 2>/dev/null | grep -c Running || true"
  interval_seconds: 30
  timeout_seconds: 10


license: MIT

meta:
  backend: kubernetes
  idempotent: true
  estimated_minutes: 5
  rollback_support: false
