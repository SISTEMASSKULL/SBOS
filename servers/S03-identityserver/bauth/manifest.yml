# manifest.yml — Ficha bauth (SBOS IAM Identity Control Plane)
# BC-09 · Order 148 · SystemdService · servidor: identityserver
identity:
  id: bauth
  name: bAuth Identity Control Plane
  version: "1.0"
  category: 1
  criticality: true
  server: identityserver
  description: "Daemon soberano de identidad — BitMask 64-bit, token unificado"

workload:
  type: SystemdService
  host: true
  binary: /usr/local/bin/bauth
  service_unit: resources/bauth.service
  user: bauth
  group: bosagent
  working_dir: /opt/bauth

order:
  execution_order: 148
  timeout_minutes: 10

requirements:
  dependencies:
    - postgresql
    - keycloak
    - vault
    - kong
  cpu_request: "200m"
  cpu_limit: "1000m"
  memory_request: "64Mi"
  memory_limit: "512Mi"

ports:
  - name: rpc
    protocol: unix
    path: /tmp/bauth/bauth.sock
    description: "JSON-RPC 2.0 — consumido por bos, bhnexus, kong plugin"

governance:
  auto_install: true
  backup_enabled: false
  encryption_required: true

health:
  check_command: "test -S /tmp/bauth/bauth.sock && echo OK"
  check_interval_seconds: 30
  check_timeout_seconds: 5
  consecutive_failures_threshold: 3
  initial_delay_seconds: 10

integrations:
  database:
    schema: bauth
    host_from: postgresql
    dsn_env: BAUTH_PG_DSN
  config_file: /etc/bos/bauth.toml
  socket_dir: /tmp/bauth
  socket_perms: "0660"
  socket_group: bosagent
