---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openvas-sa
  namespace: sbos-identity
---
apiVersion: v1
kind: Service
metadata:
  name: openvas
  namespace: sbos-identity
spec:
  clusterIP: None
  selector:
    app: openvas
  ports:
    - name: http
      port: 9392
      targetPort: 9392
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: openvas
  namespace: sbos-identity
spec:
  serviceName: openvas
  replicas: 1
  selector:
    matchLabels:
      app: openvas
  template:
    metadata:
      labels:
        app: openvas
    spec:
      serviceAccountName: openvas-sa
      containers:
        - name: openvas
          image: docker.io/greenbone/gvmd:23.0
          ports:
            - containerPort: 9392
              name: http

          resources:
            requests:
              cpu: 50m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 1Gi
          livenessProbe:
            tcpSocket:
              port: 9392
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: 9392
            initialDelaySeconds: 10
            periodSeconds: 10


