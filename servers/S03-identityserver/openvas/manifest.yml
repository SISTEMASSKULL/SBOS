# manifest.yml — Ficha openvas (SBOS-005 §identityserver)
# SBOS-049 §4 · Order 165 · Deployment
identity:
  id: openvas
  name: OpenVAS/Greenbone
  version: "23.0"
  category: 1
  criticality: false
  server: identityserver
  description: "Vulnerability scanner: CVE, open ports, misconfigurations"

workload:
  type: Deployment
  namespace: sbos-identity
  replicas: 1
  service_account: openvas-sa

order:
  execution_order: 165
  timeout_minutes: 15

requirements:
  dependencies:
    - postgresql
  cpu_request: "500m"
  cpu_limit: "2000m"
  memory_request: "512Mi"
  memory_limit: "1Gi"


deployment:
  strategy: RollingUpdate

governance:


health:
  check_command: "curl -sf http://localhost:9392"
  check_interval_seconds: 30
  check_timeout_seconds: 10
  consecutive_failures_threshold: 3

