---
apiVersion: v1
kind: Service
metadata:
  name: trilium
  namespace: sbos-apps
spec:
  clusterIP: None
  selector:
    app: trilium
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: trilium
  namespace: sbos-apps
spec:
  serviceName: trilium
  replicas: 1
  selector:
    matchLabels:
      app: trilium
  template:
    metadata:
      labels:
        app: trilium
    spec:
      serviceAccountName: trilium-sa
      containers:
        - name: trilium
          image: docker.io/zadam/trilium:0.63
          ports:
            - containerPort: 8080
              name: http

          volumeMounts:
            - name: data
              mountPath: /var/lib/trilium
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10

  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: sbos-fast
        resources:
          requests:
            storage: 5Gi
