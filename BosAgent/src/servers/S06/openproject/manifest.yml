# manifest.yml — Ficha openproject (SBOS-005 §appsserver)
# SBOS-049 §4 · Order 250 · StatefulSet
identity:
  id: openproject
  name: OpenProject
  version: "14.2"
  category: 1
  criticality: false
  server: appsserver
  description: "Formal PM: Gantt, WBS, OKRs"

workload:
  type: StatefulSet
  namespace: sbos-apps
  replicas: 1
  service_account: openproject-sa

order:
  execution_order: 250
  timeout_minutes: 20

requirements:
  dependencies:
    - postgresql
    - keycloak
  cpu_request: "500m"
  cpu_limit: "2000m"
  memory_request: "1Gi"
  memory_limit: "2Gi"
pvc_size: "50Gi"
  pvc_storage_class: "sbos-fast"

deployment:
  strategy: Recreate

governance:
backup_enabled: true
  backup_schedule: "0 3 * * *"

health:
  check_command: "curl -sf http://localhost:8080/health"
  check_interval_seconds: 30
  check_timeout_seconds: 10
  consecutive_failures_threshold: 3

