# manifest.yml — Ficha wikijs (SBOS-005 §appsserver)
# SBOS-049 §4 · Order 230 · StatefulSet
identity:
  id: wikijs
  name: Wiki.js
  version: "3.0"
  category: 1
  criticality: false
  server: appsserver
  description: "Knowledge base"

workload:
  type: StatefulSet
  namespace: sbos-apps
  replicas: 1
  service_account: wikijs-sa

order:
  execution_order: 230
  timeout_minutes: 10

requirements:
  dependencies:
    - postgresql
    - keycloak
  cpu_request: "200m"
  cpu_limit: "1000m"
  memory_request: "256Mi"
  memory_limit: "512Mi"
pvc_size: "10Gi"
  pvc_storage_class: "sbos-fast"

deployment:
  strategy: Recreate

governance:


health:
  check_command: "curl -sf http://localhost:3000/health"
  check_interval_seconds: 30
  check_timeout_seconds: 10
  consecutive_failures_threshold: 3

