identity:
  id: "novu"
  name: "Novu Notifications"
  version: "3.15.0"
  server: "S06"
  namespace: "sbos-notifier"
  category: 2
  criticality: true

workload:
  type: "kubernetes"
  state: "prod"

order:
  execution_order: 176

parameters:
  NOVU_JWT_SECRET_PATH: "secret/bauth/collab/novu"
  NOVU_MONGO_URL: "mongodb://ferretdb.sbos-notifier:27017/novu"
  NOVU_REDIS_URL: "redis://redis.sbos-data:6379/3"

requirements:
  ram_mb: 2048
  cpu_cores: 2
  disk_gb: 40
  dependencies:
    - postgresql
    - redis
    - ferretdb
    - keycloak
    - vault

deployment:
  namespace: "sbos-notifier"
  node_selector: "tipo=appserver"
  k8s_manifest: "novu.k8s.yml"
  workload_type: "Deployment"
  network_policy: "novu.network"

governance:
  auto_install: true
  category_label: "notificaciones"
  backup_required: true
  backup_schedule: "0 3 * * *"

health:
  # BUG-45: novu/api:3.15.0 no incluye curl en su imagen.
  # El health check por comando falla con "executable file not found".
  # ficha_health_check() en task_catalog.sh verifica Ready condition sin curl.
  # type:none para que el framework no ejecute el health command en verify.
  type: none

integrations:
  provides_to:
    - "calcom"

bsearch_config:
  enabled: false

compatibility:
  min_iam_installer_version: "1.0.0"
