# manifest.yml — Ficha cardmesh (SBOS-005 §geoserver)
# SBOS-049 §4 · Order 378 · Deployment
identity:
  id: cardmesh
  version: "1.0"
  category: 1
  criticality: false
  server: S13
  description: "vCards NFC/QR (MIT SKULL)"

workload:
  type: Deployment

order:
  execution_order: 378

requirements:
  dependencies:
    - postgresql
    - keycloak


deployment:
  strategy: RollingUpdate

governance:


  # BLOQUEADO: imagen skull/* privada — requiere imagePullSecrets configurados.
  auto_install: false
  requires_approval: false
health:
  command: "curl -sf http://localhost:8080/health"
  interval_seconds: 30
  timeout_seconds: 10


license: MIT

meta:
  backend: kubernetes
  idempotent: true
  estimated_minutes: 5
  rollback_support: false
