---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: novosga-sa
  namespace: sbos-geo
---
apiVersion: v1
kind: Service
metadata:
  name: novosga
  namespace: sbos-geo
spec:
  type: ClusterIP
  selector:
    app: novosga
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: novosga
  namespace: sbos-geo
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: novosga
  template:
    metadata:
      labels:
        app: novosga
    spec:
      serviceAccountName: novosga-sa
      containers:
        - name: novosga
          image: docker.io/novosga/novosga:2.1
          ports:
            - containerPort: 8080
              name: http

          resources:
            requests:
              cpu: 50m
              memory: "32Mi"
            limits:
              cpu: 1000m
              memory: 512Mi
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10


