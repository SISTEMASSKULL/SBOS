# manifest.yml — Ficha mattermost (SBOS-005 §commsserver)
# SBOS-049 §4 · Order 345 · Deployment
identity:
  id: mattermost
  name: Mattermost
  version: "9.11"
  category: 1
  criticality: false
  server: commsserver
  description: "DevOps messaging"

workload:
  type: Deployment
  namespace: sbos-comms
  replicas: 1
  service_account: mattermost-sa

order:
  execution_order: 345
  timeout_minutes: 15

requirements:
  dependencies:
    - postgresql
    - keycloak
  cpu_request: "500m"
  cpu_limit: "2000m"
  memory_request: "512Mi"
  memory_limit: "1Gi"
pvc_size: "20Gi"
  pvc_storage_class: "sbos-fast"

deployment:
  strategy: Recreate

governance:


health:
  check_command: "curl -sf http://localhost:8065/api/v4/system/ping"
  check_interval_seconds: 30
  check_timeout_seconds: 10
  consecutive_failures_threshold: 3

