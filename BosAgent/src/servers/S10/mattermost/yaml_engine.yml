# yaml_engine.yml — mattermost (S10)
# Mattermost Team Edition 9.11 — chat empresarial.

deployment:
  image: "mattermost/mattermost-team-edition:9.11"
  namespace: sbos-comms
  replicas: 1
  port: 8065
  storage:
    data: 10Gi
    plugins: 2Gi
    bleve_index: 5Gi

config:
  site_url: "https://{{ domain }}/chat"
  sso: keycloak
