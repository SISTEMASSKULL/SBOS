identity:
  id: cypht
  server: S10
  version: "2.0.0"
  category: 2
  criticality: false
  description: "Cypht 2.0.0 — cliente webmail modular open-source. Alternativa ligera a Roundcube con soporte multi-cuenta, IMAP/SMTP, calendario, RSS."

workload:
  type: deployment
  runtime: docker
  namespace: sbos-comms
  replicas: 1

order:
  execution_order: 315

requirements:
  dependencies:
    - mailserver
    - postgresql

governance:
  auto_install: false
  requires_approval: false
  category_label: "comunicaciones"

meta:
  backend: k8s
  idempotent: true
  estimated_minutes: 5
  rollback_support: true

ports:
  - name: http
    port: 80
    protocol: TCP
    internal_only: false

health:
  type: command
  command: "kubectl --kubeconfig=/etc/bos/.kube/config get deployment cypht -n sbos-comms -o jsonpath='{.status.readyReplicas}' 2>/dev/null"
  expected_output: "1"
  timeout_seconds: 30

audit:
  ctx_id_required: true
  log_path: /var/log/bos/fichas/cypht.log

versions:
  cypht: "2.0.0"
