identity:
  id: roundcube
  server: S10
  version: "1.6.10"
  category: 2
  criticality: false
  description: "Roundcube 1.6.10 — cliente webmail open-source. IMAP con interfaz moderna, filtros Sieve, carnet de contactos LDAP, integración CalDAV/CardDAV."

workload:
  type: deployment
  runtime: kubernetes
  namespace: sbos-comms
  replicas: 1

order:
  execution_order: 310

requirements:
  dependencies:
    - mailserver
    - postgresql
    - kong

governance:
  auto_install: true
  requires_approval: false
  category_label: "comunicaciones"

meta:
  backend: k8s
  idempotent: true
  estimated_minutes: 5
  rollback_support: true

ports:
  - name: http
    port: 80
    protocol: TCP
    internal_only: false

health:
  type: command
  command: "kubectl --kubeconfig=/etc/bos/.kube/config get deployment roundcube -n sbos-comms -o jsonpath='{.status.readyReplicas}' 2>/dev/null"
  expected_output: "1"
  timeout_seconds: 30

audit:
  ctx_id_required: true
  log_path: /var/log/bos/fichas/roundcube.log

versions:
  roundcube: "1.6.10"
