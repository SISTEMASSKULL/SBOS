identity:
  id: sbos-kong-tenant
  server: S02
  version: 1.0.0
  category: 1
  criticality: true
  description: >
    Configura el enrutamiento Kong para el tenant inicial (tenant bootstrapping).
    Crea rutas Kong por Host-header para el tenant activo: dominio raíz y subdominios.
    Se ejecuta una vez en instalación y es idempotente.
    El enrutamiento de tenants adicionales lo gestiona la saga bos.tenant.create.

workload:
  type: host
  runtime: bash

order:
  execution_order: 165

requirements:
  dependencies:
    - kong

governance:
  auto_install: true
  requires_approval: false
  category_label: "gateway"

meta:
  backend: kong-admin-api
  idempotent: true
  estimated_minutes: 2
  rollback_support: true

health:
  type: command
  command: >
    kubectl --kubeconfig=/etc/bos/.kube/config exec -n sbos-gateway deploy/kong --
    curl -sf http://127.0.0.1:8001/routes 2>/dev/null |
    python3 -c "import sys,json; d=json.load(sys.stdin); print('ok' if len(d.get('data',[]))>=6 else 'fail')" 2>/dev/null
  expected_output: "ok"
  timeout_seconds: 15

audit:
  ctx_id_required: true
  log_path: /var/log/bos/fichas/sbos-kong-tenant.log

versions:
  kong: "3.9.0"

# NOTA: Esta ficha solo configura el tenant inicial (instalación day-0).
# Para agregar tenants en producción usar: bos.tenant.create (saga bos)
