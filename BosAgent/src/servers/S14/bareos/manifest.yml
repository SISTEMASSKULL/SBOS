identity:
  id: bareos
  server: S14
  version: "23.0.1"
  category: 1
  criticality: false
  description: "Bareos 23.0.1 — sistema de backup empresarial (Backup Archiving Recovery Open Sourced). Backup de BDs PostgreSQL, volúmenes K8s y configuraciones del host. Retención configurable."

workload:
  type: deployment
  runtime: docker
  namespace: sbos-ops
  replicas: 1

order:
  execution_order: 455

requirements:
  dependencies:
    - postgresql
    - minio

governance:
  auto_install: false
  requires_approval: false
  category_label: "backup"

meta:
  backend: k8s
  idempotent: true
  estimated_minutes: 10
  rollback_support: false

ports:
  - name: bareos-dir
    port: 9101
    protocol: TCP
    internal_only: true
  - name: bareos-sd
    port: 9103
    protocol: TCP
    internal_only: true
  - name: bareos-web
    port: 9100
    protocol: TCP
    internal_only: false

health:
  type: command
  command: "kubectl --kubeconfig=/etc/bos/.kube/config get deployment bareos-director -n sbos-ops -o jsonpath='{.status.readyReplicas}' 2>/dev/null"
  expected_output: "1"
  timeout_seconds: 30

audit:
  ctx_id_required: true
  log_path: /var/log/bos/fichas/bareos.log

vault:
  secret_path: "secret/tenants/{{ tenant_id }}/bareos"
  keys:
    - director_password
    - storage_password
    - monitor_password

versions:
  bareos: "23.0.1"
