identity:
  id: gitlab
  server: S14
  version: "17.9.6-ce"
  category: 1
  criticality: false
  description: "GitLab CE 17.9.6 — plataforma DevOps soberana. Control de versiones, CI/CD, Container Registry, Issues, MR, Pages. Fuente de verdad del código SBOS."

workload:
  type: statefulset
  runtime: kubernetes
  namespace: sbos-ops
  replicas: 1

order:
  execution_order: 450

requirements:
  dependencies:
    - postgresql
    - redis
    - minio
    - keycloak
    - kong

governance:
  auto_install: false
  requires_approval: true
  category_label: "devops"

meta:
  backend: k8s
  idempotent: true
  estimated_minutes: 20
  rollback_support: true

ports:
  - name: http
    port: 80
    protocol: TCP
    internal_only: false
  - name: https
    port: 443
    protocol: TCP
    internal_only: false
  - name: ssh
    port: 22
    protocol: TCP
    internal_only: false

health:
  type: command
  command: "kubectl --kubeconfig=/etc/bos/.kube/config get statefulset gitlab -n sbos-ops -o jsonpath='{.status.readyReplicas}' 2>/dev/null"
  expected_output: "1"
  timeout_seconds: 120

audit:
  ctx_id_required: true
  log_path: /var/log/bos/fichas/gitlab.log

vault:
  secret_path: "secret/tenants/{{ tenant_id }}/gitlab"
  keys:
    - root_password
    - gitlab_rails_secret
    - db_password
    - smtp_password

versions:
  gitlab_ce: "17.9.6"
