---
# Ingress Kong para Tryton ERP.
# Ruta: erp.skull.sbos.local → oauth2-proxy-tryton:4180 → tryton:8000
# Flujo auth: Kong → oauth2-proxy-tryton (Fase 1: Keycloak / Fase 2: bAuth) → Tryton
# Fase 1→2: solo cambiar ConfigMap tryton-auth + rollout restart oauth2-proxy-tryton.
# Instalado por ficha tryton — no editar manualmente.
# NOTA: KongPlugin (rate-limit) omitido — requiere CRD configuration.konghq.com/v1
#       que solo está disponible con Kong Ingress Controller (KIC). Se puede activar
#       después cuando KIC esté instalado.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tryton-ingress
  namespace: sbos-erp
  labels:
    app: tryton
    managed-by: bos
  annotations:
    kubernetes.io/ingress.class: kong
    konghq.com/strip-path: "false"
spec:
  rules:
    - host: erp.skull.sbos.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: oauth2-proxy-tryton
                port:
                  number: 4180
