# manifest.yml — Ficha citus (SBOS-005 §dataserver)
# SBOS-049 §4 · Order 118 · Deployment
identity:
  id: citus
  name: Citus
  version: "12.1"
  category: 1
  criticality: false
  server: dataserver
  description: "Horizontal sharding for analytics workloads"

workload:
  type: Deployment
  namespace: sbos-data
  replicas: 1
  service_account: citus-sa

order:
  execution_order: 118
  timeout_minutes: 15

requirements:
  dependencies:
    - postgresql
  cpu_request: "500m"
  cpu_limit: "2000m"
  memory_request: "512Mi"
  memory_limit: "1Gi"


deployment:
  strategy: RollingUpdate

governance:


health:
  check_command: "psql -h localhost -c 'SELECT citus_version()'"
  check_interval_seconds: 30
  check_timeout_seconds: 10
  consecutive_failures_threshold: 3

