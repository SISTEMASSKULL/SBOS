# manifest.yml — Ficha pgbouncer (SBOS-005 §dataserver)
# SBOS-049 §4 · Order 105 · Deployment
identity:
  id: pgbouncer
  name: PgBouncer
  version: "1.22"
  category: 1
  criticality: true
  server: dataserver
  description: "Connection pooler for PostgreSQL"

workload:
  type: Deployment
  namespace: sbos-data
  replicas: 1
  service_account: pgbouncer-sa

order:
  execution_order: 105
  timeout_minutes: 10

requirements:
  dependencies:
    - postgresql
  cpu_request: "100m"
  cpu_limit: "500m"
  memory_request: "128Mi"
  memory_limit: "256Mi"


deployment:
  strategy: RollingUpdate

governance:


health:
  check_command: "pg_isready -h localhost -p 6432"
  check_interval_seconds: 30
  check_timeout_seconds: 10
  consecutive_failures_threshold: 3

