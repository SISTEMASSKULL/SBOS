---
apiVersion: v1
kind: Service
metadata:
  name: pgbouncer
  namespace: sbos-data
spec:
  type: ClusterIP
  selector:
    app: pgbouncer
  ports:
    - name: http
      port: 6432
      targetPort: 6432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgbouncer
  namespace: sbos-data
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: pgbouncer
  template:
    metadata:
      labels:
        app: pgbouncer
    spec:
      serviceAccountName: pgbouncer-sa
      containers:
        - name: pgbouncer
          image: docker.io/bitnami/pgbouncer:1.22
          ports:
            - containerPort: 6432
              name: http

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 6432
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 6432
            initialDelaySeconds: 10
            periodSeconds: 10


