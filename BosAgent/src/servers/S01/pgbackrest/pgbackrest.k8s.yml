---
apiVersion: v1
kind: Service
metadata:
  name: pgbackrest
  namespace: sbos-data
spec:
  type: ClusterIP
  selector:
    app: pgbackrest
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgbackrest
  namespace: sbos-data
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: pgbackrest
  template:
    metadata:
      labels:
        app: pgbackrest
    spec:
      serviceAccountName: pgbackrest-sa
      containers:
        - name: pgbackrest
          image: docker.io/pgbackrest/pgbackrest:2.52
          ports:
            - containerPort: 8080
              name: http

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10


