---
# ConfigMap con trytond.conf — configuración sin credenciales.
# La URI completa con contraseña se inyecta via env TRYTOND_DATABASE__URI
# desde el Secret tryton-pg-secret (generado por task_catalog.sh + Vault).
apiVersion: v1
kind: ConfigMap
metadata:
  name: tryton-config
  namespace: sbos-erp
  labels:
    app: tryton
    managed-by: bos
data:
  trytond.conf: |
    [database]
    # URI de conexión inyectada por la variable de entorno TRYTOND_DATABASE__URI
    # (env var del Secret tryton-pg-secret). No escribir credenciales aquí (P6).

    [web]
    listen = 0.0.0.0:8000
    hostname = erp.skull.sbos.local

    # ── Logging ────────────────────────────────────────────────────
    [loggers]
    keys = root,trytond

    [handlers]
    keys = stderr

    [formatters]
    keys = sbos

    [logger_root]
    level = ERROR
    handlers = stderr

    [logger_trytond]
    level = WARNING
    handlers = stderr
    qualname = trytond

    [handler_stderr]
    class = StreamHandler
    level = NOTSET
    formatter = sbos
    args = (sys.stderr,)

    [formatter_sbos]
    format = [%(asctime)s] %(levelname)-8s [tryton] %(name)s %(message)s
    datefmt = %Y-%m-%dT%H:%M:%SZ
