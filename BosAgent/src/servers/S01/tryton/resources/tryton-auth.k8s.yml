---
# ConfigMap de autenticación — ÚNICA fuente de verdad del proveedor OIDC activo.
#
# ┌─────────────────────────────────────────────────────────────────────────┐
# │  MIGRACIÓN A bAuth (Fase 2)                                             │
# │                                                                         │
# │  Cuando bAuth tenga su endpoint OIDC operativo (~60% restante):        │
# │                                                                         │
# │  1. Actualizar SBOS_AUTH_PROVIDER → bauth                              │
# │  2. Actualizar OIDC_ISSUER_URL    → URL del endpoint OIDC de bAuth     │
# │  3. kubectl rollout restart deployment/oauth2-proxy-tryton -n sbos-erp  │
# │                                                                         │
# │  Tryton NO requiere ningún cambio. Solo este ConfigMap + restart.       │
# └─────────────────────────────────────────────────────────────────────────┘
apiVersion: v1
kind: ConfigMap
metadata:
  name: tryton-auth
  namespace: sbos-erp
  labels:
    app: tryton
    component: auth
    managed-by: bos
  annotations:
    sbos.io/auth-phase: "1"
    sbos.io/auth-note: "Fase 1: Keycloak. Actualizar a bAuth cuando OIDC bAuth esté operativo."
data:
  # ── Proveedor activo ──────────────────────────────────────────────────
  # Fase 1: keycloak
  # Fase 2: bauth  (cambiar aquí + rollout restart)
  SBOS_AUTH_PROVIDER: "keycloak"

  # ── Fase 1: Keycloak ─────────────────────────────────────────────────
  OIDC_ISSUER_URL: "http://keycloak.sbos-security.svc.cluster.local:8080/auth/realms/skull"
  # Fase 2 (descomentar y comentar la línea anterior):
  # OIDC_ISSUER_URL: "http://bauth.sbos-system.svc.cluster.local:9400/oidc"

  # ── Cliente OIDC ──────────────────────────────────────────────────────
  # Registrado en Keycloak por task_catalog.sh paso: registrar_cliente_oidc
  # En Fase 2: bAuth tendrá el mismo client_id (sin cambio en este campo)
  OIDC_CLIENT_ID: "tryton-erp"

  # ── OAuth2 Proxy ──────────────────────────────────────────────────────
  OAUTH2_REDIRECT_URL: "http://erp.skull.sbos.local/oauth2/callback"
  OAUTH2_UPSTREAM:     "http://tryton.sbos-erp.svc.cluster.local:8000"
---
# Deployment: oauth2-proxy-tryton
# Proxy OIDC dedicado para Tryton ERP.
# Lee el proveedor del ConfigMap tryton-auth → cambiar el ConfigMap = cambiar proveedor.
# Credenciales OIDC en Secret tryton-oidc-secret (generado por task_catalog.sh desde Vault).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy-tryton
  namespace: sbos-erp
  labels:
    app: oauth2-proxy-tryton
    managed-by: bos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oauth2-proxy-tryton
  template:
    metadata:
      labels:
        app: oauth2-proxy-tryton
        managed-by: bos
    spec:
      serviceAccountName: tryton-sa

      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.8.0

          env:
            # ── Proveedor OIDC (del ConfigMap — único punto de cambio Fase 1→2) ──
            - name: OAUTH2_PROXY_PROVIDER
              value: oidc
            - name: OAUTH2_PROXY_OIDC_ISSUER_URL
              valueFrom:
                configMapKeyRef:
                  name: tryton-auth
                  key: OIDC_ISSUER_URL
            - name: OAUTH2_PROXY_CLIENT_ID
              valueFrom:
                configMapKeyRef:
                  name: tryton-auth
                  key: OIDC_CLIENT_ID
            - name: OAUTH2_PROXY_REDIRECT_URL
              valueFrom:
                configMapKeyRef:
                  name: tryton-auth
                  key: OAUTH2_REDIRECT_URL

            # ── Credenciales (del Secret — generado desde Vault) ──────────────
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: tryton-oidc-secret
                  key: client_secret
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: tryton-oidc-secret
                  key: cookie_secret

            # ── Upstream: Tryton ──────────────────────────────────────────────
            - name: OAUTH2_PROXY_UPSTREAMS
              valueFrom:
                configMapKeyRef:
                  name: tryton-auth
                  key: OAUTH2_UPSTREAM

            # ── Comportamiento del proxy ──────────────────────────────────────
            - name: OAUTH2_PROXY_HTTP_ADDRESS
              value: "0.0.0.0:4180"
            # Pasar headers de usuario autenticado a Tryton
            - name: OAUTH2_PROXY_SET_XAUTHREQUEST
              value: "true"
            - name: OAUTH2_PROXY_PASS_USER_HEADERS
              value: "true"
            - name: OAUTH2_PROXY_PASS_AUTHORIZATION_HEADER
              value: "true"
            # Permitir cualquier dominio de correo (los roles los gestiona Keycloak/bAuth)
            - name: OAUTH2_PROXY_EMAIL_DOMAINS
              value: "*"
            # Saltar la validación TLS para servicios internos (cluster interno)
            - name: OAUTH2_PROXY_SSL_INSECURE_SKIP_VERIFY
              value: "true"
            # Logs estructurados
            - name: OAUTH2_PROXY_REQUEST_LOGGING
              value: "true"
            - name: OAUTH2_PROXY_AUTH_LOGGING
              value: "true"

          ports:
            - name: http
              containerPort: 4180

          livenessProbe:
            httpGet:
              path: /ping
              port: 4180
            initialDelaySeconds: 15
            periodSeconds: 30

          readinessProbe:
            httpGet:
              path: /ping
              port: 4180
            initialDelaySeconds: 10
            periodSeconds: 10

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
# Service para oauth2-proxy-tryton (Kong lo usa como backend del Ingress)
apiVersion: v1
kind: Service
metadata:
  name: oauth2-proxy-tryton
  namespace: sbos-erp
  labels:
    app: oauth2-proxy-tryton
    managed-by: bos
spec:
  selector:
    app: oauth2-proxy-tryton
  ports:
    - name: http
      port: 4180
      targetPort: 4180
