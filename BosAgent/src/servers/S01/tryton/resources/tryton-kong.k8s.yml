---
# Ingress Kong para Tryton ERP.
# Ruta: erp.skull.sbos.local → oauth2-proxy-tryton:4180 → tryton:8000
# Flujo auth: Kong → oauth2-proxy-tryton (Fase 1: Keycloak / Fase 2: bAuth) → Tryton
# Fase 1→2: solo cambiar ConfigMap tryton-auth + rollout restart oauth2-proxy-tryton.
# Instalado por ficha tryton — no editar manualmente.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tryton-ingress
  namespace: sbos-erp
  labels:
    app: tryton
    managed-by: bos
  annotations:
    kubernetes.io/ingress.class: kong
    # Preservar el path completo — oauth2-proxy necesita ver /oauth2/callback
    konghq.com/strip-path: "false"
    # Rate limiting: 100 req/min por IP
    konghq.com/plugins: tryton-rate-limit
spec:
  rules:
    - host: erp.skull.sbos.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: oauth2-proxy-tryton
                port:
                  number: 4180
---
# Plugin Kong: rate limiting para Tryton.
apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: tryton-rate-limit
  namespace: sbos-erp
  labels:
    app: tryton
    managed-by: bos
plugin: rate-limiting
config:
  minute: 100
  hour: 3000
  policy: local
