---
# Ingress Kong para Tryton ERP.
# Ruta: erp.skull.sbos.local → sbos-erp/tryton:8000
# Kong aplica: autenticación JWT, rate limiting, access log.
# Instalado por ficha tryton — no editar manualmente.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tryton-ingress
  namespace: sbos-erp
  labels:
    app: tryton
    managed-by: bos
  annotations:
    kubernetes.io/ingress.class: kong
    # Preservar el path completo — Tryton necesita ver /
    konghq.com/strip-path: "false"
    # Rate limiting: 100 req/min por IP (protección básica)
    konghq.com/plugins: tryton-rate-limit
spec:
  rules:
    - host: erp.skull.sbos.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tryton
                port:
                  number: 8000
---
# Plugin Kong: rate limiting para Tryton.
apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: tryton-rate-limit
  namespace: sbos-erp
  labels:
    app: tryton
    managed-by: bos
plugin: rate-limiting
config:
  minute: 100
  hour: 3000
  policy: local
