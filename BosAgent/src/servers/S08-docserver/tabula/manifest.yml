# manifest.yml — Ficha tabula (SBOS-005 §docserver)
# SBOS-049 §4 · Order 300 · Deployment
identity:
  id: tabula
  version: "1.0"
  category: 1
  criticality: false
  server: S08
  description: "PDF tables to CSV/XLSX"

workload:
  type: Deployment

order:
  execution_order: 300

requirements:
  dependencies:
    - paperless-ngx


deployment:
  strategy: RollingUpdate

governance:


  auto_install: false
  requires_approval: false
health:
  command: "curl -sf http://localhost:8080/health"
  interval_seconds: 30
  timeout_seconds: 10


meta:
  backend: kubernetes
  idempotent: true
  estimated_minutes: 5
  rollback_support: false
