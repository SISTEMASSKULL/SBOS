---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: paperless-ngx-sa
  namespace: sbos-docs
---
apiVersion: v1
kind: Service
metadata:
  name: paperless-ngx
  namespace: sbos-docs
spec:
  clusterIP: None
  selector:
    app: paperless-ngx
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: paperless-ngx
  namespace: sbos-docs
spec:
  serviceName: paperless-ngx
  replicas: 1
  selector:
    matchLabels:
      app: paperless-ngx
  template:
    metadata:
      labels:
        app: paperless-ngx
    spec:
      serviceAccountName: paperless-ngx-sa
      containers:
        - name: paperless-ngx
          image: docker.io/paperlessngx/paperless-ngx:2.13
          ports:
            - containerPort: 8000
              name: http

          env:
            - name: PAPERLESS_DBENGINE
              value: "postgresql"
            - name: PAPERLESS_DBHOST
              value: "postgresql.sbos-data.svc.cluster.local"
            - name: PAPERLESS_DBPORT
              value: "5432"
            - name: PAPERLESS_DBNAME
              value: "paperless_db"
            - name: PAPERLESS_DBUSER
              value: "paperless"
            - name: PAPERLESS_DBPASS
              value: "paperless_pass"
            - name: PAPERLESS_REDIS
              value: "redis://redis.sbos-data.svc.cluster.local:6379"
          volumeMounts:
            - name: data
              mountPath: /var/lib/paperless-ngx
          resources:
            requests:
              cpu: 50m
              memory: "32Mi"
            limits:
              cpu: 2000m
              memory: 4Gi
          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 120
            periodSeconds: 30
            failureThreshold: 5
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10

  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: sbos-local-path
        resources:
          requests:
            storage: 100Gi
