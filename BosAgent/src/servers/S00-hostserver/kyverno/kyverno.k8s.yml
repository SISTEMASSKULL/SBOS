---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kyverno-sa
  namespace: sbos-installer
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kyverno
  namespace: sbos-installer
data:
  resourceFilters: |
    [Event,*,*]
    [*,kube-system,*]
    [*,kube-public,*]
    [*,kube-node-lease,*]
  generateSuccessEvents: "false"
  webhooks: "[]"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kyverno-metrics
  namespace: sbos-installer
data:
  metricsRefreshInterval: "24h"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kyverno-role
  namespace: sbos-installer
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kyverno-rb
  namespace: sbos-installer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kyverno-role
subjects:
  - kind: ServiceAccount
    name: kyverno-sa
    namespace: sbos-installer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kyverno-cr
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["validatingwebhookconfigurations", "mutatingwebhookconfigurations"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events", "namespaces"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["kyverno.io"]
    resources: ["*"]
    verbs: ["*"]
  - apiGroups: ["wgpolicyk8s.io"]
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kyverno-crb
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kyverno-cr
subjects:
  - kind: ServiceAccount
    name: kyverno-sa
    namespace: sbos-installer
---
apiVersion: v1
kind: Service
metadata:
  name: kyverno
  namespace: sbos-installer
spec:
  type: ClusterIP
  selector:
    app: kyverno
  ports:
    - name: https
      port: 443
      targetPort: 9443
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kyverno
  namespace: sbos-installer
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: kyverno
  template:
    metadata:
      labels:
        app: kyverno
    spec:
      serviceAccountName: kyverno-sa
      containers:
        - name: kyverno
          image: ghcr.io/kyverno/kyverno:v1.12.0
          args:
            - --servicePort=443
            - --webhookServerPort=9443
            - --disableMetrics=false
            - --metricsPort=8000
            - --caSecretName=kyverno.sbos-installer.svc.kyverno-tls-ca
            - --tlsSecretName=kyverno.sbos-installer.svc.kyverno-tls-pair
            - --backgroundServiceAccountName=system:serviceaccount:sbos-installer:kyverno-sa
          env:
            - name: KYVERNO_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: KYVERNO_SERVICEACCOUNT_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.serviceAccountName
            - name: KYVERNO_DEPLOYMENT
              value: kyverno
            - name: KYVERNO_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: KYVERNO_SVC
              value: kyverno
            - name: INIT_CONFIG
              value: kyverno
            - name: METRICS_CONFIG
              value: kyverno-metrics
          ports:
            - containerPort: 9443
              name: https
            - containerPort: 8000
              name: metrics
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health/liveness
              port: 9443
              scheme: HTTPS
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: 9443
              scheme: HTTPS
            initialDelaySeconds: 10
            periodSeconds: 10
