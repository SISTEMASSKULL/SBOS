# manifest.yml — Ficha nginx-web (SBOS-005 §hostserver)
# SBOS-049 §4 · Order 340 · Deployment
identity:
  id: nginx-web
  version: "1.26"
  category: 1
  criticality: false
  server: S-HOST
  description: "Web institucional estática, criticality: false"

workload:
  type: Deployment

order:
  execution_order: 340

requirements:
  dependencies:
    - network-validator


deployment:
  strategy: RollingUpdate

governance:


  auto_install: true
  requires_approval: false
health:
  command: "curl -sf http://localhost:80"
  interval_seconds: 30
  timeout_seconds: 10


license: MIT

meta:
  backend: kubernetes
  idempotent: true
  estimated_minutes: 5
  rollback_support: false
