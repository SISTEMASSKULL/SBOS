# manifest.yml — Ficha keycloak (SBOS-035 Ficha 09)
# SBOS-019 §9 · Order 130 · StatefulSet
identity:
  id: keycloak
  name: Keycloak 26.x
  version: "26.1"
  category: 1
  criticality: true
  server: identityserver
  description: "IAM empresarial con PostgreSQL backend y realm skbos"

workload:
  type: StatefulSet
  namespace: sbos-identity
  replicas: 2
  service_account: keycloak-sa

order:
  execution_order: 130
  timeout_minutes: 20

requirements:
  dependencies:
    - postgresql
    - vault
  cpu_request: "1000m"
  cpu_limit: "2000m"
  memory_request: "2Gi"
  memory_limit: "4Gi"
  pvc_size: "10Gi"
  pvc_storage_class: "sbos-fast"

deployment:
  strategy: RollingUpdate
  pod_management: OrderedReady

governance:
  auto_install: false
  backup_enabled: true
  backup_schedule: "0 3 * * *"
  encryption_required: true

health:
  check_command: "curl -sf http://localhost:9000/health/live"
  check_interval_seconds: 30
  check_timeout_seconds: 10
  consecutive_failures_threshold: 3
  initial_delay_seconds: 60

integrations:
  database:
    name: keycloak_db
    host_from: postgresql
    credentials_from: vault:secret/sbos/keycloak/db
  oidc:
    realm: skbos
    clients:
      - grafana
      - kong
      - core-ui
  clustering:
    protocol: jdbc-ping
