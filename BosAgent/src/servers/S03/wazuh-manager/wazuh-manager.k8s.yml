---
apiVersion: v1
kind: Service
metadata:
  name: wazuh-manager
  namespace: sbos-identity
spec:
  clusterIP: None
  selector:
    app: wazuh-manager
  ports:
    - name: http
      port: 55000
      targetPort: 55000
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: wazuh-manager
  namespace: sbos-identity
spec:
  serviceName: wazuh-manager
  replicas: 1
  selector:
    matchLabels:
      app: wazuh-manager
  template:
    metadata:
      labels:
        app: wazuh-manager
    spec:
      serviceAccountName: wazuh-manager-sa
      containers:
        - name: wazuh-manager
          image: docker.io/wazuh/wazuh-manager:4.10
          ports:
            - containerPort: 55000
              name: http

          volumeMounts:
            - name: data
              mountPath: /var/lib/wazuh-manager
          resources:
            requests:
              cpu: 1000m
              memory: 2Gi
            limits:
              cpu: 4000m
              memory: 4Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 55000
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 55000
            initialDelaySeconds: 10
            periodSeconds: 10

  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: sbos-fast
        resources:
          requests:
            storage: 100Gi
