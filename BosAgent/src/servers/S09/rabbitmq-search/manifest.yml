# manifest.yml — Ficha rabbitmq-search (SBOS-005 §searchserver)
# SBOS-049 §4 · Order 318 · StatefulSet
identity:
  id: rabbitmq-search
  name: RabbitMQ Search
  version: "3.13"
  category: 1
  criticality: false
  server: searchserver
  description: "AMQP for search indexing pipeline"

workload:
  type: StatefulSet
  namespace: sbos-search
  replicas: 1
  service_account: rabbitmq-search-sa

order:
  execution_order: 318
  timeout_minutes: 15

requirements:
  dependencies:

  cpu_request: "200m"
  cpu_limit: "1000m"
  memory_request: "512Mi"
  memory_limit: "1Gi"
pvc_size: "20Gi"
  pvc_storage_class: "sbos-fast"

deployment:
  strategy: Recreate

governance:


health:
  check_command: "rabbitmqctl status"
  check_interval_seconds: 30
  check_timeout_seconds: 10
  consecutive_failures_threshold: 3

