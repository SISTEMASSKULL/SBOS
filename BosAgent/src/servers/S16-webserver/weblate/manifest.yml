# manifest.yml — Ficha weblate (SBOS S16-webserver)
# Order 380 · Gestión de traducciones FTL/Fluent
identity:
  id: weblate
  name: weblate — Gestión de Traducciones
  version: "2026"
  category: 2
  criticality: false
  server: webserver
  description: "Plataforma web self-hosted para editar archivos FTL/Fluent de bi18n."

workload:
  type: Deployment
  namespace: sbos-web
  replicas: 1
  service_account: weblate-sa
  strategy: Recreate

order:
  execution_order: 380

requirements:
  dependencies:
    - postgresql
    - redis
    - nginx
  cpu_request: "500m"
  cpu_limit: "2000m"
  memory_request: "1Gi"
  memory_limit: "2Gi"

ports:
  - name: http
    port: 8080
    protocol: TCP
    description: "Weblate app web (nginx la proxifica)"

governance:
  auto_install: true
  requires_approval: false
  category_label: translation-ui

health:
  type: http
  check_path: /healthz/
  check_port: 8080
  check_interval_seconds: 60
  check_timeout_seconds: 15
  consecutive_failures_threshold: 3

meta:
  backend: kubernetes
  idempotent: true
  estimated_minutes: 5
  rollback_support: true
