# manifest.yml — Ficha kube-state-metrics (SBOS-005 §S12)
# SBOS-049 §4 · Order 202 · DaemonSet
# Expone métricas de objetos K8s (pods, nodes, deployments) para Prometheus
identity:
  id: kube-state-metrics
  version: "2.13.0"
  category: 1
  criticality: false
  server: S12
  description: "K8s object metrics exporter — pods/nodes/deployments → Prometheus"

workload:
  type: deployment
  runtime: kubernetes

order:
  execution_order: 202

requirements:
  dependencies:
    - prometheus

deployment:
  strategy: RollingUpdate

governance:
  auto_install: false
  requires_approval: false

health:
  command: "curl -sf http://localhost:8080/healthz"
  interval_seconds: 30
  timeout_seconds: 10

integrations:
  prometheus:
    scrape_port: 8080
    scrape_path: "/metrics"
  exporters:
    self_metrics: true

license: MIT

meta:
  backend: kubernetes
  idempotent: true
  estimated_minutes: 5
  rollback_support: false
