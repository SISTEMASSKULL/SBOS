# Grafana 11.5 configuration
# SBOS-019 §9 · Order 210 · Deployment
# Mounted at /etc/grafana/grafana.ini

[server]
http_port = 3000
domain = ${CLIENT_DOMAIN}
root_url = https://status.${CLIENT_DOMAIN}

[database]
type = postgres
host = postgresql.sbos-data:5432
name = grafana_db
user = grafana
password = ${GF_DATABASE_PASSWORD}
ssl_mode = disable
max_open_conn = 20

[auth.generic_oauth]
enabled = true
name = Keycloak
allow_sign_up = true
client_id = grafana
client_secret = ${GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET}
scopes = openid profile email groups
auth_url = https://auth.${CLIENT_DOMAIN}/realms/skbos/protocol/openid-connect/auth
token_url = https://auth.${CLIENT_DOMAIN}/realms/skbos/protocol/openid-connect/token
api_url = https://auth.${CLIENT_DOMAIN}/realms/skbos/protocol/openid-connect/userinfo
role_attribute_path = contains(realm_access.roles[*], 'grafana-admin') && 'Admin' || contains(realm_access.roles[*], 'grafana-editor') && 'Editor' || 'Viewer'

[security]
admin_user = admin
admin_password = ${GF_SECURITY_ADMIN_PASSWORD}
disable_gravatar = true
cookie_secure = true
cookie_samesite = strict

[users]
allow_sign_up = false
default_theme = dark

[analytics]
reporting_enabled = false
check_for_updates = false

[log]
mode = console
level = info

[dashboards]
default_home_dashboard_path = /etc/grafana/provisioning/dashboards/sbos-operacional.json

[alerting]
enabled = false
