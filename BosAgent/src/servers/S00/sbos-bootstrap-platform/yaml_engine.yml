# yaml_engine.yml — sbos-bootstrap-platform
# Namespaces canónicos de SBOS + StorageClass dinámica (local-path).

namespaces:
  - name: sbos-data
    labels:
      sbos.app/server: dataserver
      sbos.app/criticality: maxima
  - name: sbos-security
    labels:
      sbos.app/server: identityserver
      sbos.app/criticality: maxima
  - name: sbos-gateway
    labels:
      sbos.app/server: gatewayserver
      sbos.app/criticality: maxima
  - name: sbos-monitor
    labels:
      sbos.app/server: monitorserver
      sbos.app/criticality: maxima
  - name: sbos-erp
    labels:
      sbos.app/server: erpserver
      sbos.app/criticality: maxima
  - name: sbos-apps
    labels:
      sbos.app/server: appsserver
      sbos.app/criticality: alta
  - name: sbos-docs
    labels:
      sbos.app/server: docserver
      sbos.app/criticality: alta
  - name: sbos-vdi
    labels:
      sbos.app/server: vdiserver
      sbos.app/criticality: alta
  - name: sbos-comms
    labels:
      sbos.app/server: commsserver
      sbos.app/criticality: alta
  - name: sbos-ops
    labels:
      sbos.app/server: opsserver
      sbos.app/criticality: alta
  - name: sbos-search
    labels:
      sbos.app/server: searchserver
      sbos.app/criticality: alta
  - name: sbos-geo
    labels:
      sbos.app/server: geoserver
      sbos.app/criticality: media
  - name: sbos-system
    labels:
      sbos.app/server: hostserver
      sbos.app/criticality: maxima

storage_class:
  name: local-path
  provisioner: rancher.io/local-path
  reclaim_policy: Delete
  volume_binding_mode: WaitForFirstConsumer
  is_default: true
  local_path_provisioner:
    version: "0.0.30"
    namespace: local-path-storage
    image: rancher/local-path-provisioner:v0.0.30
    storage_path: /opt/local-path-provisioner
