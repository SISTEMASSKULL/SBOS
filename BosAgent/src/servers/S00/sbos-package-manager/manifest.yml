# manifest.yml — Ficha sbos-package-manager (SBOS-005 §hostserver)
# SBOS-049 §4 · Order 19 · Unified package manager
identity:
  id: sbos-package-manager
  name: SBOS Unified Package Manager
  version: "1.0"
  category: 1
  criticality: true
  server: hostserver
  description: "Multi-backend package manager: apt (system), pip (python), helm (kubernetes). Auto-generates fichas on install."

workload:
  type: Deployment
  namespace: sbos-installer
  replicas: 1
  service_account: sbos-package-manager-sa

order:
  execution_order: 19
  timeout_minutes: 10

requirements:
  dependencies:
    - sbos-repair

  cpu_request: "25m"
  cpu_limit: "100m"
  memory_request: "32Mi"
  memory_limit: "64Mi"

deployment:
  strategy: Recreate

governance:
  auto_install: true

health:
  check_command: "bosctl install --backend=apt --help 2>/dev/null | grep -q 'backend'"
  check_interval_seconds: 600
  check_timeout_seconds: 20
  consecutive_failures_threshold: 2
