# yaml_engine.yml — sbos-bkernel
# bKernel CDC Daemon — WAL listener + Redis Streams fanout.

daemon:
  binary: /opt/bos/bin/bkernel
  socket: /run/bos/bkernel.sock
  systemd_service: bkernel.service
  user: bkernel
  group: bosagent

config:
  pg_wal_level: logical
  pg_max_replication_slots: 10
  pg_max_wal_senders: 10
  redis_stream_prefix: "sbos:"
  redis_maxlen: 10000
