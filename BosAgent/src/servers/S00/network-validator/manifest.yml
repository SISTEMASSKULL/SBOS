# manifest.yml — Ficha network-validator (SBOS-005 §hostserver)
# SBOS-049 §4 · Order 15 · Deployment
identity:
  id: network-validator
  name: Network Validator
  version: "1.0"
  category: 1
  criticality: true
  server: hostserver
  description: "Validates CNI, DNS, service mesh prerequisites"

workload:
  type: Deployment
  namespace: sbos-installer
  replicas: 1
  service_account: network-validator-sa

order:
  execution_order: 15
  timeout_minutes: 10

requirements:
  dependencies:
    - sbos-bootstrap-platform
  cpu_request: "100m"
  cpu_limit: "500m"
  memory_request: "128Mi"
  memory_limit: "256Mi"


deployment:
  strategy: Recreate

governance:
  auto_install: false


health:
  check_command: "nslookup kubernetes.default.svc.cluster.local"
  check_interval_seconds: 30
  check_timeout_seconds: 10
  consecutive_failures_threshold: 3

