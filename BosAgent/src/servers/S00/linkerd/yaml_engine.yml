# yaml_engine.yml — linkerd lifecycle phases
# SBOS-049 §4.4 · Order · daemonset
# R16 Zero hardcoding

pre_install:
  - name: "create_namespace"
    command: "kubectl create namespace sbos-installer --dry-run=client -o yaml | kubectl apply -f -"
    timeout_seconds: 30
  - name: "apply_network_policy"
    command: "sbos_k8s_core apply -f ${SBOS_FICHA_DIR}/linkerd.network -n sbos-installer"
    timeout_seconds: 30

install:
  - name: "apply_manifest"
    command: "sbos_k8s_core apply -f ${SBOS_FICHA_DIR}/linkerd.k8s.yml -n sbos-installer"
    timeout_seconds: 300
  - name: "wait_ready"
    command: "kubectl wait --for=condition=Ready daemonset/linkerd -n sbos-installer --timeout=300s"
    timeout_seconds: 600

post_install:
  - name: "verify"
    command: "echo 'verify_ok'"
    timeout_seconds: 30

update:
  - name: "rolling_restart"
    command: "kubectl rollout restart daemonset linkerd -n sbos-installer"
    timeout_seconds: 300

repair:
  - name: "restart"
    command: "kubectl rollout restart daemonset linkerd -n sbos-installer"
    timeout_seconds: 120

uninstall:
  - name: "delete_manifest"
    command: "kubectl delete daemonset linkerd -n sbos-installer --ignore-not-found"
    timeout_seconds: 120
  - name: "delete_pvc"
    command: "echo 'no pvc'"
    timeout_seconds: 60
