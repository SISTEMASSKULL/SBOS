# manifest.yml — Ficha linkerd (SBOS-005 §hostserver)
# SBOS-049 §4 · Order 150 · DaemonSet
identity:
  id: linkerd
  name: Linkerd Service Mesh
  version: "2.16"
  category: 1
  criticality: true
  server: hostserver
  description: "Automatic mTLS between pods, zero-trust inter-namespace"

workload:
  type: DaemonSet
  namespace: sbos-installer
  replicas: 1
  service_account: linkerd-sa

order:
  execution_order: 150
  timeout_minutes: 20

requirements:
  dependencies:
    - network-validator
  cpu_request: "200m"
  cpu_limit: "1000m"
  memory_request: "256Mi"
  memory_limit: "1Gi"


deployment:
  strategy: RollingUpdate

governance:
  auto_install: false


health:
  check_command: "linkerd check"
  check_interval_seconds: 30
  check_timeout_seconds: 10
  consecutive_failures_threshold: 3

