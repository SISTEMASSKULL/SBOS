# yaml_engine.yml — sbos-namespace
# Crea el namespace del tenant con ResourceQuota, LimitRange y NetworkPolicy.

namespace:
  naming_pattern: "sbos-{{ tenant_id }}"
  labels:
    sbos.app/tenant: "{{ tenant_id }}"
    sbos.app/managed-by: bos

resource_quota:
  requests.cpu: "4"
  requests.memory: "8Gi"
  limits.cpu: "8"
  limits.memory: "16Gi"
  persistentvolumeclaims: "20"

network_policy:
  default: deny
  allow_from_gateway: true
  allow_internal_dns: true
