# yaml_engine.yml — sbos-vdi-config
# Configuración post-instalación del producto VDI:
# rutas Kong, clientes Keycloak, NetworkPolicies cruzadas.

kong_routes:
  - name: vdi-nextcloud
    paths: ["/files", "/nextcloud"]
    service: nextcloud.sbos-vdi.svc:80
    plugins: [oauth2, rate-limiting]
  - name: vdi-onlyoffice
    paths: ["/office"]
    service: onlyoffice.sbos-vdi.svc:80
    plugins: [oauth2]
  - name: vdi-guacamole
    paths: ["/desktop", "/guacamole"]
    service: guacamole.sbos-vdi.svc:8080
    plugins: [oauth2]

keycloak_clients:
  - client_id: nextcloud
    realm: skull
    redirect_uris: ["https://{{ domain }}/files/*", "https://{{ domain }}/nextcloud/*"]
  - client_id: guacamole
    realm: skull
    redirect_uris: ["https://{{ domain }}/desktop/*", "https://{{ domain }}/guacamole/*"]

network_policies:
  - allow_vdi_to_postgres: true
  - allow_vdi_to_redis: true
  - allow_external_to_vdi_via_kong: true

result_marker:
  kind: ConfigMap
  name: sbos-vdi-configured
  namespace: sbos-vdi
