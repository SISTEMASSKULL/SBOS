identity:
  id: "onlyoffice"
  name: "OnlyOffice Document Server"
  version: "8.2.2"
  server: "S13"
  namespace: "sbos-vdi"
  category: 2
  criticality: true

workload:
  type: "kubernetes"
  state: "prod"

order:
  execution_order: 220

parameters:
  ONLYOFFICE_JWT_ENABLED: "true"
  ONLYOFFICE_HOSTNAME: "onlyoffice.sbos.local"

requirements:
  ram_mb: 2048
  cpu_cores: 2
  disk_gb: 20
  dependencies:
    - postgresql
    - redis
    - kong

deployment:
  namespace: "sbos-vdi"
  workload_type: "Deployment"
  k8s_manifest: "onlyoffice.k8s.yml"

governance:
  auto_install: true
  requires_approval: false
  category_label: "ofimatica"

health:
  type: http
  path: /healthcheck
  port: 80
  timeout_seconds: 30

compatibility:
  min_iam_installer_version: "1.0.0"
