identity:
  id: "nextcloud"
  name: "Nextcloud — Almacenamiento y Colaboración"
  version: "30.0.2"
  server: "S13"
  namespace: "sbos-vdi"
  category: 2
  criticality: true

workload:
  type: "kubernetes"
  state: "prod"

order:
  execution_order: 200

parameters:
  NEXTCLOUD_ADMIN_USER: "admin"
  NEXTCLOUD_TRUSTED_DOMAINS: "nextcloud.sbos.local"
  NEXTCLOUD_OIDC_PROVIDER: "https://auth.sbos.local/realms/tenant-{id}"

requirements:
  ram_mb: 2048
  cpu_cores: 2
  disk_gb: 50
  dependencies:
    - postgresql
    - redis
    - minio
    - keycloak
    - kong

deployment:
  namespace: "sbos-vdi"
  workload_type: "Deployment"
  k8s_manifest: "nextcloud.k8s.yml"

governance:
  auto_install: true
  requires_approval: false
  category_label: "colaboracion"

health:
  # BUG-46: health.type:http hace curl a ClusterIP sin Host header.
  # Nextcloud rechaza con HTTP 400 cualquier request sin NEXTCLOUD_TRUSTED_DOMAINS.
  # ficha_health() en task_catalog.sh verifica readyReplicas directamente.
  type: none

compatibility:
  min_iam_installer_version: "1.0.0"
