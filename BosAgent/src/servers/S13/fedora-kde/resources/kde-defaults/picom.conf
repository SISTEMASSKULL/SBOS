# picom.conf — Compositor X11 para SBOS Desktop (Windows 11 visual style)
# Backend xrender: compatible con VNC sin GPU real

backend = "xrender";

# Bordes redondeados (Windows 11 usa ~8px de radio)
corner-radius = 8;
round-borders = 1;

# Sombras suaves bajo las ventanas
shadow = true;
shadow-radius = 12;
shadow-opacity = 0.35;
shadow-offset-x = -8;
shadow-offset-y = -8;

# Sin animaciones pesadas (VNC tiene latencia)
fading = false;

# Sin transparencia — la renderización GPU virtual no lo maneja bien
inactive-opacity = 1.0;
active-opacity = 1.0;
frame-opacity = 1.0;

# Excluir el panel de Plasma y fondos de escritorio
shadow-exclude = [
    "class_g = 'plasmashell'",
    "name = 'Plasma'",
    "name = 'plasmashell'",
    "_GTK_FRAME_EXTENTS@:c",
    "class_g = 'krunner'"
];

rounded-corners-exclude = [
    "class_g = 'plasmashell'",
    "name = 'plasmashell'"
];

# Refrescar la pantalla con vsync
vsync = false;

log-level = "warn";
