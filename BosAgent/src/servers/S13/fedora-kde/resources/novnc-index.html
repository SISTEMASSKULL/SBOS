<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>SBOS VDI</title>
<style>
  body { margin:0; background:#1a1a2e; display:flex; align-items:center;
         justify-content:center; height:100vh; color:#eee; font-family:sans-serif; }
</style>
<script>
window.onload = function() {
    var p = new URLSearchParams(window.location.search);
    if (!p.has("quality"))     p.set("quality",     "4");
    if (!p.has("compression")) p.set("compression", "6");
    if (!p.has("resize"))      p.set("resize",      "scale");
    if (!p.has("autoconnect")) p.set("autoconnect", "1");
    window.location.replace("vnc.html?" + p.toString());
};
</script>
</head>
<body>Conectando a SBOS VDI...</body>
</html>
