<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SBOS Desktop</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a2e; }
    #desktop { width: 100%; height: 100%; }
    #connecting {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: #1a1a2e; color: #fff; font: 16px/1 sans-serif;
      z-index: 10; transition: opacity 0.4s;
    }
    #connecting.hidden { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <div id="connecting">Iniciando sesión…</div>
  <div id="desktop"></div>
  <script type="module">
    import RFB from './core/rfb.js';

    const overlay = document.getElementById('connecting');
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    const url   = proto + '://' + location.host + location.pathname;

    const rfb = new RFB(document.getElementById('desktop'), url);
    rfb.scaleViewport = true;

    rfb.addEventListener('connect', () => {
      overlay.classList.add('hidden');
    });
    rfb.addEventListener('disconnect', (e) => {
      if (!e.detail.clean) {
        overlay.textContent = 'Reconectando…';
        overlay.classList.remove('hidden');
        setTimeout(() => location.reload(), 3000);
      }
    });
  </script>
</body>
</html>
