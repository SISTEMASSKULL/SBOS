# Bareos Director Config — SKULL Operator
# Fuente: SBOS-INSTALACION-FORMULARIO.md §7
# Retención: 90 días · Frecuencia: diario 02:00

Director {
  Name = bareos-dir
  QueryFile = /etc/bareos/query.sql
  MaximumConcurrentJobs = 10
  Password = "${BAREOS_DIR_PASSWORD}"
  Messages = Daemon
}

JobDefs {
  Name = "DefaultJob"
  Type = Backup
  Level = Incremental
  Client = bareos-fd
  FileSet = "FullSet"
  Schedule = "DailyCycle"
  Storage = File
  Messages = Standard
  Pool = Incremental
  Priority = 10
  Write Bootstrap = "/var/lib/bareos/%c.bsr"
  Full Backup Pool = Full
  Differential Backup Pool = Differential
  Incremental Backup Pool = Incremental
}

Schedule {
  Name = "DailyCycle"
  Run = Full sun at 02:00
  Run = Differential mon-fri at 02:00
}

Pool {
  Name = Full
  Pool Type = Backup
  Recycle = yes
  AutoPrune = yes
  Volume Retention = 90 days
  Maximum Volume Bytes = 50G
}

Pool {
  Name = Incremental
  Pool Type = Backup
  Recycle = yes
  AutoPrune = yes
  Volume Retention = 90 days
  Maximum Volume Bytes = 10G
}

Pool {
  Name = Differential
  Pool Type = Backup
  Recycle = yes
  AutoPrune = yes
  Volume Retention = 90 days
}
