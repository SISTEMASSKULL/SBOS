identity:
  id: docuseal
  server: S08
  version: "1.8.9"
  category: 2
  criticality: false
  description: "DocuSeal 1.8.9 — plataforma de firma digital de documentos open-source. Flujos de firma, plantillas PDF, OTP por correo/SMS, auditoría de firmas."

workload:
  type: deployment
  runtime: docker
  namespace: sbos-docs
  replicas: 1

order:
  execution_order: 355

requirements:
  dependencies:
    - postgresql
    - minio
    - keycloak

governance:
  auto_install: false
  requires_approval: false
  category_label: "gestion-documental"

meta:
  backend: k8s
  idempotent: true
  estimated_minutes: 5
  rollback_support: true

ports:
  - name: http
    port: 3000
    protocol: TCP
    internal_only: false

health:
  type: command
  command: "kubectl --kubeconfig=/etc/bos/.kube/config get deployment docuseal -n sbos-docs -o jsonpath='{.status.readyReplicas}' 2>/dev/null"
  expected_output: "1"
  timeout_seconds: 30

audit:
  ctx_id_required: true
  log_path: /var/log/bos/fichas/docuseal.log

vault:
  secret_path: "secret/tenants/{{ tenant_id }}/docuseal"
  keys:
    - secret_key_base

versions:
  docuseal: "1.8.9"
