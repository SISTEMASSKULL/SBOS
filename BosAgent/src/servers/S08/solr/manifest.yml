# manifest.yml — Ficha solr (SBOS-005 §docserver)
# SBOS-049 §4 · Order 308 · StatefulSet
identity:
  id: solr
  name: Apache Solr
  version: "9.5"
  category: 1
  criticality: false
  server: docserver
  description: "Full-text search backend for DMS"

workload:
  type: StatefulSet
  namespace: sbos-docs
  replicas: 1
  service_account: solr-sa

order:
  execution_order: 308
  timeout_minutes: 15

requirements:
  dependencies:
    - postgresql
  cpu_request: "500m"
  cpu_limit: "2000m"
  memory_request: "1Gi"
  memory_limit: "2Gi"
pvc_size: "50Gi"
  pvc_storage_class: "sbos-fast"

deployment:
  strategy: Recreate

governance:


health:
  check_command: "curl -sf http://localhost:8983/solr/admin/health"
  check_interval_seconds: 30
  check_timeout_seconds: 10
  consecutive_failures_threshold: 3

