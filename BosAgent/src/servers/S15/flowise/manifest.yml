identity:
  id: flowise
  server: S15
  version: "2.2.6"
  category: 3
  criticality: false
  description: "Flowise 2.2.6 — constructor visual de flujos de trabajo con LLMs (LLM orchestration). Permite crear agentes IA, pipelines RAG y chatbots sin código para el negocio SBOS."

workload:
  type: deployment
  runtime: docker
  namespace: sbos-ai
  replicas: 1

order:
  execution_order: 525

requirements:
  dependencies:
    - ollama
    - qdrant
    - postgresql

governance:
  auto_install: false
  requires_approval: false
  category_label: "ia-soberana"

meta:
  backend: k8s
  idempotent: true
  estimated_minutes: 5
  rollback_support: true

ports:
  - name: http
    port: 3000
    protocol: TCP
    internal_only: false

health:
  type: command
  command: "kubectl --kubeconfig=/etc/bos/.kube/config get deployment flowise -n sbos-ai -o jsonpath='{.status.readyReplicas}' 2>/dev/null"
  expected_output: "1"
  timeout_seconds: 30

audit:
  ctx_id_required: true
  log_path: /var/log/bos/fichas/flowise.log

vault:
  secret_path: "secret/tenants/{{ tenant_id }}/flowise"
  keys:
    - flowise_secretkey_overwrite
    - flowise_username
    - flowise_password

versions:
  flowise: "2.2.6"
