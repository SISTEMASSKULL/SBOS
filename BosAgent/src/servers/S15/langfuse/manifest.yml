identity:
  id: langfuse
  server: S15
  version: "3.32.0"
  category: 3
  criticality: false
  description: "Langfuse 3.32.0 — observabilidad de LLMs (traces, métricas, evaluaciones). Instrumenta todas las llamadas IA del SBOS para detectar alucinaciones, latencia y costos."

workload:
  type: deployment
  runtime: docker
  namespace: sbos-ai
  replicas: 1

order:
  execution_order: 520

requirements:
  dependencies:
    - postgresql
    - redis
    - ollama

governance:
  auto_install: false
  requires_approval: false
  category_label: "ia-soberana"

meta:
  backend: k8s
  idempotent: true
  estimated_minutes: 8
  rollback_support: true

ports:
  - name: http
    port: 3000
    protocol: TCP
    internal_only: false

health:
  type: command
  command: "kubectl --kubeconfig=/etc/bos/.kube/config get deployment langfuse -n sbos-ai -o jsonpath='{.status.readyReplicas}' 2>/dev/null"
  expected_output: "1"
  timeout_seconds: 30

audit:
  ctx_id_required: true
  log_path: /var/log/bos/fichas/langfuse.log

vault:
  secret_path: "secret/tenants/{{ tenant_id }}/langfuse"
  keys:
    - nextauth_secret
    - encryption_key
    - salt

versions:
  langfuse: "3.32.0"
