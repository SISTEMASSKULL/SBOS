identity:
  id: qdrant
  server: S15
  version: "1.14.0"
  category: 3
  criticality: false
  description: "Qdrant 1.14.0 — base de datos vectorial para búsqueda semántica y RAG (Retrieval Augmented Generation). Almacena embeddings de documentos SBOS para consultas por similitud."

workload:
  type: statefulset
  runtime: docker
  namespace: sbos-ai
  replicas: 1

order:
  execution_order: 505

requirements:
  dependencies:
    - sbos-bootstrap-platform

governance:
  auto_install: false
  requires_approval: false
  category_label: "ia-soberana"

meta:
  backend: k8s
  idempotent: true
  estimated_minutes: 5
  rollback_support: true

ports:
  - name: http
    port: 6333
    protocol: TCP
    internal_only: true
  - name: grpc
    port: 6334
    protocol: TCP
    internal_only: true

health:
  type: command
  command: "kubectl --kubeconfig=/etc/bos/.kube/config get statefulset qdrant -n sbos-ai -o jsonpath='{.status.readyReplicas}' 2>/dev/null"
  expected_output: "1"
  timeout_seconds: 30

audit:
  ctx_id_required: true
  log_path: /var/log/bos/fichas/qdrant.log

versions:
  qdrant: "1.14.0"
