---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: keycloak-sa
  namespace: sbos-identity
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: sbos-identity
spec:
  clusterIP: None
  selector:
    app: keycloak
  ports:
    - name: http
      port: 9000
      targetPort: 9000
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: keycloak
  namespace: sbos-identity
spec:
  serviceName: keycloak
  replicas: 1
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      serviceAccountName: keycloak-sa
      securityContext:
        fsGroup: 1000
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.1
          args:
            - start-dev
            - --db=postgres
            - --db-url=jdbc:postgresql://postgresql.sbos-data:5432/keycloak_db
            - --db-username=postgres
            - --db-password=$(KC_DB_PASSWORD)
            - --http-port=9000
            - --health-enabled=true
            - --hostname-strict=false
            - --hostname=localhost
          ports:
            - containerPort: 9000
              name: http
          env:
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-secret
                  key: db-password
            - name: KEYCLOAK_ADMIN
              value: admin
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-secret
                  key: admin-password
          volumeMounts:
            - name: data
              mountPath: /opt/keycloak/data
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /
              port: 9000
            initialDelaySeconds: 120
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 9000
            initialDelaySeconds: 60
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: sbos-local-path
        resources:
          requests:
            storage: 1Gi
