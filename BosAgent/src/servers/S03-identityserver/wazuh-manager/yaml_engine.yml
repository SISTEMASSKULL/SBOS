# yaml_engine.yml — wazuh-manager lifecycle phases
# SBOS-049 §4.4 · Order · statefulset
# R16 Zero hardcoding

pre_install:
  - name: "create_namespace"
    command: "kubectl create namespace sbos-identity --dry-run=client -o yaml | kubectl apply -f -"
    timeout_seconds: 30
  - name: "apply_network_policy"
    command: "sbos_k8s_core apply -f ${SBOS_FICHA_DIR}/wazuh-manager.network -n sbos-identity"
    timeout_seconds: 30

install:
  - name: "apply_manifest"
    command: "sbos_k8s_core apply -f ${SBOS_FICHA_DIR}/wazuh-manager.k8s.yml -n sbos-identity"
    timeout_seconds: 300
  - name: "wait_ready"
    command: "kubectl wait --for=condition=Ready pod/wazuh-manager-0 -n sbos-identity --timeout=600s"
    timeout_seconds: 600

post_install:
  - name: "verify"
    command: "echo 'verify_ok'"
    timeout_seconds: 30

update:
  - name: "rolling_restart"
    command: "kubectl rollout restart statefulset wazuh-manager -n sbos-identity"
    timeout_seconds: 300

repair:
  - name: "restart"
    command: "kubectl rollout restart statefulset wazuh-manager -n sbos-identity"
    timeout_seconds: 120

uninstall:
  - name: "delete_manifest"
    command: "kubectl delete statefulset wazuh-manager -n sbos-identity --ignore-not-found"
    timeout_seconds: 120
  - name: "delete_pvc"
    command: "kubectl delete pvc wazuh-manager-data -n sbos-identity --ignore-not-found"
    timeout_seconds: 60
