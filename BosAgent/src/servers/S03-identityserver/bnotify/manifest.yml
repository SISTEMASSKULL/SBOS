# manifest.yml — Ficha bnotify (SBOS S03-identityserver)
# BC-12 · SBOS-049 §4 · SBOS-050 · ADR-020 · Order 152
identity:
  id: bnotify
  name: bnotify — Push MFA y Notificaciones
  version: "1.0.0"
  category: 1
  criticality: true
  server: identityserver
  description: "Daemon Rust/gRPC de notificaciones soberanas. Push MFA, alertas del sistema y mensajería bChat. Cero dependencia de servicios externos."

workload:
  type: SystemdService
  host: true
  binary: /usr/local/bin/bnotify
  user: bnotify
  group: bosagent
  working_dir: /opt/bnotify

order:
  execution_order: 152

requirements:
  dependencies:
    - postgresql
    - redis
    - bauth

ports:
  - name: grpc
    protocol: unix
    path: /run/bos/bnotify.sock
    description: "gRPC over Unix socket — interface dual (ADR-020)"

governance:
  auto_install: false
  requires_approval: false
  category_label: daemon-soberano

health:
  type: command
  check_command: "systemctl is-active --quiet bnotify.service"
  check_interval_seconds: 30
  check_timeout_seconds: 10
  consecutive_failures_threshold: 3

meta:
  backend: systemd
  runtime: rust-musl
  idempotent: true
  estimated_minutes: 2
  rollback_support: true
