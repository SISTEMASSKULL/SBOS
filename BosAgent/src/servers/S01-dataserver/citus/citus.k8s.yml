---
# citus es una extensión de PostgreSQL para distribución horizontal.
# Este Job habilita la extensión en el PostgreSQL SBOS existente.
# No despliega una instancia PostgreSQL separada.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: citus-sa
  namespace: sbos-data
---
apiVersion: batch/v1
kind: Job
metadata:
  name: citus-init
  namespace: sbos-data
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      serviceAccountName: citus-sa
      restartPolicy: OnFailure
      containers:
        - name: citus
          image: docker.io/library/postgres:18
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgresql-secret
                  key: password
          command:
            - /bin/sh
            - -c
            - |
              psql -h postgresql.sbos-data.svc.cluster.local \
                   -U postgres -d SBOSDB \
                   -c "DO \$\$ BEGIN
                         IF EXISTS (SELECT 1 FROM pg_available_extensions WHERE name='citus') THEN
                           CREATE EXTENSION IF NOT EXISTS citus;
                           RAISE NOTICE 'citus habilitado';
                         ELSE
                           RAISE NOTICE 'citus no disponible en este servidor PostgreSQL, omitido';
                         END IF;
                       END \$\$;" || true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
