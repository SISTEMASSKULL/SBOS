---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pgbackrest-sa
  namespace: sbos-data
---
# pgbackrest: backup de PostgreSQL usando imagen Debian con apt install
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgbackrest
  namespace: sbos-data
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: pgbackrest
  template:
    metadata:
      labels:
        app: pgbackrest
    spec:
      serviceAccountName: pgbackrest-sa
      initContainers:
        - name: install-pgbackrest
          image: docker.io/library/debian:12-slim
          command:
            - /bin/sh
            - -c
            - |
              apt-get update -qq && apt-get install -y -qq pgbackrest && cp /usr/bin/pgbackrest /shared/pgbackrest
          volumeMounts:
            - name: shared-bin
              mountPath: /shared
      containers:
        - name: pgbackrest
          image: docker.io/library/debian:12-slim
          command: ["sleep", "infinity"]
          volumeMounts:
            - name: shared-bin
              mountPath: /usr/local/bin
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            exec:
              command: ["test", "-f", "/usr/local/bin/pgbackrest"]
            initialDelaySeconds: 60
            periodSeconds: 60
      volumes:
        - name: shared-bin
          emptyDir: {}
