---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pg-stat-monitor-sa
  namespace: sbos-data
---
# pg_stat_monitor es una extensión instalada en el PostgreSQL SBOS.
# Este Job habilita la extensión si no está habilitada.
apiVersion: batch/v1
kind: Job
metadata:
  name: pg-stat-monitor-init
  namespace: sbos-data
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      serviceAccountName: pg-stat-monitor-sa
      restartPolicy: OnFailure
      containers:
        - name: pg-stat-monitor
          image: docker.io/library/postgres:18
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgresql-secret
                  key: password
          command:
            - /bin/sh
            - -c
            - |
              psql -h postgresql.sbos-data.svc.cluster.local \
                   -U postgres -d SBOSDB \
                   -c "DO \$\$ BEGIN
                         IF EXISTS (SELECT 1 FROM pg_available_extensions WHERE name='pg_stat_monitor') THEN
                           CREATE EXTENSION IF NOT EXISTS pg_stat_monitor;
                           RAISE NOTICE 'pg_stat_monitor habilitado';
                         ELSE
                           RAISE NOTICE 'pg_stat_monitor no disponible en este servidor, omitido';
                         END IF;
                       END \$\$;" || true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
