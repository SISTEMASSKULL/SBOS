# manifest.yml — Ficha pg-stat-monitor (SBOS-005 §dataserver)
# SBOS-049 §4 · Order 116 · Deployment
identity:
  id: pg-stat-monitor
  name: pg_stat_monitor
  version: "2.0"
  category: 1
  criticality: false
  server: dataserver
  description: "Advanced query monitoring"

workload:
  type: Job
  namespace: sbos-data
  service_account: pg-stat-monitor-sa

order:
  execution_order: 116
  timeout_minutes: 10

requirements:
  dependencies:
    - postgresql
  cpu_request: "100m"
  cpu_limit: "500m"
  memory_request: "128Mi"
  memory_limit: "256Mi"


deployment:
  strategy: RollingUpdate

governance:


  auto_install: true
  requires_approval: false
health:
  type: none

