# yaml_engine.yml — Redis lifecycle phases
# SBOS-019 §9

pre_install:
  - name: "create_namespace"
    command: "kubectl create namespace sbos-data --dry-run=client -o yaml | kubectl apply -f -"
    timeout_seconds: 30
  - name: "apply_network_policy"
    command: "sbos_k8s_core apply -f ${SBOS_FICHA_DIR}/redis.network -n sbos-data"
    timeout_seconds: 30

install:
  - name: "apply_statefulset"
    command: "sbos_k8s_core apply -f ${SBOS_FICHA_DIR}/redis.k8s.yml -n sbos-data"
    timeout_seconds: 120
  - name: "wait_ready"
    command: "kubectl wait --for=condition=Ready pod/redis-0 -n sbos-data --timeout=120s"
    timeout_seconds: 120

post_install:
  - name: "verify_ping"
    command: "kubectl exec redis-0 -n sbos-data -- redis-cli ping | grep -q PONG"
    timeout_seconds: 30

update:
  - name: "rolling_restart"
    command: "kubectl rollout restart statefulset redis -n sbos-data"
    timeout_seconds: 120

repair:
  - name: "restart_pod"
    command: "kubectl delete pod redis-0 -n sbos-data --ignore-not-found"
    timeout_seconds: 60

uninstall:
  - name: "delete_statefulset"
    command: "kubectl delete statefulset redis -n sbos-data --ignore-not-found"
    timeout_seconds: 60
  - name: "delete_pvc"
    command: "kubectl delete pvc redis-data -n sbos-data --ignore-not-found"
    timeout_seconds: 60
