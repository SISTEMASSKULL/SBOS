# yaml_engine.yml — rabbitmq-search lifecycle phases
# SBOS-049 §4.4 · Order · statefulset
# R16 Zero hardcoding

pre_install:
  - name: "create_namespace"
    command: "kubectl create namespace sbos-search --dry-run=client -o yaml | kubectl apply -f -"
    timeout_seconds: 30
  - name: "apply_network_policy"
    command: "sbos_k8s_core apply -f ${SBOS_FICHA_DIR}/rabbitmq-search.network -n sbos-search"
    timeout_seconds: 30

install:
  - name: "apply_manifest"
    command: "sbos_k8s_core apply -f ${SBOS_FICHA_DIR}/rabbitmq-search.k8s.yml -n sbos-search"
    timeout_seconds: 300
  - name: "wait_ready"
    command: "kubectl wait --for=condition=Ready pod/rabbitmq-search-0 -n sbos-search --timeout=600s"
    timeout_seconds: 600

post_install:
  - name: "verify"
    command: "echo 'verify_ok'"
    timeout_seconds: 30

update:
  - name: "rolling_restart"
    command: "kubectl rollout restart statefulset rabbitmq-search -n sbos-search"
    timeout_seconds: 300

repair:
  - name: "restart"
    command: "kubectl rollout restart statefulset rabbitmq-search -n sbos-search"
    timeout_seconds: 120

uninstall:
  - name: "delete_manifest"
    command: "kubectl delete statefulset rabbitmq-search -n sbos-search --ignore-not-found"
    timeout_seconds: 120
  - name: "delete_pvc"
    command: "kubectl delete pvc rabbitmq-search-data -n sbos-search --ignore-not-found"
    timeout_seconds: 60
