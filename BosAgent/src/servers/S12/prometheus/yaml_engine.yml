# yaml_engine.yml — Prometheus 3.5 lifecycle phases
# SBOS-049 §4.4 · Order 200 · StatefulSet
# R16 Zero hardcoding

pre_install:
  - name: "validate_pvc"
    command: "kubectl get pvc prometheus-data -n sbos-monitor --no-headers 2>/dev/null || echo 'PVC_OK'"
    timeout_seconds: 30
  - name: "create_namespace"
    command: "kubectl create namespace sbos-monitor --dry-run=client -o yaml | kubectl apply -f -"
    timeout_seconds: 30
  - name: "apply_network_policy"
    command: "sbos_k8s_core apply -f ${SBOS_FICHA_DIR}/prometheus.network -n sbos-monitor"
    timeout_seconds: 30

install:
  - name: "apply_statefulset"
    command: "sbos_k8s_core apply -f ${SBOS_FICHA_DIR}/prometheus.k8s.yml -n sbos-monitor"
    timeout_seconds: 300
  - name: "wait_ready"
    command: "kubectl wait --for=condition=Ready pod/prometheus-0 -n sbos-monitor --timeout=600s"
    timeout_seconds: 600
  - name: "verify_healthy"
    command: "kubectl exec prometheus-0 -n sbos-monitor -- wget -q -O- http://localhost:9090/-/healthy"
    timeout_seconds: 30

post_install:
  - name: "verify_targets"
    command: "kubectl exec prometheus-0 -n sbos-monitor -- wget -q -O- http://localhost:9090/api/v1/targets | grep -q 'health' || true"
    timeout_seconds: 30
  - name: "verify_rules_loaded"
    command: "kubectl exec prometheus-0 -n sbos-monitor -- wget -q -O- http://localhost:9090/api/v1/rules | grep -q 'groups' || true"
    timeout_seconds: 30

update:
  - name: "rolling_restart"
    command: "kubectl rollout restart statefulset prometheus -n sbos-monitor"
    timeout_seconds: 300

repair:
  - name: "restart_statefulset"
    command: "kubectl rollout restart statefulset prometheus -n sbos-monitor"
    timeout_seconds: 120

uninstall:
  - name: "delete_statefulset"
    command: "kubectl delete statefulset prometheus -n sbos-monitor --ignore-not-found"
    timeout_seconds: 120
  - name: "delete_pvc"
    command: "kubectl delete pvc prometheus-data -n sbos-monitor --ignore-not-found"
    timeout_seconds: 60
