---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ollama-sa
  namespace: sbos-ai
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: sbos-ai
spec:
  clusterIP: None
  selector:
    app: ollama
  ports:
    - name: http
      port: 11434
      targetPort: 11434
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ollama
  namespace: sbos-ai
spec:
  serviceName: ollama
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      serviceAccountName: ollama-sa
      containers:
        - name: ollama
          image: docker.io/ollama/ollama:0.5
          ports:
            - containerPort: 11434
              name: http

          volumeMounts:
            - name: data
              mountPath: /var/lib/ollama
          resources:
            requests:
              cpu: 50m
              memory: "32Mi"
            limits:
              cpu: 8000m
              memory: 16Gi
          livenessProbe:
            tcpSocket:
              port: 11434
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: 11434
            initialDelaySeconds: 10
            periodSeconds: 10

  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: sbos-local-path
        resources:
          requests:
            storage: 200Gi
