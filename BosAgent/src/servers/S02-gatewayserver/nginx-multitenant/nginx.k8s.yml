---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nginx-sa
  namespace: sbos-web
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: sbos-web
  labels:
    app: nginx
    sbos-ficha: nginx-multitenant
spec:
  type: NodePort
  selector:
    app: nginx
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30080
    - name: https
      port: 443
      targetPort: 443
      nodePort: 30443
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: sbos-web
  labels:
    app: nginx
    sbos-ficha: nginx-multitenant
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
        sbos-ficha: nginx-multitenant
    spec:
      serviceAccountName: nginx-sa
      containers:
        - name: nginx
          image: docker.io/library/nginx:1.26
          ports:
            - containerPort: 80
              name: http
            - containerPort: 443
              name: https
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: nginx-base-config
              mountPath: /etc/nginx/conf.d/healthz.conf
              subPath: healthz.conf
              readOnly: true
            - name: nginx-vhosts
              mountPath: /etc/nginx/conf.d/vhosts
              readOnly: false
            - name: certbot-certs
              mountPath: /etc/letsencrypt
              readOnly: true
      volumes:
        - name: nginx-base-config
          configMap:
            name: nginx-base-config
            items:
              - key: healthz.conf
                path: healthz.conf
        - name: nginx-vhosts
          emptyDir: {}
        - name: certbot-certs
          hostPath:
            path: /etc/letsencrypt
            type: DirectoryOrCreate
