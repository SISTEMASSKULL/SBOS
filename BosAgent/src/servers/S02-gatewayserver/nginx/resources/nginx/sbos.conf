# NGINX Virtual Host — SKULL Operator
# Fuente: SBOS-INSTALACION-FORMULARIO.md §2
# Dominio: sksistemas.com

server {
    listen 80;
    server_name sksistemas.com *.sksistemas.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name sksistemas.com *.sksistemas.com;

    ssl_certificate     /etc/letsencrypt/live/sksistemas.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sksistemas.com/privkey.pem;
    ssl_protocols TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # OIDC auth via OAuth2-Proxy (DEC-I03, Keycloak)
    location / {
        proxy_pass http://oauth2-proxy.sbos-identity:4180;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
