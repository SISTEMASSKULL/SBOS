# Kong 3.9 declarative configuration (dbless optional)
# SBOS-019 §9 · Order 145 · Deployment
# services, routes, and plugins for the SBOS platform

_format_version: "3.0"

services:
  - name: keycloak
    url: http://keycloak.sbos-identity:9000
    routes:
      - name: auth-route
        paths:
          - /auth
        strip_path: false

  - name: grafana
    url: http://grafana.sbos-monitor:3000
    routes:
      - name: status-route
        paths:
          - /status
        strip_path: false

plugins:
  - name: oidc
    service: keycloak
    config:
      client_id: kong
      client_secret: "${KONG_OIDC_CLIENT_SECRET}"
      discovery: http://keycloak.sbos-identity:9000/realms/skbos/.well-known/openid-configuration
      introspection_endpoint: http://keycloak.sbos-identity:9000/realms/skbos/protocol/openid-connect/token/introspect
      bearer_only: "no"
      realm: skbos
      redirect_uri_path: /auth/callback

  - name: cors
    config:
      origins:
        - "*"
      methods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Authorization
        - Content-Type
        - Origin
      exposed_headers:
        - X-Auth-Token
      max_age: 3600
      credentials: true

  - name: rate-limiting
    config:
      second: 100
      minute: 1000
      hour: 10000
      policy: local
      fault_tolerant: true
      hide_client_headers: false
