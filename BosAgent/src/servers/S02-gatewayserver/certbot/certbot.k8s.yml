---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: certbot-sa
  namespace: sbos-gateway
---
apiVersion: v1
kind: Service
metadata:
  name: certbot
  namespace: sbos-gateway
spec:
  type: ClusterIP
  selector:
    app: certbot
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: certbot
  namespace: sbos-gateway
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: certbot
  template:
    metadata:
      labels:
        app: certbot
    spec:
      serviceAccountName: certbot-sa
      containers:
        - name: certbot
          image: docker.io/certbot/certbot:v5.6.0
          command:
            - sleep
            - infinity
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            exec:
              command:
                - certbot
                - --version
            initialDelaySeconds: 30
            periodSeconds: 60
            timeoutSeconds: 10
          readinessProbe:
            exec:
              command:
                - certbot
                - --version
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 10
