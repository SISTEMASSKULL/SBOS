---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dovecot-sa
  namespace: sbos-comms
---
apiVersion: v1
kind: Service
metadata:
  name: dovecot
  namespace: sbos-comms
spec:
  clusterIP: None
  selector:
    app: dovecot
  ports:
    - name: http
      port: 143
      targetPort: 143
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: dovecot
  namespace: sbos-comms
spec:
  serviceName: dovecot
  replicas: 1
  selector:
    matchLabels:
      app: dovecot
  template:
    metadata:
      labels:
        app: dovecot
    spec:
      serviceAccountName: dovecot-sa
      containers:
        - name: dovecot
          image: docker.io/dovecot/dovecot:latest
          ports:
            - containerPort: 143
              name: http

          volumeMounts:
            - name: data
              mountPath: /var/lib/dovecot
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            tcpSocket:
                port: 143
            initialDelaySeconds: 120
            periodSeconds: 30
            failureThreshold: 5
          readinessProbe:
            tcpSocket:
                port: 143
            initialDelaySeconds: 90
            periodSeconds: 15
            failureThreshold: 5

  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: sbos-local-path
        resources:
          requests:
            storage: 50Gi
