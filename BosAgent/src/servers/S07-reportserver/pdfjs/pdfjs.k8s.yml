---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pdfjs-sa
  namespace: sbos-apps
---
apiVersion: v1
kind: Service
metadata:
  name: pdfjs
  namespace: sbos-apps
spec:
  type: ClusterIP
  selector:
    app: pdfjs
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pdfjs
  namespace: sbos-apps
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: pdfjs
  template:
    metadata:
      labels:
        app: pdfjs
    spec:
      serviceAccountName: pdfjs-sa
      containers:
        - name: pdfjs
          image: docker.io/nginx:alpine
          ports:
            - containerPort: 80
              name: http

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10


