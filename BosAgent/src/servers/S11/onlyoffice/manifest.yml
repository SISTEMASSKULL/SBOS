# manifest.yml — Ficha onlyoffice (SBOS-005 §vdiserver)
# SBOS-049 §4 · Order 360 · StatefulSet
identity:
  id: onlyoffice
  name: OnlyOffice Docs
  version: "8.2"
  category: 1
  criticality: false
  server: vdiserver
  description: "Collaborative office suite"

workload:
  type: StatefulSet
  namespace: sbos-vdi
  replicas: 1
  service_account: onlyoffice-sa

order:
  execution_order: 360
  timeout_minutes: 20

requirements:
  dependencies:
    - postgresql
    - keycloak
  cpu_request: "500m"
  cpu_limit: "2000m"
  memory_request: "1Gi"
  memory_limit: "2Gi"
pvc_size: "50Gi"
  pvc_storage_class: "sbos-fast"

deployment:
  strategy: Recreate

governance:


health:
  check_command: "curl -sf http://localhost:80/healthcheck"
  check_interval_seconds: 30
  check_timeout_seconds: 10
  consecutive_failures_threshold: 3

