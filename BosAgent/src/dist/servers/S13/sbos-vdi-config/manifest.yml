identity:
  id: sbos-vdi-config
  server: S13
  version: 1.0.0
  category: 1
  criticality: false
  description: "VDI Config — configura rutas Kong, realm Keycloak y NetworkPolicies para el producto VDI (nextcloud + onlyoffice + guacamole + fedora-kde)."

workload:
  type: bash
  runtime: bash

order:
  execution_order: 420

requirements:
  dependencies:
    - nextcloud
    - onlyoffice
    - guacamole
    - keycloak
    - kong

governance:
  auto_install: false
  requires_approval: false
  category_label: "configuracion-vdi"

meta:
  backend: bash
  idempotent: true
  estimated_minutes: 5
  rollback_support: true

ports: []

health:
  type: command
  command: "kubectl --kubeconfig=/etc/bos/.kube/config get configmap sbos-vdi-configured -n sbos-vdi --no-headers 2>/dev/null | wc -l"
  expected_output: "1"
  timeout_seconds: 10

audit:
  ctx_id_required: true
  log_path: /var/log/bos/fichas/sbos-vdi-config.log
