<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>SBOS VDI — Iniciando escritorio</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(135deg, #0a0e27 0%, #1a1040 50%, #0a0e27 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #e0e0e0;
    overflow: hidden;
  }

  /* Partículas de fondo (puntos decorativos) */
  .bg-dots {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image:
      radial-gradient(circle, #00d4aa18 1px, transparent 1px);
    background-size: 48px 48px;
    animation: drift 30s linear infinite;
  }
  @keyframes drift {
    from { background-position: 0 0; }
    to   { background-position: 48px 48px; }
  }

  /* Tarjeta central */
  .card {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 3rem 4rem 2.5rem;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(0,212,170,0.18);
    border-radius: 1.8rem;
    max-width: 460px;
    width: 90%;
    animation: card-in 0.5s cubic-bezier(0.22,1,0.36,1) both;
  }
  @keyframes card-in {
    from { opacity: 0; transform: translateY(24px) scale(0.97); }
    to   { opacity: 1; transform: translateY(0)    scale(1);    }
  }

  .logo-icon {
    font-size: 4.2rem;
    display: block;
    margin-bottom: 0.4rem;
    animation: float 4s ease-in-out infinite;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50%       { transform: translateY(-6px); }
  }

  h1 {
    font-size: 2.8rem;
    font-weight: 800;
    color: #00d4aa;
    letter-spacing: 0.45rem;
    margin-bottom: 0.2rem;
  }

  .tagline {
    font-size: 0.85rem;
    color: #8892b0;
    letter-spacing: 0.08rem;
    margin-bottom: 2.8rem;
  }

  /* Anillo giratorio */
  .spinner-wrap {
    position: relative;
    width: 72px;
    height: 72px;
    margin: 0 auto 1.6rem;
  }
  .ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 3px solid transparent;
  }
  .ring-outer {
    border-top-color: #00d4aa;
    border-right-color: #00d4aa44;
    animation: spin 1.1s linear infinite;
  }
  .ring-inner {
    inset: 10px;
    border-bottom-color: #00d4aa88;
    animation: spin 0.75s linear infinite reverse;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Icono central en el spinner */
  .spinner-icon {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.4rem;
  }

  /* Texto de estado con animación de steps */
  .status-text {
    font-size: 0.92rem;
    color: #ccd6f6;
    margin-bottom: 1.6rem;
    min-height: 1.4em;
  }
  .status-text span {
    color: #00d4aa;
    font-weight: 600;
  }

  /* Barra de progreso */
  .progress-bar {
    height: 3px;
    background: rgba(0,212,170,0.12);
    border-radius: 99px;
    overflow: hidden;
    margin-bottom: 2rem;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #00d4aa, #00ffcc);
    border-radius: 99px;
    width: 0%;
    animation: progress 1.2s cubic-bezier(0.4,0,0.2,1) forwards;
  }
  @keyframes progress {
    0%   { width: 0%; }
    30%  { width: 45%; }
    70%  { width: 75%; }
    100% { width: 100%; }
  }

  /* Chips de info */
  .chips {
    display: flex;
    justify-content: center;
    gap: 0.5rem;
    flex-wrap: wrap;
  }
  .chip {
    font-size: 0.72rem;
    color: #8892b0;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.07);
    padding: 0.25rem 0.75rem;
    border-radius: 99px;
    display: flex;
    align-items: center;
    gap: 0.3rem;
  }
  .chip-dot {
    width: 5px;
    height: 5px;
    background: #00d4aa;
    border-radius: 50%;
    animation: pulse-dot 2s ease-in-out infinite;
  }
  @keyframes pulse-dot {
    0%, 100% { opacity: 0.4; }
    50%       { opacity: 1; }
  }
</style>
<script>
(function () {
  var steps = [
    "Verificando <span>sesión segura</span>...",
    "Preparando <span>escritorio corporativo</span>...",
    "Estableciendo <span>conexión cifrada</span>..."
  ];
  var idx = 0;

  window.onload = function () {
    var el = document.getElementById("status-msg");

    // Ciclar mensajes cada 400 ms
    el.innerHTML = steps[0];
    var interval = setInterval(function () {
      idx = (idx + 1) % steps.length;
      el.style.opacity = "0";
      setTimeout(function () {
        el.innerHTML = steps[idx];
        el.style.opacity = "1";
      }, 150);
    }, 450);

    // Redirigir al completar la barra de progreso (~1.25 s)
    setTimeout(function () {
      clearInterval(interval);
      var p = new URLSearchParams(window.location.search);
      if (!p.has("quality"))     p.set("quality",     "4");
      if (!p.has("compression")) p.set("compression", "6");
      if (!p.has("resize"))      p.set("resize",      "scale");
      if (!p.has("autoconnect")) p.set("autoconnect", "1");
      if (!p.has("path"))        p.set("path",        "desktop/websockify");
      window.location.replace("vnc.html?" + p.toString());
    }, 1300);
  };
}());
</script>
</head>
<body>
  <div class="bg-dots"></div>

  <div class="card">
    <span class="logo-icon">🏛️</span>
    <h1>SBOS</h1>
    <p class="tagline">Sistema Operativo Empresarial Soberano</p>

    <div class="spinner-wrap">
      <div class="ring ring-outer"></div>
      <div class="ring ring-inner"></div>
      <div class="spinner-icon">🖥️</div>
    </div>

    <p class="status-text" id="status-msg"
       style="transition: opacity 0.15s ease;">
      Verificando <span>sesión segura</span>...
    </p>

    <div class="progress-bar">
      <div class="progress-fill"></div>
    </div>

    <div class="chips">
      <div class="chip"><span class="chip-dot"></span>Sesión cifrada TLS</div>
      <div class="chip"><span class="chip-dot"></span>Acceso autenticado</div>
      <div class="chip"><span class="chip-dot"></span>SBOS VDI</div>
    </div>
  </div>
</body>
</html>
