identity:
  id: "onlyoffice"
  name: "OnlyOffice Document Server"
  version: "8.2.2"
  server: "S13"
  namespace: "sbos-vdi"
  category: 2
  criticality: true

workload:
  type: "kubernetes"
  state: "prod"

order:
  execution_order: 220

parameters:
  ONLYOFFICE_JWT_ENABLED: "true"
  ONLYOFFICE_HOSTNAME: "onlyoffice.sbos.local"

requirements:
  ram_mb: 2048
  cpu_cores: 2
  disk_gb: 20
  dependencies:
    - postgresql
    - redis
    - kong

deployment:
  namespace: "sbos-vdi"
  workload_type: "Deployment"
  k8s_manifest: "onlyoffice.k8s.yml"

governance:
  # Depende de fedora-kde (escritorio VDI) que tiene auto_install:false.
  # OnlyOffice no aporta valor fuera del entorno de escritorio corporativo.
  auto_install: false
  requires_approval: false
  category_label: "ofimatica"

health:
  # BUG-47: OnlyOffice tarda 2-3 min en que /healthcheck responda tras Running.
  # timeout_seconds:30 insuficiente — el framework falla antes de que arranquen
  # los servicios internos (PostgreSQL, RabbitMQ). ficha_health() verifica readyReplicas.
  type: none

compatibility:
  min_iam_installer_version: "1.0.0"
