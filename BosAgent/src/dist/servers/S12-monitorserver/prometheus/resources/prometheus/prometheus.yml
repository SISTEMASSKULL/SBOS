# Prometheus — Observabilidad-SBOS · SKULL Operator
# Scrape configs + SLO recording rules
# Stack: S12 monitorserver · Retención 90d · Scrape interval 30s
# Fuente: SBOS-INSTALACION-FORMULARIO.md §11

global:
  scrape_interval: 30s
  scrape_timeout: 10s
  evaluation_interval: 30s
  external_labels:
    cluster: sbos
    environment: production
    operator: sksistemas
    domain: sksistemas.com

rule_files:
  - /etc/prometheus/rules/slos.yml
  - /etc/prometheus/rules/alerts.yml

# ─────────────────────────────────────────────
# Scrape: daemons soberanos con /metrics nativo
# ─────────────────────────────────────────────

scrape_configs:
  - job_name: bkernel
    scrape_interval: 15s
    static_configs:
      - targets:
          - localhost:9100
        labels:
          daemon: bkernel
          component: core
          tier: sovereign

  - job_name: biedata
    scrape_interval: 15s
    static_configs:
      - targets:
          - localhost:9101
        labels:
          daemon: biedata
          component: core
          tier: sovereign

  - job_name: bhnexus
    scrape_interval: 30s
    metrics_path: /metrics
    static_configs:
      - targets:
          - localhost:9445
        labels:
          daemon: bhnexus
          component: connectivity
          tier: sovereign

  # ─────────────────────────────────────────
  # Scrape: agentes de dominio con health HTTP
  # ─────────────────────────────────────────

  - job_name: bos-agent
    scrape_interval: 30s
    metrics_path: /health
    static_configs:
      - targets:
          - localhost:9443
        labels:
          daemon: bos
          component: guardian
          tier: sovereign

  - job_name: bauth-agent
    scrape_interval: 30s
    metrics_path: /health
    static_configs:
      - targets:
          - localhost:8070
        labels:
          daemon: bauth
          component: identity
          tier: sovereign

  - job_name: bintelligence-agent
    scrape_interval: 30s
    metrics_path: /health
    static_configs:
      - targets:
          - localhost:8080
        labels:
          daemon: bintelligence
          component: analytics
          tier: sovereign

  # ─────────────────────────────────────────
  # Scrape: infraestructura de datos
  # ─────────────────────────────────────────

  - job_name: postgresql
    scrape_interval: 30s
    static_configs:
      - targets:
          - localhost:9187
        labels:
          component: database
          tier: infrastructure
          criticality: p0

  - job_name: redis
    scrape_interval: 30s
    static_configs:
      - targets:
          - localhost:9121
        labels:
          component: cache
          tier: infrastructure
          criticality: p1

  # ─────────────────────────────────────────
  # Scrape: Keycloak (identityserver S03)
  # ─────────────────────────────────────────

  - job_name: keycloak
    scrape_interval: 30s
    metrics_path: /metrics
    static_configs:
      - targets:
          - localhost:8080
        labels:
          component: identity
          tier: platform
          criticality: p0

  # ─────────────────────────────────────────
  # Scrape: Prometheus self
  # ─────────────────────────────────────────

  - job_name: prometheus
    scrape_interval: 30s
    static_configs:
      - targets:
          - localhost:9090
        labels:
          component: observability
