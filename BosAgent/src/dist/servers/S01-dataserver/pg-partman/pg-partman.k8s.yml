---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pg-partman-sa
  namespace: sbos-data
---
# pg_partman es una extensión instalada en el PostgreSQL SBOS.
# Este CronJob ejecuta el mantenimiento de particiones cada hora.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pg-partman
  namespace: sbos-data
spec:
  schedule: "0 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: pg-partman-sa
          restartPolicy: OnFailure
          containers:
            - name: pg-partman
              image: docker.io/library/postgres:18
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: postgresql-secret
                      key: password
              command:
                - /bin/sh
                - -c
                - |
                  psql -h postgresql.sbos-data.svc.cluster.local \
                       -U postgres -d SBOSDB \
                       -c "DO \$\$ BEGIN
                             IF EXISTS (SELECT 1 FROM pg_available_extensions WHERE name='pg_partman')
                                AND EXISTS (SELECT 1 FROM information_schema.schemata WHERE schema_name='partman') THEN
                               PERFORM partman.run_maintenance_proc();
                               RAISE NOTICE 'pg_partman: mantenimiento ejecutado';
                             ELSE
                               RAISE NOTICE 'pg_partman no disponible en este servidor, omitido';
                             END IF;
                           END \$\$;" || true
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
