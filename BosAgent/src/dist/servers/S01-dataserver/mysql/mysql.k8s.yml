---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mysql-sa
  namespace: sbos-data
---
apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  namespace: sbos-data
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: "SbosMySQL2024!"
  MYSQL_DATABASE: "sbos_mysql"
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: sbos-data
spec:
  clusterIP: None
  selector:
    app: mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: sbos-data
spec:
  serviceName: mysql
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      serviceAccountName: mysql-sa
      containers:
        - name: mysql
          image: docker.io/library/mysql:8.4
          ports:
            - containerPort: 3306
              name: mysql
          envFrom:
            - secretRef:
                name: mysql-secret
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
          resources:
            requests:
              cpu: 50m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            tcpSocket:
              port: 3306
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: 3306
            initialDelaySeconds: 10
            periodSeconds: 10

  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: sbos-local-path
        resources:
          requests:
            storage: 20Gi
