identity:
  id: paperless-ngx
  server: S08
  version: "2.14.7"
  category: 2
  criticality: false
  description: "Paperless-NGX 2.14.7 — gestor documental con OCR automático, indexado full-text, etiquetado inteligente, reglas de clasificación y archivo soberano de documentos."

workload:
  type: deployment
  runtime: kubernetes
  namespace: sbos-docs
  replicas: 1

order:
  execution_order: 350

requirements:
  dependencies:
    - postgresql
    - redis
    - minio
    - keycloak

governance:
  auto_install: true
  requires_approval: false
  category_label: "gestion-documental"

meta:
  backend: k8s
  idempotent: true
  estimated_minutes: 10
  rollback_support: true

ports:
  - name: http
    port: 8000
    protocol: TCP
    internal_only: false

health:
  type: command
  command: "kubectl --kubeconfig=/etc/bos/.kube/config get deployment paperless-ngx -n sbos-docs -o jsonpath='{.status.readyReplicas}' 2>/dev/null"
  expected_output: "1"
  timeout_seconds: 30

audit:
  ctx_id_required: true
  log_path: /var/log/bos/fichas/paperless-ngx.log

vault:
  secret_path: "secret/tenants/{{ tenant_id }}/paperless-ngx"
  keys:
    - secret_key
    - admin_password

versions:
  paperless_ngx: "2.14.7"
