identity:
  id: embedding-worker
  server: S15
  version: "1.0.0"
  category: 3
  criticality: false
  description: "Embedding Worker 1.0.0 — servicio SBOS que genera embeddings de documentos y los indexa en Qdrant. Procesamiento batch de Paperless-NGX, Kimios y documentos del ERP para búsqueda semántica."

workload:
  type: deployment
  runtime: kubernetes
  namespace: sbos-ai
  replicas: 1

order:
  execution_order: 515

requirements:
  dependencies:
    - ollama
    - qdrant
    - paperless-ngx

governance:
  auto_install: true
  requires_approval: false
  category_label: "ia-soberana"

meta:
  backend: k8s
  idempotent: true
  estimated_minutes: 5
  rollback_support: true

ports:
  - name: http
    port: 8090
    protocol: TCP
    internal_only: true

health:
  type: command
  command: "kubectl --kubeconfig=/etc/bos/.kube/config get deployment embedding-worker -n sbos-ai -o jsonpath='{.status.readyReplicas}' 2>/dev/null"
  expected_output: "1"
  timeout_seconds: 30

audit:
  ctx_id_required: true
  log_path: /var/log/bos/fichas/embedding-worker.log

versions:
  embedding_worker: "1.0.0"
