identity:
  id: open-webui
  server: S15
  version: "0.5.20"
  category: 3
  criticality: false
  description: "Open WebUI 0.5.20 — interfaz web para Ollama (y APIs OpenAI). Chat con modelos locales, RAG con documentos, gestión de modelos, historial de conversaciones."

workload:
  type: deployment
  runtime: kubernetes
  namespace: sbos-ai
  replicas: 1

order:
  execution_order: 510

requirements:
  dependencies:
    - ollama
    - qdrant
    - keycloak
  memory_request: "512Mi"

governance:
  auto_install: true
  requires_approval: false
  category_label: "ia-soberana"

meta:
  backend: k8s
  idempotent: true
  estimated_minutes: 5
  rollback_support: true

ports:
  - name: http
    port: 8080
    protocol: TCP
    internal_only: false

health:
  type: command
  command: "kubectl --kubeconfig=/etc/bos/.kube/config get deployment open-webui -n sbos-ai -o jsonpath='{.status.readyReplicas}' 2>/dev/null"
  expected_output: "1"
  timeout_seconds: 30

audit:
  ctx_id_required: true
  log_path: /var/log/bos/fichas/open-webui.log

vault:
  secret_path: "secret/tenants/{{ tenant_id }}/open-webui"
  keys:
    - secret_key
    - webui_secret_key

versions:
  open_webui: "0.5.20"
