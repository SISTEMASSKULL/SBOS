# manifest.yml — Ficha orangehrm (SBOS-005 §appsserver)
# SBOS-049 §4 · Order 225 · Deployment
identity:
  id: orangehrm
  version: "6.0"
  category: 1
  criticality: false
  server: S06
  description: "HR: payroll, attendance"

workload:
  type: Deployment

order:
  execution_order: 225

requirements:
  dependencies:
    - mysql
    - keycloak


deployment:
  strategy: RollingUpdate

governance:
  auto_install: false
  requires_approval: false

health:
  command: "curl -sf http://localhost:8080/health"
  interval_seconds: 30
  timeout_seconds: 10


license: MIT

meta:
  backend: kubernetes
  idempotent: true
  estimated_minutes: 5
  rollback_support: false
