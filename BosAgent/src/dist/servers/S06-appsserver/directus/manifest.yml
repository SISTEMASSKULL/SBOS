# manifest.yml — Ficha directus (SBOS-005 §appsserver)
# SBOS-049 §4 · Order 210 · Deployment
identity:
  id: directus
  version: "11.3"
  category: 1
  criticality: false
  server: S06
  description: "Headless CMS with auto-generated API"

workload:
  type: Deployment

order:
  execution_order: 210

requirements:
  dependencies:
    - postgresql
    - keycloak

deployment:
  strategy: Recreate

governance:


  auto_install: true
  requires_approval: false
health:
  command: "curl -sf http://localhost:8055/server/health"
  interval_seconds: 30
  timeout_seconds: 10


license: MIT

meta:
  backend: kubernetes
  idempotent: true
  estimated_minutes: 5
  rollback_support: false
