# manifest.yml — Ficha clamav (SBOS-005 §commsserver)
# SBOS-049 §4 · Order 335 · Deployment
identity:
  id: clamav
  version: "1.3"
  category: 1
  criticality: true
  server: S10
  description: "Antivirus for email attachments"

workload:
  type: Deployment

order:
  execution_order: 335

requirements:
  dependencies:
    - postfix
    - spamassassin


deployment:
  strategy: RollingUpdate

governance:


  auto_install: true
  requires_approval: false
health:
  command: "clamscan --version"
  interval_seconds: 30
  timeout_seconds: 10


meta:
  backend: kubernetes
  idempotent: true
  estimated_minutes: 5
  rollback_support: false
