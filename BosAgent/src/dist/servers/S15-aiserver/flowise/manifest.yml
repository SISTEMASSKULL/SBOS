# manifest.yml — Ficha flowise (SBOS-005 §aiserver)
# SBOS-049 §4 · Order 428 · Deployment
identity:
  id: flowise
  version: "2.1"
  category: 1
  criticality: false
  server: S15
  description: "Visual AI agent builder, low-code"

workload:
  type: Deployment

order:
  execution_order: 428

requirements:
  dependencies:
    - postgresql
    - keycloak


deployment:
  strategy: RollingUpdate

governance:


  auto_install: true
  requires_approval: false
health:
  command: "curl -sf http://localhost:3000/health"
  interval_seconds: 30
  timeout_seconds: 10


meta:
  backend: kubernetes
  idempotent: true
  estimated_minutes: 5
  rollback_support: false
