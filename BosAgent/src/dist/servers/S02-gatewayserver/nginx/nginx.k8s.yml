---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nginx-sa
  namespace: sbos-gateway
  labels:
    app: nginx
    sbos-ficha: nginx
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-default-conf
  namespace: sbos-gateway
  labels:
    app: nginx
    sbos-ficha: nginx
data:
  default.conf: |
    server {
        listen 80 default_server;
        server_name _;

        location /health {
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        location / {
            return 200 "SBOS Gateway\n";
            add_header Content-Type text/plain;
        }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: sbos-gateway
  labels:
    app: nginx
    sbos-ficha: nginx
spec:
  type: ClusterIP
  selector:
    app: nginx
  ports:
    # HTTP/HTTPS
    - name: http
      port: 80
      targetPort: 80
    - name: https
      port: 443
      targetPort: 443
    # Correo (Exim/Dovecot via nginx reverse proxy)
    - name: smtp
      port: 25
      targetPort: 25
    - name: smtps
      port: 465
      targetPort: 465
    - name: submission
      port: 587
      targetPort: 587
    - name: imap
      port: 143
      targetPort: 143
    - name: imaps
      port: 993
      targetPort: 993
    - name: pop3s
      port: 995
      targetPort: 995
    - name: sieve
      port: 4190
      targetPort: 4190
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: sbos-gateway
  labels:
    app: nginx
    sbos-ficha: nginx
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
        sbos-ficha: nginx
    spec:
      serviceAccountName: nginx-sa
      containers:
        - name: nginx
          image: docker.io/library/nginx:1.26
          ports:
            - containerPort: 80
              name: http
            - containerPort: 443
              name: https
            - containerPort: 25
              name: smtp
            - containerPort: 465
              name: smtps
            - containerPort: 587
              name: submission
            - containerPort: 143
              name: imap
            - containerPort: 993
              name: imaps
            - containerPort: 995
              name: pop3s
            - containerPort: 4190
              name: sieve
          resources:
            requests:
              cpu: 50m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 1024Mi
          livenessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: nginx-default-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: nginx-sites
              mountPath: /etc/nginx/conf.d/sites-enabled
              readOnly: false
            - name: certbot-certs
              mountPath: /etc/letsencrypt
              readOnly: true
      volumes:
        - name: nginx-default-conf
          configMap:
            name: nginx-default-conf
        - name: nginx-sites
          emptyDir: {}
        - name: certbot-certs
          hostPath:
            path: /etc/letsencrypt
            type: DirectoryOrCreate
