# ============================================================================
# 00_ARCHITECTURE_SBOS.yml — Global Declarative Registry
# Project: SBOS — Sovereign Business Operating System
# Agent: bos-agent (order 5, P1)
#
# This file is the SINGLE SOURCE OF TRUTH for:
#   - SBOS principles (P1-P14) and their enforcement
#   - Task → bash function dispatch mapping
#   - Lifecycle phase definitions for install/update/repair/remove
#   - Ficha registry with categories and dependencies
#   - Signal protocol constants
#
# Parsed by 00_YAML_ENGINE_SBOS.sh via yq.
# P3: NEVER names any concrete application — all entries are generic.
# ============================================================================

version: "1.0.0"

# ── SBOS Principles (P1-P14) ─────────────────────────────────────
# Each principle maps to a validation function in 00_TASK_CATALOG_SBOS.sh
principios:
  P1:
    nombre: "sbos_k8s_core único"
    descripcion: "sbos_k8s_core() is the ONLY kubectl apply in the system"
    activo: true
    enforce: "yaml_enforce_p1"
    violacion: "CRITICAL — cualquier otro kubectl apply es una violación de P1"

  P2:
    nombre: "pre_install ABORT"
    descripcion: "pre_install failure → ABORT immediately, no partial state"
    activo: true
    enforce: "check_pre_install_abort"
    violacion: "CRITICAL — continuar tras fallo de pre_install corrompe el estado"

  P3:
    nombre: "sin nombres de apps"
    descripcion: "NEVER names any concrete application in Core scripts"
    activo: true
    enforce: "check_no_concrete_names"
    violacion: "HIGH — nombrar apps concretas rompe la genericidad del Core"

  P4:
    nombre: "Core no crece"
    descripcion: "Core SP-01 is frozen — features go in servers/<ficha>/"
    activo: true
    enforce: "check_core_frozen"
    violacion: "MEDIUM — añadir funciones al Core sin decisión arquitectónica"

  P5:
    nombre: "pull-only releases"
    descripcion: "bos agent pulls releases, never receives pushes"
    activo: true
    enforce: "check_pull_only"
    violacion: "HIGH — permitir push externo es riesgo de seguridad"

  P6:
    nombre: "auto-rollback"
    descripcion: "Every saga has a compensation chain on failure"
    activo: true
    enforce: "check_compensation_chain"
    violacion: "HIGH — operación sin compensación deja estado inconsistente"

  P7:
    nombre: "Absorber/Ejecutar/Liberar"
    descripcion: "Absorb ficha task_catalog → Execute → Release functions"
    activo: true
    enforce: "check_absorb_execute_release"
    violacion: "MEDIUM — no liberar funciones causa polución cross-ficha"

  P8:
    nombre: "STATE_MANAGER único escritor"
    descripcion: "STATE_MANAGER is the sole writer of .sbos_state.json"
    activo: true
    enforce: "check_state_manager_sole"
    violacion: "CRITICAL — escritura concurrente corrompe el estado"

  P9:
    nombre: "idempotencia"
    descripcion: "install sobre ficha instalada = no-op con OK"
    activo: true
    enforce: "check_idempotency"
    violacion: "MEDIUM — re-ejecución no idempotente puede romper estado"

  P10:
    nombre: "--dry-run previo"
    descripcion: "Every kubectl apply is preceded by --dry-run validation"
    activo: true
    enforce: "check_dry_run_prior"
    violacion: "HIGH — aplicar sin dry-run puede romper el cluster"

  P11:
    nombre: "diagnosis_first"
    descripcion: "Repair MUST run diagnosis before acting (P14 alias)"
    activo: true
    enforce: "yaml_enforce_p14"
    violacion: "HIGH — reparar sin diagnosticar puede empeorar el estado"

  P12:
    nombre: "compensación"
    descripcion: "Saga pattern: cada paso tiene rollback definido"
    activo: true
    enforce: "check_saga_compensation"
    violacion: "MEDIUM — saga sin compensación definida"

  P13:
    nombre: "timeouts"
    descripcion: "Toda operación tiene timeout explícito"
    activo: true
    enforce: "check_timeouts"
    violacion: "LOW — operación sin timeout puede colgar el daemon"

  P14:
    nombre: "verificación post-op"
    descripcion: "Toda operación termina con verificación de health"
    activo: true
    enforce: "verify_ficha_health"
    violacion: "MEDIUM — no verificar tras operación deja estado invisible"

# ── Lifecycle Phase Definitions ──────────────────────────────────

lifecycle:
  # Install saga: 6 phases
  install:
    - validate
    - dependencies
    - pre_install
    - install
    - post_install
    - verify

  # Update saga: 4 phases
  update:
    - backup
    - validate
    - update
    - verify

  # Repair saga: 3 phases (P14 enforced by yaml_enforce_p14)
  repair:
    - diagnosis
    - repair
    - verify

  # Remove saga: 3 phases
  remove:
    - governance_check
    - dependents_check
    - uninstall

  # Compensation chains (reverse execution on failure)
  install_compensacion:
    - uninstall
    - cleanup

  update_compensacion:
    - restore_backup

  # Phase handler mapping
  phases:
    validate:
      name: "validate"
      handler: "validate"
      timeout_sec: 300
      exit_code: 1

    dependencies:
      name: "dependencies"
      handler: "dependencies"
      timeout_sec: 120
      exit_code: 1

    pre_install:
      name: "pre_install"
      handler: "pre_install"
      timeout_sec: 600
      exit_code: 2

    install:
      name: "install"
      handler: "install"
      timeout_sec: 1800
      exit_code: 3

    post_install:
      name: "post_install"
      handler: "post_install"
      timeout_sec: 300
      exit_code: 3

    verify:
      name: "verify"
      handler: "verify"
      timeout_sec: 120
      exit_code: 3

    backup:
      name: "backup"
      handler: "backup"
      timeout_sec: 600
      exit_code: 3

    update:
      name: "update"
      handler: "update"
      timeout_sec: 900
      exit_code: 3

    diagnosis:
      name: "diagnosis"
      handler: "diagnosis"
      timeout_sec: 300
      exit_code: 3

    repair:
      name: "repair"
      handler: "repair"
      timeout_sec: 1200
      exit_code: 3

    governance_check:
      name: "governance_check"
      handler: "governance"
      timeout_sec: 60
      exit_code: 4

    dependents_check:
      name: "dependents_check"
      handler: "dependents"
      timeout_sec: 60
      exit_code: 1

    uninstall:
      name: "uninstall"
      handler: "uninstall"
      timeout_sec: 600
      exit_code: 3

    cleanup:
      name: "cleanup"
      handler: "cleanup"
      timeout_sec: 120
      exit_code: 3

    restore_backup:
      name: "restore_backup"
      handler: "restore_backup"
      timeout_sec: 600
      exit_code: 3

# ── Ficha Registry ───────────────────────────────────────────────
# Category 1: Low governance — single approval, auto-installable
# Category 2: Medium governance — peer review required
# Category 3: High governance — dual approval required for uninstall

