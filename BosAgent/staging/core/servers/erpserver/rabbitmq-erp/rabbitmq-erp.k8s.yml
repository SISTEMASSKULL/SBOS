---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-erp
  namespace: sbos-erp
spec:
  clusterIP: None
  selector:
    app: rabbitmq-erp
  ports:
    - name: http
      port: 15672
      targetPort: 15672
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq-erp
  namespace: sbos-erp
spec:
  serviceName: rabbitmq-erp
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq-erp
  template:
    metadata:
      labels:
        app: rabbitmq-erp
    spec:
      serviceAccountName: rabbitmq-erp-sa
      containers:
        - name: rabbitmq-erp
          image: docker.io/library/rabbitmq:3.13-management
          ports:
            - containerPort: 15672
              name: http

          volumeMounts:
            - name: data
              mountPath: /var/lib/rabbitmq-erp
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 15672
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 15672
            initialDelaySeconds: 10
            periodSeconds: 10

  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: sbos-fast
        resources:
          requests:
            storage: 20Gi
