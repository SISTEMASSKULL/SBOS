# manifest.yml — Ficha sbos-bootstrap-platform (SBOS-005 §hostserver)
# SBOS-049 §4 · Order 10 · Deployment
identity:
  id: sbos-bootstrap-platform
  name: SBOS Bootstrap Platform
  version: "1.0"
  category: 1
  criticality: true
  server: hostserver
  description: "Namespaces, RBAC, StorageClasses, LimitRanges"

workload:
  type: Deployment
  namespace: sbos-installer
  replicas: 1
  service_account: sbos-bootstrap-platform-sa

order:
  execution_order: 10
  timeout_minutes: 30

requirements:
  dependencies:
    - sbos-bootstrap-k8s
  cpu_request: "100m"
  cpu_limit: "500m"
  memory_request: "128Mi"
  memory_limit: "256Mi"


deployment:
  strategy: Recreate

governance:
  auto_install: false


health:
  check_command: "kubectl get ns sbos-data"
  check_interval_seconds: 30
  check_timeout_seconds: 10
  consecutive_failures_threshold: 3

