---
apiVersion: v1
kind: Service
metadata:
  name: network-validator
  namespace: sbos-installer
spec:
  type: ClusterIP
  selector:
    app: network-validator
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: network-validator
  namespace: sbos-installer
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: network-validator
  template:
    metadata:
      labels:
        app: network-validator
    spec:
      serviceAccountName: network-validator-sa
      containers:
        - name: network-validator
          image: docker.io/library/busybox:1.36
          ports:
            - containerPort: 80
              name: http

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10


