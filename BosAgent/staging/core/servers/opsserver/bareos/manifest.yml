# manifest.yml — Ficha bareos (SBOS-005 §opsserver)
# SBOS-049 §4 · Order 390 · StatefulSet
identity:
  id: bareos
  name: Bareos Backup
  version: "23.0"
  category: 1
  criticality: true
  server: opsserver
  description: "Backup 16 servers, AES-256 encryption"

workload:
  type: StatefulSet
  namespace: sbos-ops
  replicas: 1
  service_account: bareos-sa

order:
  execution_order: 390
  timeout_minutes: 30

requirements:
  dependencies:
    - postgresql
    - minio
  cpu_request: "500m"
  cpu_limit: "2000m"
  memory_request: "512Mi"
  memory_limit: "1Gi"
pvc_size: "500Gi"
  pvc_storage_class: "sbos-fast"

deployment:
  strategy: Recreate

governance:
backup_enabled: true
  backup_schedule: "0 1 * * *"

health:
  check_command: "bareos-fd -t"
  check_interval_seconds: 30
  check_timeout_seconds: 10
  consecutive_failures_threshold: 3

