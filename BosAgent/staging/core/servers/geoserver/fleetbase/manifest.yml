# manifest.yml — Ficha fleetbase (SBOS-005 §geoserver)
# SBOS-049 §4 · Order 368 · Deployment
identity:
  id: fleetbase
  name: Fleetbase + FleetOps
  version: "0.4"
  category: 1
  criticality: false
  server: geoserver
  description: "Dispatch, drivers, fleet management"

workload:
  type: Deployment
  namespace: sbos-geo
  replicas: 1
  service_account: fleetbase-sa

order:
  execution_order: 368
  timeout_minutes: 15

requirements:
  dependencies:
    - postgresql
    - keycloak
  cpu_request: "200m"
  cpu_limit: "1000m"
  memory_request: "256Mi"
  memory_limit: "512Mi"


deployment:
  strategy: RollingUpdate

governance:


health:
  check_command: "curl -sf http://localhost:8080/health"
  check_interval_seconds: 30
  check_timeout_seconds: 10
  consecutive_failures_threshold: 3

