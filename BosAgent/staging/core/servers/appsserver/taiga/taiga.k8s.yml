---
apiVersion: v1
kind: Service
metadata:
  name: taiga
  namespace: sbos-apps
spec:
  type: ClusterIP
  selector:
    app: taiga
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: taiga
  namespace: sbos-apps
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: taiga
  template:
    metadata:
      labels:
        app: taiga
    spec:
      serviceAccountName: taiga-sa
      containers:
        - name: taiga
          image: docker.io/taigaio/taiga-back:6.7
          ports:
            - containerPort: 8000
              name: http

          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10


