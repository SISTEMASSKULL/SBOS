# manifest.yml — Ficha orangehrm (SBOS-005 §appsserver)
# SBOS-049 §4 · Order 225 · Deployment
identity:
  id: orangehrm
  name: OrangeHRM
  version: "6.0"
  category: 1
  criticality: false
  server: appsserver
  description: "HR: payroll, attendance"

workload:
  type: Deployment
  namespace: sbos-apps
  replicas: 1
  service_account: orangehrm-sa

order:
  execution_order: 225
  timeout_minutes: 15

requirements:
  dependencies:
    - mysql
    - keycloak
  cpu_request: "200m"
  cpu_limit: "1000m"
  memory_request: "512Mi"
  memory_limit: "1Gi"


deployment:
  strategy: RollingUpdate

governance:
backup_enabled: true
  backup_schedule: "0 3 * * *"

health:
  check_command: "curl -sf http://localhost:8080/health"
  check_interval_seconds: 30
  check_timeout_seconds: 10
  consecutive_failures_threshold: 3

