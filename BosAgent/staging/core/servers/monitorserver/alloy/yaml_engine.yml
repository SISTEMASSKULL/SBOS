# yaml_engine.yml — Grafana Alloy 1.7 lifecycle phases
# SBOS-049 §4.4 · Order 215 · DaemonSet
# Degraded mode: tolerates missing Loki
# R16 Zero hardcoding

pre_install:
  - name: "create_namespace"
    command: "kubectl create namespace sbos-monitor --dry-run=client -o yaml | kubectl apply -f -"
    timeout_seconds: 30
  - name: "apply_network_policy"
    command: "sbos_k8s_core apply -f ${SBOS_FICHA_DIR}/alloy.network -n sbos-monitor"
    timeout_seconds: 30

install:
  - name: "apply_daemonset"
    command: "sbos_k8s_core apply -f ${SBOS_FICHA_DIR}/alloy.k8s.yml -n sbos-monitor"
    timeout_seconds: 300
  - name: "wait_ready"
    command: "kubectl wait --for=condition=Ready daemonset/alloy -n sbos-monitor --timeout=300s"
    timeout_seconds: 300

post_install:
  - name: "verify_pods_running"
    command: "kubectl get pods -n sbos-monitor -l app=alloy --no-headers | grep -q Running || true"
    timeout_seconds: 30

update:
  - name: "rolling_restart"
    command: "kubectl rollout restart daemonset alloy -n sbos-monitor"
    timeout_seconds: 300

repair:
  - name: "restart_daemonset"
    command: "kubectl rollout restart daemonset alloy -n sbos-monitor"
    timeout_seconds: 120

uninstall:
  - name: "delete_daemonset"
    command: "kubectl delete daemonset alloy -n sbos-monitor --ignore-not-found"
    timeout_seconds: 120
