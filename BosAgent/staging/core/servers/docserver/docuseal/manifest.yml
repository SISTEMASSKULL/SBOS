# manifest.yml — Ficha docuseal (SBOS-005 §docserver)
# SBOS-049 §4 · Order 310 · StatefulSet
identity:
  id: docuseal
  name: DocuSeal
  version: "1.7"
  category: 1
  criticality: false
  server: docserver
  description: "Digital signatures multi-signer"

workload:
  type: StatefulSet
  namespace: sbos-docs
  replicas: 1
  service_account: docuseal-sa

order:
  execution_order: 310
  timeout_minutes: 15

requirements:
  dependencies:
    - postgresql
    - keycloak
  cpu_request: "200m"
  cpu_limit: "1000m"
  memory_request: "256Mi"
  memory_limit: "512Mi"
pvc_size: "20Gi"
  pvc_storage_class: "sbos-fast"

deployment:
  strategy: Recreate

governance:


health:
  check_command: "curl -sf http://localhost:3000/health"
  check_interval_seconds: 30
  check_timeout_seconds: 10
  consecutive_failures_threshold: 3

