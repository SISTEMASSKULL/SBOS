---
apiVersion: v1
kind: Service
metadata:
  name: paperless-ngx
  namespace: sbos-docs
spec:
  clusterIP: None
  selector:
    app: paperless-ngx
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: paperless-ngx
  namespace: sbos-docs
spec:
  serviceName: paperless-ngx
  replicas: 1
  selector:
    matchLabels:
      app: paperless-ngx
  template:
    metadata:
      labels:
        app: paperless-ngx
    spec:
      serviceAccountName: paperless-ngx-sa
      containers:
        - name: paperless-ngx
          image: docker.io/paperlessngx/paperless-ngx:2.13
          ports:
            - containerPort: 8000
              name: http

          volumeMounts:
            - name: data
              mountPath: /var/lib/paperless-ngx
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10

  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: sbos-fast
        resources:
          requests:
            storage: 100Gi
