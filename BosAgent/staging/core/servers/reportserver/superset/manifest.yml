# manifest.yml — Ficha superset (SBOS-005 §reportserver)
# SBOS-049 §4 · Order 286 · Deployment
identity:
  id: superset
  name: Apache Superset
  version: "4.1"
  category: 1
  criticality: false
  server: reportserver
  description: "BI: visualizations, KPIs, dashboards"

workload:
  type: Deployment
  namespace: sbos-apps
  replicas: 1
  service_account: superset-sa

order:
  execution_order: 286
  timeout_minutes: 15

requirements:
  dependencies:
    - postgresql
    - keycloak
  cpu_request: "500m"
  cpu_limit: "2000m"
  memory_request: "1Gi"
  memory_limit: "2Gi"


deployment:
  strategy: RollingUpdate

governance:


health:
  check_command: "curl -sf http://localhost:8088/health"
  check_interval_seconds: 30
  check_timeout_seconds: 10
  consecutive_failures_threshold: 3

