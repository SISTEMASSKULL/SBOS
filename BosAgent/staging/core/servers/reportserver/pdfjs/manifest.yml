# manifest.yml — Ficha pdfjs (SBOS-005 §reportserver)
# SBOS-049 §4 · Order 284 · Deployment
identity:
  id: pdfjs
  name: PDF.js
  version: "4.0"
  category: 1
  criticality: false
  server: reportserver
  description: "Embedded PDF viewer"

workload:
  type: Deployment
  namespace: sbos-apps
  replicas: 1
  service_account: pdfjs-sa

order:
  execution_order: 284
  timeout_minutes: 5

requirements:
  dependencies:

  cpu_request: "50m"
  cpu_limit: "200m"
  memory_request: "64Mi"
  memory_limit: "128Mi"


deployment:
  strategy: RollingUpdate

governance:


health:
  check_command: "curl -sf http://localhost:8080"
  check_interval_seconds: 30
  check_timeout_seconds: 10
  consecutive_failures_threshold: 3

