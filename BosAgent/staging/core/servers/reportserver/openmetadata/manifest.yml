# manifest.yml — Ficha openmetadata (SBOS-005 §reportserver)
# SBOS-049 §4 · Order 290 · Deployment
identity:
  id: openmetadata
  name: OpenMetadata
  version: "1.6"
  category: 1
  criticality: false
  server: reportserver
  description: "Data catalog, lineage"

workload:
  type: Deployment
  namespace: sbos-apps
  replicas: 1
  service_account: openmetadata-sa

order:
  execution_order: 290
  timeout_minutes: 20

requirements:
  dependencies:
    - postgresql
    - airflow
    - keycloak
  cpu_request: "500m"
  cpu_limit: "2000m"
  memory_request: "1Gi"
  memory_limit: "2Gi"


deployment:
  strategy: RollingUpdate

governance:


health:
  check_command: "curl -sf http://localhost:8585/health"
  check_interval_seconds: 30
  check_timeout_seconds: 10
  consecutive_failures_threshold: 3

