# manifest.yml — Ficha open-webui (SBOS-005 §aiserver)
# SBOS-049 §4 · Order 415 · Deployment
identity:
  id: open-webui
  name: Open WebUI
  version: "0.5"
  category: 1
  criticality: false
  server: aiserver
  description: "ChatGPT-like UI, multi-tenant, RAG"

workload:
  type: Deployment
  namespace: sbos-ai
  replicas: 1
  service_account: open-webui-sa

order:
  execution_order: 415
  timeout_minutes: 15

requirements:
  dependencies:
    - ollama
    - keycloak
  cpu_request: "200m"
  cpu_limit: "1000m"
  memory_request: "512Mi"
  memory_limit: "1Gi"


deployment:
  strategy: RollingUpdate

governance:


health:
  check_command: "curl -sf http://localhost:8080/health"
  check_interval_seconds: 30
  check_timeout_seconds: 10
  consecutive_failures_threshold: 3

