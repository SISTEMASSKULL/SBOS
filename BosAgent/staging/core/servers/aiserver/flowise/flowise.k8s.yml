---
apiVersion: v1
kind: Service
metadata:
  name: flowise
  namespace: sbos-ai
spec:
  type: ClusterIP
  selector:
    app: flowise
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flowise
  namespace: sbos-ai
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: flowise
  template:
    metadata:
      labels:
        app: flowise
    spec:
      serviceAccountName: flowise-sa
      containers:
        - name: flowise
          image: docker.io/flowiseai/flowise:2.1
          ports:
            - containerPort: 3000
              name: http

          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10


