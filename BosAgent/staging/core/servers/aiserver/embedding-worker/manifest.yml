# manifest.yml — Ficha embedding-worker (SBOS-005 §aiserver)
# SBOS-049 §4 · Order 420 · Deployment
identity:
  id: embedding-worker
  name: Embedding Worker
  version: "1.0"
  category: 1
  criticality: false
  server: aiserver
  description: "Consumes ai:embed_queue -> Qdrant (MIT SKULL)"

workload:
  type: Deployment
  namespace: sbos-ai
  replicas: 1
  service_account: embedding-worker-sa

order:
  execution_order: 420
  timeout_minutes: 10

requirements:
  dependencies:
    - redis
    - qdrant
    - ollama
  cpu_request: "200m"
  cpu_limit: "1000m"
  memory_request: "256Mi"
  memory_limit: "512Mi"


deployment:
  strategy: RollingUpdate

governance:


health:
  check_command: "curl -sf http://localhost:8080/health"
  check_interval_seconds: 30
  check_timeout_seconds: 10
  consecutive_failures_threshold: 3

