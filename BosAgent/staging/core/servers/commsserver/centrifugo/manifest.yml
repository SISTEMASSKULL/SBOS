# manifest.yml — Ficha centrifugo (SBOS-005 §commsserver)
# SBOS-049 §4 · Order 350 · Deployment
identity:
  id: centrifugo
  name: Centrifugo
  version: "6.0"
  category: 1
  criticality: true
  server: commsserver
  description: "WebSocket pub/sub real-time, JWT JWKS auth"

workload:
  type: Deployment
  namespace: sbos-comms
  replicas: 1
  service_account: centrifugo-sa

order:
  execution_order: 350
  timeout_minutes: 15

requirements:
  dependencies:
    - redis
    - keycloak
  cpu_request: "200m"
  cpu_limit: "1000m"
  memory_request: "256Mi"
  memory_limit: "512Mi"


deployment:
  strategy: RollingUpdate

governance:


health:
  check_command: "curl -sf http://localhost:8000/health"
  check_interval_seconds: 30
  check_timeout_seconds: 10
  consecutive_failures_threshold: 3

