---
apiVersion: v1
kind: Service
metadata:
  name: spamassassin
  namespace: sbos-comms
spec:
  type: ClusterIP
  selector:
    app: spamassassin
  ports:
    - name: http
      port: 783
      targetPort: 783
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spamassassin
  namespace: sbos-comms
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: spamassassin
  template:
    metadata:
      labels:
        app: spamassassin
    spec:
      serviceAccountName: spamassassin-sa
      containers:
        - name: spamassassin
          image: docker.io/library/spamassassin:4.0
          ports:
            - containerPort: 783
              name: http

          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 783
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 783
            initialDelaySeconds: 10
            periodSeconds: 10


