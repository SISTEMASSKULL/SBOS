# manifest.yml — Ficha roundcube (SBOS-005 §commsserver)
# SBOS-049 §4 · Order 325 · Deployment
identity:
  id: roundcube
  name: Roundcube Webmail
  version: "1.6"
  category: 1
  criticality: false
  server: commsserver
  description: "Webmail with SSO via OAuth2-Proxy"

workload:
  type: Deployment
  namespace: sbos-comms
  replicas: 1
  service_account: roundcube-sa

order:
  execution_order: 325
  timeout_minutes: 10

requirements:
  dependencies:
    - postfix
    - dovecot
    - postgresql
    - oauth2-proxy
  cpu_request: "200m"
  cpu_limit: "1000m"
  memory_request: "256Mi"
  memory_limit: "512Mi"


deployment:
  strategy: RollingUpdate

governance:


health:
  check_command: "curl -sf http://localhost:80"
  check_interval_seconds: 30
  check_timeout_seconds: 10
  consecutive_failures_threshold: 3
degraded_allowed: true
  degraded_reason: "OAuth2-Proxy may be unavailable"
