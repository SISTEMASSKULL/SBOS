---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: sbos-comms
spec:
  clusterIP: None
  selector:
    app: mongodb
  ports:
    - name: http
      port: 27017
      targetPort: 27017
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  namespace: sbos-comms
spec:
  serviceName: mongodb
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      serviceAccountName: mongodb-sa
      containers:
        - name: mongodb
          image: docker.io/library/mongo:7.0
          ports:
            - containerPort: 27017
              name: http

          volumeMounts:
            - name: data
              mountPath: /var/lib/mongodb
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 27017
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 27017
            initialDelaySeconds: 10
            periodSeconds: 10

  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: sbos-fast
        resources:
          requests:
            storage: 30Gi
