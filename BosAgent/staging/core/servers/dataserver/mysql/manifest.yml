# manifest.yml — Ficha mysql (SBOS-005 §dataserver)
# SBOS-049 §4 · Order 120 · StatefulSet
identity:
  id: mysql
  name: MySQL
  version: "8.4"
  category: 1
  criticality: false
  server: dataserver
  description: "Secondary DB: FreePBX, OrangeHRM, Easy!Appointments. criticality: false"

workload:
  type: StatefulSet
  namespace: sbos-data
  replicas: 1
  service_account: mysql-sa

order:
  execution_order: 120
  timeout_minutes: 15

requirements:
  dependencies:

  cpu_request: "200m"
  cpu_limit: "1000m"
  memory_request: "512Mi"
  memory_limit: "1Gi"
pvc_size: "20Gi"
  pvc_storage_class: "sbos-fast"

deployment:
  strategy: Recreate

governance:


health:
  check_command: "mysqladmin ping -h localhost"
  check_interval_seconds: 30
  check_timeout_seconds: 10
  consecutive_failures_threshold: 3

