---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-sa
  namespace: sbos-security
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-config
  namespace: sbos-security
data:
  vault.hcl: |
    ui = true
    disable_mlock = true
    storage "raft" {
      path = "/vault/data"
    }
    listener "tcp" {
      address     = "0.0.0.0:8200"
      tls_disable = true
    }
    api_addr = "http://vault.sbos-security:8200"
---
apiVersion: v1
kind: Service
metadata:
  name: vault
  namespace: sbos-security
spec:
  clusterIP: None
  selector:
    app: vault
  ports:
    - name: api
      port: 8200
      targetPort: 8200
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vault
  namespace: sbos-security
spec:
  serviceName: vault
  replicas: 1
  selector:
    matchLabels:
      app: vault
  template:
    metadata:
      labels:
        app: vault
    spec:
      serviceAccountName: vault-sa
      containers:
        - name: vault
          image: docker.io/hashicorp/vault:1.19
          ports:
            - containerPort: 8200
              name: api
          env:
            - name: VAULT_ADDR
              value: "http://0.0.0.0:8200"
            - name: VAULT_LOCAL_CONFIG
              value: |
                {"backend": {"raft": {"path": "/vault/data"}}, "listener": {"tcp": {"address": "0.0.0.0:8200", "tls_disable": true}}, "ui": true, "disable_mlock": true}
            - name: VAULT_DEV_ROOT_TOKEN_ID
              value: "sbos-vault-root-token"
          command:
            - vault
            - server
            - -dev
            - -dev-listen-address=0.0.0.0:8200
          volumeMounts:
            - name: data
              mountPath: /vault/data
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /v1/sys/health
              port: 8200
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /v1/sys/health
              port: 8200
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: vault-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: sbos-local-path
        resources:
          requests:
            storage: 1Gi
