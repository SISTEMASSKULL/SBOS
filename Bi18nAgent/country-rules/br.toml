# country-rules/br.toml — Regras completas do Brasil para o orquestrador bi18n
# Fontes: Receita Federal · TSE · IBGE · BACEN · CLT · SUSEP · E.164 UIT-T
# ISO 3166-1 alpha-2: BR · alpha-3: BRA · Numérico: 076

# ── Metadados do país ─────────────────────────────────────────────────────────

[pais]
iso_alpha2      = "BR"
iso_alpha3      = "BRA"
codigo_telefono = "+55"
locale_defecto  = "pt-BR"
tz_defecto      = "America/Sao_Paulo"
ltr             = true

# ── Numeração geral (quantidades, pesos, medidas — não monetária) ─────────────
# Brasil: separador decimal VÍRGULA, milhar PONTO (padrão ABNT NBR 5892)

[numeracion]
decimales_defecto = 2
sep_decimal       = ","
sep_miles         = "."

# ── Moeda (ISO 4217: BRL — Real Brasileiro) ──────────────────────────────────

[moneda]
iso4217              = "BRL"
simbolo_local        = "R$"
simbolo_intl         = "BRL"
decimales            = 2
decimales_operacion  = 4
sep_decimal          = ","
sep_miles            = "."

# ── Documentos de identidade (Receita Federal / TSE / DETRAN) ────────────────

# CPF: Cadastro de Pessoas Físicas — 11 dígitos com dígitos verificadores
[documentos.CPF]
regex         = '^\d{3}\.\d{3}\.\d{3}-\d{2}$'
ejemplo       = "123.456.789-09"
error_mensaje = "CPF brasileiro inválido. Formato esperado: 123.456.789-09 (Receita Federal)"

# CNPJ: Cadastro Nacional da Pessoa Jurídica — 14 dígitos com dígitos verificadores
[documentos.CNPJ]
regex         = '^\d{2}\.\d{3}\.\d{3}/\d{4}-\d{2}$'
ejemplo       = "11.222.333/0001-81"
error_mensaje = "CNPJ brasileiro inválido. Formato esperado: 11.222.333/0001-81 (Receita Federal)"

# RG: Registro Geral — formato variável por estado (7 a 9 dígitos + dígito verificador opcional)
[documentos.RG]
regex         = '^\d{7,9}(-?\d|X)?$'
ejemplo       = "12345678-9"
error_mensaje = "RG brasileiro inválido. Formato: 7-9 dígitos com dígito verificador opcional (DETRAN estadual)"

# CNH: Carteira Nacional de Habilitação
[documentos.CNH]
regex         = '^\d{11}$'
ejemplo       = "12345678901"
error_mensaje = "CNH brasileira inválida. Deve conter 11 dígitos (DENATRAN/SENATRAN)"

# Título de Eleitor
[documentos.TITULO_ELEITOR]
regex         = '^\d{12}$'
ejemplo       = "000012345678"
error_mensaje = "Título de Eleitor inválido. Deve conter 12 dígitos (TSE)"

# Passaporte brasileiro (DELEMIG/PF)
[documentos.PASSPORT]
regex         = '^[A-Z]{2}\d{6}$'
ejemplo       = "AB123456"
error_mensaje = "Passaporte brasileiro inválido. Formato: 2 letras + 6 dígitos (DELEMIG/PF)"

# ── Máscaras PII por tipo de documento/dado ───────────────────────────────────

[mascaras.CPF]
estrategia     = "both"
prefix_visible = 3
suffix_visible = 2

[mascaras.CNPJ]
estrategia = "partial"
n          = 4

[mascaras.RG]
estrategia     = "both"
prefix_visible = 2
suffix_visible = 2

[mascaras.CNH]
estrategia = "partial"
n          = 4

[mascaras.TITULO_ELEITOR]
estrategia = "partial"
n          = 4

[mascaras.PASSPORT]
estrategia     = "both"
prefix_visible = 2
suffix_visible = 2

[mascaras.EMAIL]
estrategia     = "both"
prefix_visible = 2
suffix_visible = 4

[mascaras.PHONE]
estrategia = "partial"
n          = 4

[mascaras.NOME]
estrategia     = "both"
prefix_visible = 2
suffix_visible = 1

[mascaras.CONTA_BANCARIA]
estrategia = "partial"
n          = 4

