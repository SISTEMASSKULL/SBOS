# country-rules/ar.toml — Reglas completas de Argentina para el orquestador bi18n
# Fuentes: AFIP · RENAPER · ANSES · ARCA · MTEySS · INDEC · Ley 25246 · E.164 ITU-T
# ISO 3166-1 alpha-2: AR · alpha-3: ARG · Numérico: 032

# ── Metadatos del país ────────────────────────────────────────────────────────

[pais]
iso_alpha2      = "AR"
iso_alpha3      = "ARG"
codigo_telefono = "+54"
locale_defecto  = "es-AR"
tz_defecto      = "America/Argentina/Buenos_Aires"
ltr             = true

# ── Numeración general (cantidades, pesos, medidas — no monetaria) ────────────
# Argentina: separador decimal COMA, miles PUNTO (convención continental europea)

[numeracion]
decimales_defecto = 2
sep_decimal       = ","
sep_miles         = "."

# ── Moneda (ISO 4217: ARS — Peso Argentino) ──────────────────────────────────

[moneda]
iso4217              = "ARS"
simbolo_local        = "$"
simbolo_intl         = "ARS"
decimales            = 2
decimales_operacion  = 4
sep_decimal          = ","
sep_miles            = "."

# ── Documentos de identidad (RENAPER / AFIP / ARCA) ──────────────────────────

[documentos.DNI]
regex         = '^\d{7,8}$'
ejemplo       = "12345678"
error_mensaje = "DNI argentino inválido. Debe contener 7 u 8 dígitos (RENAPER)"

[documentos.CUIT]
regex         = '^\d{2}-\d{8}-\d{1}$'
ejemplo       = "20-12345678-9"
error_mensaje = "CUIT argentino inválido. Formato: 20-12345678-9 (AFIP/ARCA)"

[documentos.CUIL]
regex         = '^\d{2}-\d{8}-\d{1}$'
ejemplo       = "20-12345678-9"
error_mensaje = "CUIL argentino inválido. Formato: 20-12345678-9 (ANSES)"

[documentos.PASSPORT]
regex         = '^[A-Z]{2}\d{7}$'
ejemplo       = "AA1234567"
error_mensaje = "Pasaporte argentino inválido. Formato: 2 letras + 7 dígitos (RENAPER)"

[documentos.CDI]
regex         = '^\d{11}$'
ejemplo       = "20123456789"
error_mensaje = "CDI argentino inválido. Clave de Identificación — 11 dígitos (AFIP)"

# ── Máscaras PII por tipo de documento/dato ───────────────────────────────────

[mascaras.DNI]
estrategia     = "both"
prefix_visible = 2
suffix_visible = 2

[mascaras.CUIT]
estrategia = "partial"
n          = 4

[mascaras.CUIL]
estrategia = "partial"
n          = 4

[mascaras.PASSPORT]
estrategia     = "both"
prefix_visible = 2
suffix_visible = 2

[mascaras.EMAIL]
estrategia     = "both"
prefix_visible = 2
suffix_visible = 4

[mascaras.PHONE]
estrategia = "partial"
n          = 4

[mascaras.NOMBRE]
estrategia     = "both"
prefix_visible = 2
suffix_visible = 1

[mascaras.CUENTA_BANCARIA]
estrategia = "partial"
n          = 4

