# country-rules/bo.toml — Reglas completas de Bolivia para el orquestador bi18n
# Fuentes: SEGIP · SIN · ATT · INE · ISO 3166-2:BO · Ley 164 · E.164 ITU-T
# ISO 3166-1 alpha-2: BO · alpha-3: BOL · Numérico: 068

# ── Metadatos del país ────────────────────────────────────────────────────────

[pais]
iso_alpha2      = "BO"
iso_alpha3      = "BOL"
codigo_telefono = "+591"
locale_defecto  = "es-BO"
tz_defecto      = "America/La_Paz"
ltr             = true

# ── Numeración general (cantidades, pesos, medidas — no monetaria) ────────────
# Bolivia: separador decimal PUNTO, miles COMA (convención americana/boliviana)

[numeracion]
decimales_defecto = 7
sep_decimal       = "."
sep_miles         = ","

# ── Moneda (ISO 4217: BOB — Boliviano) ───────────────────────────────────────
# decimales           = muestreo/pantalla (2 → "Bs. 10.50")
# decimales_operacion = precisión interna de cálculo (7 → "10.5000000")

[moneda]
iso4217              = "BOB"
simbolo_local        = "Bs."
simbolo_intl         = "BOB"
decimales            = 2
decimales_operacion  = 7
sep_decimal          = "."
sep_miles            = ","

# ── Documentos de identidad (SEGIP / SIN) ────────────────────────────────────
# CI: Cédula de Identidad — 5 a 8 dígitos + extensión departamental opcional
# Extensiones válidas: LP CB SC OR PT TJ CH BE PD
# Complemento (duplicidad): sufijo -XN donde X=letra, N=dígito (ej: -1A)

[documentos.CI]
regex         = '^\d{5,8}(-[A-Z]{2})?$'
ejemplo       = "7654321-LP"
error_mensaje = "Cédula de identidad boliviana inválida. Formato: 7654321 o 7654321-LP"

[documentos.CI_COMP]
regex         = '^\d{5,8}-[A-Z0-9]{2,3}$'
ejemplo       = "7654321-1A"
error_mensaje = "CI con complemento inválido. Formato: 7654321-1A (complemento por duplicidad SEGIP)"

[documentos.NIT]
regex         = '^\d{7,12}$'
ejemplo       = "1023456789"
error_mensaje = "NIT boliviano inválido. Debe contener entre 7 y 12 dígitos numéricos (SIN Bolivia)"

[documentos.PASSPORT]
regex         = '^[A-Z]{1,2}\d{5,8}$'
ejemplo       = "BO123456"
error_mensaje = "Pasaporte boliviano inválido. Formato: 1-2 letras seguidas de 5-8 dígitos (SEGIP/DIGEMIG)"

[documentos.CARNET_EXT]
regex         = '^[A-Z0-9]{5,15}$'
ejemplo       = "CE123456789"
error_mensaje = "Carnet de extranjería inválido. Debe contener entre 5 y 15 caracteres alfanuméricos"

[documentos.LICENCIA]
regex         = '^[A-Z]{1,2}\d{4,7}$'
ejemplo       = "LP12345"
error_mensaje = "Licencia de conducir boliviana inválida. Formato: extensión departamental + 4-7 dígitos"

[documentos.MATRICULA]
regex         = '^\d{6,10}-[A-Z]{2}$'
ejemplo       = "123456-SC"
error_mensaje = "Matrícula de comercio inválida. Formato: dígitos + guión + extensión departamental (FUNDEMPRESA)"

# ── Máscaras PII por tipo de documento/dato ───────────────────────────────────

[mascaras.CI]
estrategia     = "both"
prefix_visible = 2
suffix_visible = 3

[mascaras.CI_COMP]
estrategia     = "both"
prefix_visible = 2
suffix_visible = 2

[mascaras.NIT]
estrategia = "partial"
n          = 4

[mascaras.PASSPORT]
estrategia     = "both"
prefix_visible = 1
suffix_visible = 3

[mascaras.CARNET_EXT]
estrategia = "partial"
n          = 4

[mascaras.EMAIL]
estrategia = "prefix"
n          = 3

[mascaras.PHONE]
estrategia = "partial"
n          = 4

[mascaras.NOMBRE]
estrategia     = "both"
prefix_visible = 2
suffix_visible = 1

[mascaras.CUENTA_BANCARIA]
estrategia = "partial"
n          = 4

