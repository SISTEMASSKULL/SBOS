// ============================================================
// bAuth gRPC Service — ADR-020 (daemon-to-daemon)
// Consumidores: biedata, bkernel, bsearch, bhnexus, bnotify
// Transporte: Unix socket /run/bos/bauth-grpc.sock
// ============================================================

syntax = "proto3";

package bauth;

// ─── Servicio principal ──────────────────────────────────

service BauthService {
    // Health check
    rpc HealthCheck (HealthCheckRequest) returns (HealthCheckResponse);

    // Evaluar políticas para un átomo
    rpc EvaluatePolicy (EvaluatePolicyRequest) returns (EvaluatePolicyResponse);

    // Computar RolBitMask desde BD
    rpc ComputeRolBitMask (ComputeRolBitMaskRequest) returns (ComputeRolBitMaskResponse);

    // Validar ctx_id (SBOS-049)
    rpc ValidateContext (ValidateContextRequest) returns (ValidateContextResponse);

    // Registrar evento de auditoría
    rpc RecordAuditEvent (AuditEventRequest) returns (AuditEventResponse);
}

// ─── Health ──────────────────────────────────────────────

message HealthCheckRequest {}

message HealthCheckResponse {
    string status = 1;
    string version = 2;
    string socket_path = 3;
    bool db_connected = 4;
    int32 policies_loaded = 5;
}

// ─── Policy Evaluation ────────────────────────────────────

message EvaluatePolicyRequest {
    int32 app_code = 1;
    int32 group_code = 2;
    int32 atom_code = 3;
    string ctx_id = 4;
    string user_id = 5;
    map<string, string> context = 6;
}

message EvaluatePolicyResponse {
    bool allowed = 1;
    int32 policy_state = 2;
    int32 policies_evaluated = 3;
    repeated PolicyResult results = 4;
}

message PolicyResult {
    string slug = 1;
    bool conditions_met = 2;
    string action = 3;
    string message = 4;
}

// ─── RolBitMask ──────────────────────────────────────────

message ComputeRolBitMaskRequest {
    string role_id = 1;
    bool include_inheritance = 2;
}

message ComputeRolBitMaskResponse {
    string role_id = 1;
    int32 total_atoms = 2;
    int32 active_count = 3;
    bytes rol_bitmask = 4;
    string base64 = 5;
}

// ─── Context Validation ──────────────────────────────────

message ValidateContextRequest {
    string ctx_id = 1;
}

message ValidateContextResponse {
    bool valid = 1;
    string reason = 2;
    int32 fields_detected = 3;
}

// ─── Audit ───────────────────────────────────────────────

message AuditEventRequest {
    string ctx_id = 1;
    string tenant_id = 2;
    string role_id = 3;
    int32 app_code = 4;
    int32 group_code = 5;
    int32 atom_code = 6;
    int32 atom_position = 7;
    int64 bitmask_atom = 8;
    int32 policy_state = 9;
    int32 result = 10;
    string policy_slug = 11;
    string evaluator = 12;
    int32 domain_code = 13;
}

message AuditEventResponse {
    bool recorded = 1;
    string audit_id = 2;
}
