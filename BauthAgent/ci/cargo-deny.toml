# cargo-deny.toml — Política de dependencias bAuth (SBOS)
# Propósito: definir qué licencias, advisories y paquetes están permitidos
# Norma:     SA-10 / ISO 27001 A.8.25 / OWASP ASVS v5.0 §12.3
# Formato:   version 2 (cargo-deny 0.14+ / 0.20+)
# Migración: pull/611 eliminó los campos "deny", "default", "copyleft" de [licenses]
#            y cambió "unmaintained" de acción a scope en [advisories]

# ── §1 Advisories (vulnerabilidades conocidas — RustSec DB) ──────────────────
# En v2: vulnerabilities son siempre denied salvo que estén en ignore[].
# unmaintained: scope "all"|"workspace"|"transitive"|"none" (ya no acepta "warn"/"deny")
[advisories]
version = 2
db-path  = "~/.cargo/advisory-db"
db-urls  = ["https://github.com/rustsec/advisory-db"]

# Incluir todos los crates (workspace + transitivos) en la revisión
unmaintained = "all"

# Versiones retiradas de crates.io → advertencia (puede bloquear builds futuros)
yanked = "warn"

# Advisories exceptuados con justificación auditada
ignore = [
    # RUSTSEC-2023-0071 — rsa 0.9.10 — Marvin Attack timing sidechannel
    # Trayectoria: rsa ← sqlx-mysql ← sqlx (en Cargo.lock pero NO compilado)
    # bAuth usa solo feature="postgres"; sqlx-mysql no se compila ni ejecuta.
    # Sin fix disponible upstream (sin parche publicado a 2026-08-02).
    # Riesgo aceptado: la explotación requiere observar timing de firma RSA en
    # el proceso bAuth — imposible porque bAuth no invoca rsa en ninguna ruta activa.
    { id = "RUSTSEC-2023-0071" },
]

# ── §2 Licencias aprobadas para el ecosistema SBOS ───────────────────────────
# En v2: "allow" define el conjunto aprobado. Todo lo no listado es error implícito.
# Los campos "deny", "default" y "copyleft" fueron eliminados en 0.14+ (pull/611).
# Licencias copyleft (GPL, AGPL, LGPL, EUPL) quedan denegadas por no estar en allow.
[licenses]
version = 2
# bAuth es software propietario SBOS interno (no publicado en crates.io).
# private.ignore=true omite el chequeo de licencias para crates del workspace
# que no tienen license = <SPDX válido> en su Cargo.toml.
private = { ignore = true }
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "OpenSSL",
    "CC0-1.0",
    "Zlib",
    "MPL-2.0",
    # webpki-roots 0.26.x / 1.x: Community Data License Agreement Permissive 2.0
    # Licencia permisiva de Linux Foundation — equivalente funcional a BSD/MIT para uso.
    "CDLA-Permissive-2.0",
]

# Umbral de confianza para detección automática de licencias (80%)
confidence-threshold = 0.8

# ── §3 Restricciones sobre paquetes (bans) ───────────────────────────────────
[bans]
# Múltiples versiones del mismo crate → advertencia (pueden existir transitivamente)
multiple-versions = "warn"

# Wildcards en dependencias → permitidos (usamos rangos semver normales)
wildcards = "allow"

# Paquetes cuyas múltiples versiones se permiten explícitamente (transitivos comunes)
# Nota: rand 0.7 / rand_core 0.5-0.6 ya no están en el grafo de dependencias (2026-08-02)
skip = []

# ── §4 Fuentes de paquetes (sources) ─────────────────────────────────────────
[sources]
# Solo crates.io oficial permitido — no registries privados no verificados
unknown-registry = "deny"

# Dependencias de git sin verificación de hash → denegadas
unknown-git = "deny"

# Registries aprobados
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

# No se permiten dependencias de repositorios git externos sin aprobación explícita
allow-git = []
