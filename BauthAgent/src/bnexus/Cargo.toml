# bhnexus workspace — Nexus Host · SBOS
# banexus/ es un workspace separado (Cargo no permite workspaces anidados)
# Para construir bhnexus:  cd src/bnexus && cargo build -p bhnexus
# Para construir banexus:  cd src/bnexus/banexus && cargo build -p banexus
# SSOT: SBOS-NEXUS-CONCEPTUALIZACION-v3_0.md §23.4

[workspace]
members  = ["bhnexus"]
exclude  = ["banexus"]
resolver = "2"

[workspace.package]
version      = "0.1.0"
edition      = "2021"
authors      = ["SKULL <sistemas@skull.com.bo>"]
license      = "LicenseRef-SBOS-Proprietary"
publish      = false
rust-version = "1.85"

[workspace.dependencies]
# === Async Runtime ===
tokio             = { version = "1.45", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util      = "0.3"

# === TLS (mTLS Puerta 1) ===
rustls       = { version = "0.23", features = ["ring"] }
tokio-rustls = "0.26"
rcgen        = "0.13"

# === Serialización ===
serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml       = "0.8"

# === Logging ===
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# === Utilidades ===
uuid       = { version = "1", features = ["v4", "serde"] }
chrono     = { version = "0.4", features = ["serde"] }
thiserror  = "2"
anyhow     = "1"
base64     = "0.22"

[profile.release]
opt-level     = "z"
lto           = true
codegen-units = 1
panic         = "abort"
strip         = true

[profile.dev]
opt-level = 1
