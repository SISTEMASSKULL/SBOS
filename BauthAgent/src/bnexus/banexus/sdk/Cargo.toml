# banexus-sdk — DLL para Flutter desktop (dart:ffi)
# Produce banexus.dll (Windows) / libbanexus.so (Linux) / libbanexus.dylib (macOS).
# Flutter la carga con DynamicLibrary.open() — sin proceso separado, sin puerto TCP local.
# SSOT: SBOS-NEXUS-CONCEPTUALIZACION-v3_0.md §24.3

[package]
name        = "bauth_nexus"
description = "banexus SDK — DLL FFI para Flutter desktop"
version.workspace     = true
edition.workspace     = true
authors.workspace     = true
license.workspace     = true
publish.workspace     = true
rust-version.workspace = true

[lib]
name       = "banexus"
crate-type = ["cdylib"]

[dependencies]
tokio      = { workspace = true }
serde_json = { workspace = true }
anyhow     = { workspace = true }
tracing    = { workspace = true }
