# manifest.yml — Ficha tryton (SBOS-005 §erpserver)
# SBOS-049 §4 · Order 170 · StatefulSet
identity:
  id: tryton
  name: Tryton ERP
  version: "7.4"
  category: 1
  criticality: true
  server: erpserver
  description: "Accounting, inventory, sales. MDM hub via bKernel"

workload:
  type: StatefulSet
  namespace: sbos-erp
  replicas: 1
  service_account: tryton-sa

order:
  execution_order: 170
  timeout_minutes: 20

requirements:
  dependencies:
    - postgresql
    - keycloak
  cpu_request: "500m"
  cpu_limit: "2000m"
  memory_request: "1Gi"
  memory_limit: "2Gi"
pvc_size: "50Gi"
  pvc_storage_class: "sbos-fast"

deployment:
  strategy: Recreate

governance:
backup_enabled: true
  backup_schedule: "0 2 * * *"

health:
  check_command: "curl -sf http://localhost:8000/health"
  check_interval_seconds: 30
  check_timeout_seconds: 10
  consecutive_failures_threshold: 3

