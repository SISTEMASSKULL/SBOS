# trytond.conf — Tryton ERP 7.4 · SKULL Operator
# Fuente: SBOS-INSTALACION-FORMULARIO.md §4
# País: Bolivia · Moneda: BOB · Empresas: 2

[database]
uri = postgresql://tryton:${TRYTON_DB_PASSWORD}@postgresql.sbos-data:5432/tryton

[session]
timeout = 3600

[email]
uri = smtp://postfix.sbos-comms:25
from = tryton@mail.sksistemas.com

[web]
listen = 0.0.0.0:8000
root = /var/lib/tryton/www

[modules]
# Módulos activados según formulario §4
active = account
         sale
         purchase
         stock
         account_invoice
         account_payment
         sale_invoice
         party
         company
         product
         hr
         payroll

[company]
# Multi-empresa: 2 compañías
default_currency = BOB
default_timezone = America/La_Paz

[chart_of_accounts]
# Plan de cuentas: Bolivia
template = bo
