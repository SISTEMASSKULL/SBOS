---
apiVersion: v1
kind: Service
metadata:
  name: wazuh-indexer
  namespace: sbos-identity
spec:
  clusterIP: None
  selector:
    app: wazuh-indexer
  ports:
    - name: http
      port: 9200
      targetPort: 9200
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: wazuh-indexer
  namespace: sbos-identity
spec:
  serviceName: wazuh-indexer
  replicas: 1
  selector:
    matchLabels:
      app: wazuh-indexer
  template:
    metadata:
      labels:
        app: wazuh-indexer
    spec:
      serviceAccountName: wazuh-indexer-sa
      containers:
        - name: wazuh-indexer
          image: docker.io/wazuh/wazuh-indexer:4.10
          ports:
            - containerPort: 9200
              name: http

          volumeMounts:
            - name: data
              mountPath: /var/lib/wazuh-indexer
          resources:
            requests:
              cpu: 1000m
              memory: 2Gi
            limits:
              cpu: 4000m
              memory: 4Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 9200
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 9200
            initialDelaySeconds: 10
            periodSeconds: 10

  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: sbos-fast
        resources:
          requests:
            storage: 200Gi
