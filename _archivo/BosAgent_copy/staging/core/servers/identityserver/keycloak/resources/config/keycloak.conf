# Keycloak 26.x configuration
# SBOS-019 §9 · Order 130 · StatefulSet
# Mounted at /opt/keycloak/conf/keycloak.conf

# Database
db=postgres
db-url=jdbc:postgresql://postgresql.sbos-data:5432/keycloak_db
db-username=keycloak
db-password=${KC_DB_PASSWORD}
db-pool-initial-size=5
db-pool-max-size=20
db-pool-min-size=2

# Hostname
hostname=${KC_HOSTNAME}
http-port=9000
proxy-headers=xforwarded

# Health & Metrics
health-enabled=true
metrics-enabled=true

# Clustering — JDBC PING
cache=ispn
cache-stack=jdbc-ping

# Features
features=authorization,account-api,account2,admin-api,admin-fine-grained-auth,admin2,docker,impersonation,oidc,token-exchange

# SPI — Event listener for audit logging
spi-events-listener-jboss-logging-success-level=info
spi-events-listener-jboss-logging-error-level=warn
