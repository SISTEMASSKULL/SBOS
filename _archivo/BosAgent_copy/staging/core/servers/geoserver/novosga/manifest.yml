# manifest.yml — Ficha novosga (SBOS-005 §geoserver)
# SBOS-049 §4 · Order 375 · Deployment
identity:
  id: novosga
  name: Novo SGA
  version: "2.1"
  category: 1
  criticality: false
  server: geoserver
  description: "Multi-branch queue management"

workload:
  type: Deployment
  namespace: sbos-geo
  replicas: 1
  service_account: novosga-sa

order:
  execution_order: 375
  timeout_minutes: 10

requirements:
  dependencies:
    - postgresql
    - keycloak
  cpu_request: "200m"
  cpu_limit: "1000m"
  memory_request: "256Mi"
  memory_limit: "512Mi"


deployment:
  strategy: RollingUpdate

governance:


health:
  check_command: "curl -sf http://localhost:8080/health"
  check_interval_seconds: 30
  check_timeout_seconds: 10
  consecutive_failures_threshold: 3

