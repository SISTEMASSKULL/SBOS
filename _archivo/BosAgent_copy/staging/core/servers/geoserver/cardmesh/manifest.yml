# manifest.yml — Ficha cardmesh (SBOS-005 §geoserver)
# SBOS-049 §4 · Order 378 · Deployment
identity:
  id: cardmesh
  name: CardMesh
  version: "1.0"
  category: 1
  criticality: false
  server: geoserver
  description: "vCards NFC/QR (MIT SKULL)"

workload:
  type: Deployment
  namespace: sbos-geo
  replicas: 1
  service_account: cardmesh-sa

order:
  execution_order: 378
  timeout_minutes: 10

requirements:
  dependencies:
    - postgresql
    - keycloak
  cpu_request: "200m"
  cpu_limit: "1000m"
  memory_request: "256Mi"
  memory_limit: "512Mi"


deployment:
  strategy: RollingUpdate

governance:


health:
  check_command: "curl -sf http://localhost:8080/health"
  check_interval_seconds: 30
  check_timeout_seconds: 10
  consecutive_failures_threshold: 3

