# manifest.yml — Ficha searxng (SBOS-005 §opsserver)
# SBOS-049 §4 · Order 405 · Deployment
identity:
  id: searxng
  name: SearXNG
  version: "1.0"
  category: 1
  criticality: false
  server: opsserver
  description: "Sovereign meta search engine"

workload:
  type: Deployment
  namespace: sbos-ops
  replicas: 1
  service_account: searxng-sa

order:
  execution_order: 405
  timeout_minutes: 10

requirements:
  dependencies:
    - keycloak
  cpu_request: "100m"
  cpu_limit: "500m"
  memory_request: "128Mi"
  memory_limit: "256Mi"


deployment:
  strategy: RollingUpdate

governance:


health:
  check_command: "curl -sf http://localhost:8080/health"
  check_interval_seconds: 30
  check_timeout_seconds: 10
  consecutive_failures_threshold: 3

