# manifest.yml — Ficha camelot (SBOS-005 §docserver)
# SBOS-049 §4 · Order 302 · Deployment
identity:
  id: camelot
  name: Camelot
  version: "0.12"
  category: 1
  criticality: false
  server: docserver
  description: "Complex PDF extraction"

workload:
  type: Deployment
  namespace: sbos-docs
  replicas: 1
  service_account: camelot-sa

order:
  execution_order: 302
  timeout_minutes: 10

requirements:
  dependencies:
    - paperless-ngx
  cpu_request: "100m"
  cpu_limit: "500m"
  memory_request: "128Mi"
  memory_limit: "256Mi"


deployment:
  strategy: RollingUpdate

governance:


health:
  check_command: "python -c 'import camelot'"
  check_interval_seconds: 30
  check_timeout_seconds: 10
  consecutive_failures_threshold: 3

