---
apiVersion: v1
kind: Service
metadata:
  name: tesseract
  namespace: sbos-docs
spec:
  type: ClusterIP
  selector:
    app: tesseract
  ports:
    - name: http
      port: 5000
      targetPort: 5000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tesseract
  namespace: sbos-docs
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: tesseract
  template:
    metadata:
      labels:
        app: tesseract
    spec:
      serviceAccountName: tesseract-sa
      containers:
        - name: tesseract
          image: docker.io/tesseractshadow/tesseract5:latest
          ports:
            - containerPort: 5000
              name: http

          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10


