# manifest.yml — Ficha smarttax (SBOS-005 §devserver)
# SBOS-049 §4 · Order 180 · Deployment
identity:
  id: smarttax
  name: SmartTax
  version: "1.0"
  category: 1
  criticality: false
  server: devserver
  description: "Tax compliance BO/AR/MX (MIT SKULL)"

workload:
  type: Deployment
  namespace: sbos-apps
  replicas: 1
  service_account: smarttax-sa

order:
  execution_order: 180
  timeout_minutes: 10

requirements:
  dependencies:
    - postgresql
  cpu_request: "200m"
  cpu_limit: "1000m"
  memory_request: "256Mi"
  memory_limit: "512Mi"


deployment:
  strategy: RollingUpdate

governance:


health:
  check_command: "curl -sf http://localhost:8080/health"
  check_interval_seconds: 30
  check_timeout_seconds: 10
  consecutive_failures_threshold: 3

