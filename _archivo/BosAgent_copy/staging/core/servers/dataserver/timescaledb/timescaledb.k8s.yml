---
apiVersion: v1
kind: Service
metadata:
  name: timescaledb
  namespace: sbos-data
spec:
  type: ClusterIP
  selector:
    app: timescaledb
  ports:
    - name: http
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: timescaledb
  namespace: sbos-data
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: timescaledb
  template:
    metadata:
      labels:
        app: timescaledb
    spec:
      serviceAccountName: timescaledb-sa
      containers:
        - name: timescaledb
          image: docker.io/timescale/timescaledb:2.16-pg17
          ports:
            - containerPort: 5432
              name: http

          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 5432
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 5432
            initialDelaySeconds: 10
            periodSeconds: 10


