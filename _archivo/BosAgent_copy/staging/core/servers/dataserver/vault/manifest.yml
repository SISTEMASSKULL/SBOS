# manifest.yml — Ficha 08: HashiCorp Vault
# SBOS-019 §9 · Order 120 · StatefulSet
identity:
  id: vault
  name: HashiCorp Vault
  version: "1.19"
  category: 1
  criticality: true
  server: dataserver
  description: "Secrets management con backend PostgreSQL y PKI engine"

workload:
  type: StatefulSet
  namespace: sbos-security
  replicas: 1
  service_account: vault-sa

order:
  execution_order: 120
  timeout_minutes: 15

requirements:
  dependencies:
    - postgresql
  cpu_request: "500m"
  cpu_limit: "2000m"
  memory_request: "1Gi"
  memory_limit: "4Gi"
  pvc_size: "20Gi"
  pvc_storage_class: "sbos-fast"

deployment:
  strategy: Recreate

governance:
  auto_install: false
  backup_enabled: true
  backup_schedule: "0 1 * * *"
  encryption_required: true
  unseal_keys: 5
  key_threshold: 3

health:
  check_command: "vault status -format=json | jq -r .sealed"
  check_interval_seconds: 30
  check_timeout_seconds: 10
  consecutive_failures_threshold: 3

integrations:
  engines:
    - type: pki
      path: pki
    - type: kv-v2
      path: secret
  backend:
    type: postgresql
    database: vault_db
