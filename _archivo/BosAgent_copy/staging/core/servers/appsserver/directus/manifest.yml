# manifest.yml — Ficha directus (SBOS-005 §appsserver)
# SBOS-049 §4 · Order 210 · Deployment
identity:
  id: directus
  name: Directus CMS
  version: "11.3"
  category: 1
  criticality: false
  server: appsserver
  description: "Headless CMS with auto-generated API"

workload:
  type: Deployment
  namespace: sbos-apps
  replicas: 1
  service_account: directus-sa

order:
  execution_order: 210
  timeout_minutes: 15

requirements:
  dependencies:
    - postgresql
    - keycloak
  cpu_request: "200m"
  cpu_limit: "1000m"
  memory_request: "256Mi"
  memory_limit: "512Mi"
pvc_size: "20Gi"
  pvc_storage_class: "sbos-fast"

deployment:
  strategy: Recreate

governance:


health:
  check_command: "curl -sf http://localhost:8055/server/health"
  check_interval_seconds: 30
  check_timeout_seconds: 10
  consecutive_failures_threshold: 3

