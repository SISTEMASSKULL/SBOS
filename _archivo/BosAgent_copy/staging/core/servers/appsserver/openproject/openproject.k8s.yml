---
apiVersion: v1
kind: Service
metadata:
  name: openproject
  namespace: sbos-apps
spec:
  clusterIP: None
  selector:
    app: openproject
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: openproject
  namespace: sbos-apps
spec:
  serviceName: openproject
  replicas: 1
  selector:
    matchLabels:
      app: openproject
  template:
    metadata:
      labels:
        app: openproject
    spec:
      serviceAccountName: openproject-sa
      containers:
        - name: openproject
          image: docker.io/openproject/openproject:14.2
          ports:
            - containerPort: 8080
              name: http

          volumeMounts:
            - name: data
              mountPath: /var/lib/openproject
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10

  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: sbos-fast
        resources:
          requests:
            storage: 50Gi
