# manifest.yml — Ficha trilium (SBOS-005 §appsserver)
# SBOS-049 §4 · Order 235 · StatefulSet
identity:
  id: trilium
  name: Trilium Notes
  version: "0.63"
  category: 1
  criticality: false
  server: appsserver
  description: "Hierarchical notes E2E encrypted"

workload:
  type: StatefulSet
  namespace: sbos-apps
  replicas: 1
  service_account: trilium-sa

order:
  execution_order: 235
  timeout_minutes: 10

requirements:
  dependencies:
    - keycloak
  cpu_request: "100m"
  cpu_limit: "500m"
  memory_request: "128Mi"
  memory_limit: "256Mi"
pvc_size: "5Gi"
  pvc_storage_class: "sbos-fast"

deployment:
  strategy: Recreate

governance:


health:
  check_command: "curl -sf http://localhost:8080/health"
  check_interval_seconds: 30
  check_timeout_seconds: 10
  consecutive_failures_threshold: 3

