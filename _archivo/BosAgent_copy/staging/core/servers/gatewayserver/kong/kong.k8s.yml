---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kong-sa
  namespace: sbos-gateway
---
apiVersion: v1
kind: Service
metadata:
  name: kong
  namespace: sbos-gateway
spec:
  type: ClusterIP
  selector:
    app: kong
  ports:
    - name: proxy-http
      port: 8000
      targetPort: 8000
    - name: proxy-https
      port: 8443
      targetPort: 8443
    - name: admin
      port: 8001
      targetPort: 8001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kong
  namespace: sbos-gateway
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: kong
  template:
    metadata:
      labels:
        app: kong
    spec:
      serviceAccountName: kong-sa
      initContainers:
        - name: kong-migrations
          image: docker.io/library/kong:3.9
          command:
            - kong
            - migrations
            - bootstrap
          env:
            - name: KONG_DATABASE
              value: postgres
            - name: KONG_PG_HOST
              value: postgresql.sbos-data
            - name: KONG_PG_DATABASE
              value: kong_db
            - name: KONG_PG_USER
              value: postgres
            - name: KONG_PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kong-secret
                  key: db-password
      containers:
        - name: kong
          image: docker.io/library/kong:3.9
          ports:
            - containerPort: 8000
              name: proxy-http
            - containerPort: 8443
              name: proxy-https
            - containerPort: 8001
              name: admin
          env:
            - name: KONG_DATABASE
              value: postgres
            - name: KONG_PG_HOST
              value: postgresql.sbos-data
            - name: KONG_PG_DATABASE
              value: kong_db
            - name: KONG_PG_USER
              value: postgres
            - name: KONG_PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kong-secret
                  key: db-password
            - name: KONG_ADMIN_LISTEN
              value: "0.0.0.0:8001"
            - name: KONG_PROXY_LISTEN
              value: "0.0.0.0:8000, 0.0.0.0:8443 ssl"
            - name: KONG_PROXY_ACCESS_LOG
              value: /dev/stdout
            - name: KONG_ADMIN_ACCESS_LOG
              value: /dev/stdout
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /status
              port: 8001
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /status
              port: 8001
            initialDelaySeconds: 15
            periodSeconds: 5
