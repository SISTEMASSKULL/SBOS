---
apiVersion: v1
kind: Service
metadata:
  name: bcompass-svc
  namespace: sbos-ai
spec:
  type: ClusterIP
  selector:
    app: bcompass-svc
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bcompass-svc
  namespace: sbos-ai
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: bcompass-svc
  template:
    metadata:
      labels:
        app: bcompass-svc
    spec:
      serviceAccountName: bcompass-svc-sa
      containers:
        - name: bcompass-svc
          image: skull/bcompass:latest
          ports:
            - containerPort: 8080
              name: http

          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10


