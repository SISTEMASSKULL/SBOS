# manifest.yml — Ficha langfuse (SBOS-005 §aiserver)
# SBOS-049 §4 · Order 425 · Deployment
identity:
  id: langfuse
  name: Langfuse LLM Obs
  version: "2.4"
  category: 1
  criticality: false
  server: aiserver
  description: "LLM observability: traces, costs, evals"

workload:
  type: Deployment
  namespace: sbos-ai
  replicas: 1
  service_account: langfuse-sa

order:
  execution_order: 425
  timeout_minutes: 15

requirements:
  dependencies:
    - postgresql
    - keycloak
  cpu_request: "200m"
  cpu_limit: "1000m"
  memory_request: "256Mi"
  memory_limit: "512Mi"


deployment:
  strategy: RollingUpdate

governance:


health:
  check_command: "curl -sf http://localhost:3000/api/public/health"
  check_interval_seconds: 30
  check_timeout_seconds: 10
  consecutive_failures_threshold: 3

