---
apiVersion: v1
kind: Service
metadata:
  name: sbos-bootstrap-k8s
  namespace: sbos-installer
spec:
  type: ClusterIP
  selector:
    app: sbos-bootstrap-k8s
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sbos-bootstrap-k8s
  namespace: sbos-installer
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: sbos-bootstrap-k8s
  template:
    metadata:
      labels:
        app: sbos-bootstrap-k8s
    spec:
      serviceAccountName: sbos-bootstrap-k8s-sa
      containers:
        - name: sbos-bootstrap-k8s
          image: docker.io/library/ubuntu:26.04
          ports:
            - containerPort: 80
              name: http

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10


