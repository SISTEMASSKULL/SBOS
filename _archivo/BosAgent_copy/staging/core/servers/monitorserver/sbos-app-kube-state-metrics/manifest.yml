# manifest.yml — Ficha kube-state-metrics (SBOS-005 §S12)
# SBOS-049 §4 · Order 202 · DaemonSet
# Expone métricas de objetos K8s (pods, nodes, deployments) para Prometheus
identity:
  id: kube-state-metrics
  name: Kube State Metrics
  version: "2.13.0"
  category: 1
  criticality: false
  server: monitorserver
  description: "K8s object metrics exporter — pods/nodes/deployments → Prometheus"

workload:
  type: DaemonSet
  namespace: sbos-monitor
  replicas: 1
  service_account: kube-state-metrics-sa

order:
  execution_order: 202
  timeout_minutes: 10

requirements:
  dependencies:
    - prometheus
  cpu_request: "50m"
  cpu_limit: "200m"
  memory_request: "128Mi"
  memory_limit: "256Mi"
  pvc_size: ""
  pvc_storage_class: ""

deployment:
  strategy: RollingUpdate

governance:
  backup_enabled: false
  backup_schedule: ""

health:
  check_command: "curl -sf http://localhost:8080/healthz"
  check_interval_seconds: 30
  check_timeout_seconds: 10
  consecutive_failures_threshold: 3
  degraded_allowed: true
  degraded_reason: "Prometheus puede no estar disponible hasta que su ficha se construya"

integrations:
  prometheus:
    scrape_port: 8080
    scrape_path: "/metrics"
  exporters:
    self_metrics: true
