# manifest.yml — Ficha prometheus (SBOS-035 Ficha 14)
# SBOS-049 §4 · Order 200 · StatefulSet
# Bootstrap observabilidad: scrape de métricas de todos los agentes y servicios
identity:
  id: prometheus
  name: Prometheus
  version: "3.5.0"
  category: 1
  criticality: true
  server: monitorserver
  description: "Métricas y alertas — retención 90d, scrape 30s, SLO recording rules"

workload:
  type: StatefulSet
  namespace: sbos-monitor
  replicas: 1
  service_account: prometheus-sa

order:
  execution_order: 200
  timeout_minutes: 20

requirements:
  dependencies:
    - network-validator
  cpu_request: "500m"
  cpu_limit: "2000m"
  memory_request: "2Gi"
  memory_limit: "4Gi"
  pvc_size: "100Gi"
  pvc_storage_class: "sbos-fast"

deployment:
  strategy: Recreate

governance:
  auto_install: false
  backup_enabled: false
  backup_schedule: ""

health:
  check_command: "curl -sf http://localhost:9090/-/healthy"
  check_interval_seconds: 30
  check_timeout_seconds: 10
  consecutive_failures_threshold: 3

integrations:
  alertmanager:
    url: "http://alertmanager.sbos-monitor:9093"
  datasources:
    - name: Prometheus
      type: prometheus
      url: "http://prometheus.sbos-monitor:9090"
