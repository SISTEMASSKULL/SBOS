---
apiVersion: v1
kind: Service
metadata:
  name: jasperstarter
  namespace: sbos-apps
spec:
  type: ClusterIP
  selector:
    app: jasperstarter
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jasperstarter
  namespace: sbos-apps
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: jasperstarter
  template:
    metadata:
      labels:
        app: jasperstarter
    spec:
      serviceAccountName: jasperstarter-sa
      containers:
        - name: jasperstarter
          image: docker.io/library/openjdk:17-slim
          ports:
            - containerPort: 8080
              name: http

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10


