# yaml_engine.yml — mongodb lifecycle phases
# SBOS-049 §4.4 · Order · statefulset
# R16 Zero hardcoding

pre_install:
  - name: "create_namespace"
    command: "kubectl create namespace sbos-comms --dry-run=client -o yaml | kubectl apply -f -"
    timeout_seconds: 30
  - name: "apply_network_policy"
    command: "sbos_k8s_core apply -f ${SBOS_FICHA_DIR}/mongodb.network -n sbos-comms"
    timeout_seconds: 30

install:
  - name: "apply_manifest"
    command: "sbos_k8s_core apply -f ${SBOS_FICHA_DIR}/mongodb.k8s.yml -n sbos-comms"
    timeout_seconds: 300
  - name: "wait_ready"
    command: "kubectl wait --for=condition=Ready pod/mongodb-0 -n sbos-comms --timeout=600s"
    timeout_seconds: 600

post_install:
  - name: "verify"
    command: "echo 'verify_ok'"
    timeout_seconds: 30

update:
  - name: "rolling_restart"
    command: "kubectl rollout restart statefulset mongodb -n sbos-comms"
    timeout_seconds: 300

repair:
  - name: "restart"
    command: "kubectl rollout restart statefulset mongodb -n sbos-comms"
    timeout_seconds: 120

uninstall:
  - name: "delete_manifest"
    command: "kubectl delete statefulset mongodb -n sbos-comms --ignore-not-found"
    timeout_seconds: 120
  - name: "delete_pvc"
    command: "kubectl delete pvc mongodb-data -n sbos-comms --ignore-not-found"
    timeout_seconds: 60
